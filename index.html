async function nLogin(u){
  try{if(NT.ch){SOC.sb.removeChannel(NT.ch);NT.ch=null}}catch(e){}
  if(!u){NT.unread=0;nBell();return}
  nCount();
  NT.ch=SOC.sb.channel('notif-'+u.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${u.id}`},pl=>{
    NT.unread++;nBell();const n=pl.new;if(n.kind!=='message'){loadProfiles([n.actor_id]).then(()=>{const d=document.createElement('div');d.innerHTML=nLine(n);toast(d.textContent)}).catch(()=>{})}}).subscribe();
  if(NATIVE&&NATIVE.notifKey){try{const k=NATIVE.notifKey();await SOC.sb.rpc('notif_register',{p_key:k});
    const r=await SOC.sb.from('notifications').select('id').eq('user_id',u.id).order('id',{ascending:false}).limit(1);if(r.data&&r.data[0])NATIVE.notifSetAfter(r.data[0].id)}catch(e){}
    let asked=false;try{asked=localStorage.getItem('athos.notifAsked')==='1'}catch(e){}
    if(!asked&&!NATIVE.notifAllowed()){try{localStorage.setItem('athos.notifAsked','1')}catch(e){}setTimeout(()=>NATIVE.notifPermission(),2500)}}
  nPush()}
async function nLogout(){if(!NATIVE||!NATIVE.notifKey)return;try{await SOC.sb.rpc('notif_unregister',{p_key:NATIVE.notifKey()})}catch(e){}try{NATIVE.notifResetKey()}catch(e){}}
setInterval(()=>{const id=SOC&&SOC.user?SOC.user.id:null;if(id===NT.uid)return;const was=NT.uid;NT.uid=id;
  if(id)nLogin(SOC.user);else{nLogin(null);if(was)nLogout()}nPush()},1500);

/* --- níveis --- */
const TIERS=[[1,'Bronze','#D08B4F'],[5,'Prata','#C9CED6'],[10,'Ouro','#E9B640'],[15,'Platina','#7FD6C8'],[20,'Diamante','#7FB2FF'],[30,'Lenda','#FF7A59']];
const xpFor=L=>50*L*(L-1);
function lvOf(xp){xp=Math.max(0,xp|0);let L=1;while(xpFor(L+1)<=xp)L++;const t=[...TIERS].reverse().find(x=>L>=x[0]);return{L,xp,from:xpFor(L),to:xpFor(L+1),tier:t[1],color:t[2]}}
function lvTag(xp){if(xp==null)return'';const v=lvOf(xp);return`<span class="lvl" style="--lc:${v.color}" title="Nível ${v.L} · ${v.tier}">Nv ${v.L}</span>`}
function lvBadge(v){return`<span class="lvbadge" style="--lc:${v.color}" aria-hidden="true"><b>${v.L}</b></span>`}

/* --- pontos de cada atividade --- */
function sessKind(s){if(s.run)return s.run.type==='walk'?'walk':s.run.type==='bike'?'bike':'run';return s.checkin?'checkin':'workout'}
function sessPoints(s){const k=sessKind(s);
  if(k==='workout')return 50+Math.min(50,10*(s.prs||[]).length);
  if(k==='checkin')return 25;
  const km=(s.run.dist||0)/1000;return Math.min(300,Math.round(20+km*(k==='run'?10:k==='walk'?6:4)))}
function xpRows(){const rows=[];const days=new Set();
  for(const s of Object.values(S.sessions)){if(!s||!s.date)continue;const k=sessKind(s);
    rows.push({ref:'s:'+s.id,day:s.date,kind:k,km:s.run?Math.round((s.run.dist||0)/10)/100:0,points:sessPoints(s)});days.add(s.date)}
  for(const d of Object.keys(S.days)){if(isActive(d))days.add(d)}
  for(const d of days)rows.push({ref:'d:'+d,day:d,kind:'day',km:0,points:10});
  return rows}
function myLocalXp(){return xpRows().reduce((a,r)=>a+r.points,0)}

/* --- envio para a nuvem --- */
const XP={sent:null,uid:null,busy:false,medals:null,lastL:null};
function xpKey(){return'athos.xp.'+(SOC.user?SOC.user.id:'')}
function xpLoadSent(){if(XP.uid===SOC.user.id&&XP.sent)return;XP.uid=SOC.user.id;try{XP.sent=new Set(JSON.parse(localStorage.getItem(xpKey())||'[]'))}catch(e){XP.sent=new Set()}}
function xpSaveSent(){try{localStorage.setItem(xpKey(),JSON.stringify([...XP.sent]))}catch(e){}}
async function xpSync(){if(!SOC.user||XP.busy)return;XP.busy=true;
  try{xpLoadSent();const todo=xpRows().filter(r=>!XP.sent.has(r.ref));
    for(let i=0;i<todo.length;i+=100){const part=todo.slice(i,i+100).map(r=>({...r,user_id:SOC.user.id}));
      const {error}=await SOC.sb.from('activity_log').upsert(part,{onConflict:'user_id,ref',ignoreDuplicates:true});if(error)throw error;
      part.forEach(r=>XP.sent.add(r.ref));xpSaveSent()}
    await medalCheck();
    if(todo.length||XP.lastL==null)await xpRefresh();
  }catch(e){}finally{XP.busy=false}}
async function xpRefresh(){try{const r=await SOC.sb.from('profiles').select('xp').eq('id',SOC.user.id).single();if(r.data){SOC.me=Object.assign(SOC.me||{},{xp:r.data.xp});SOC.prof[SOC.user.id]=Object.assign(SOC.prof[SOC.user.id]||{},{xp:r.data.xp});
  const v=lvOf(r.data.xp);let seen=null;try{seen=+localStorage.getItem('athos.lvl.'+SOC.user.id)||null}catch(e){}
  if(seen&&v.L>seen)lvUpSheet(v);try{localStorage.setItem('athos.lvl.'+SOC.user.id,v.L)}catch(e){}XP.lastL=v.L;render()}}catch(e){}}
function lvUpSheet(v){openSheet('Subiu de nível!',`<div class="lvup" style="--lc:${v.color}">${lvBadge(v)}<h2 style="font:800 30px var(--display);text-transform:uppercase;margin:0">Nível ${v.L}</h2><p>Você agora é <b>${v.tier}</b>. Continue treinando para chegar ao nível ${v.L+1}.</p></div><button class="btn primary block" data-close>Bora!</button>`);try{NATIVE&&NATIVE.vibrate&&NATIVE.vibrate()}catch(e){}}

/* --- desafios do mês --- */
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const CHS=[
  {id:'km50',t:'50 km no mês',d:'Some 50 km correndo ou caminhando.',m:'km',goal:50,u:'km',i:'🏃'},
  {id:'treinos16',t:'16 treinos no mês',d:'Finalize 16 treinos (check-in também conta).',m:'workouts',goal:16,u:'treinos',i:'🏋️'},
  {id:'dias20',t:'20 dias ativos',d:'Registre treino, corrida ou refeição em 20 dias diferentes.',m:'days',goal:20,u:'dias',i:'🔥'},
  {id:'run10',t:'Uma corrida de 10 km',d:'Complete uma única corrida de 10 km ou mais.',m:'long_run',goal:10,u:'km',i:'🎯'},
  {id:'pedal100',t:'100 km de pedal',d:'Some 100 km pedalando.',m:'bike_km',goal:100,u:'km',i:'🚴'}];
function monthRange(d){d=d||new Date();const y=d.getFullYear(),m=d.getMonth();const z=n=>String(n).padStart(2,'0');
  return{key:`${y}-${z(m+1)}`,from:`${y}-${z(m+1)}-01`,to:`${y}-${z(m+1)}-${z(new Date(y,m+1,0).getDate())}`,name:MESES[m],left:new Date(y,m+1,0).getDate()-d.getDate()}}
function chValue(c,mr){const rows=xpRows().filter(r=>r.day>=mr.from&&r.day<=mr.to);
  switch(c.m){case'km':return rows.filter(r=>r.kind==='run'||r.kind==='walk').reduce((a,r)=>a+r.km,0);
    case'bike_km':return rows.filter(r=>r.kind==='bike').reduce((a,r)=>a+r.km,0);
    case'long_run':return Math.max(0,...rows.filter(r=>r.kind==='run').map(r=>r.km));
    case'workouts':return rows.filter(r=>r.kind==='workout'||r.kind==='checkin').length;
    case'days':return new Set(rows.map(r=>r.day)).size;default:return 0}}
const fmtV=(c,v)=>c.u==='km'?fmtD(Math.floor(v*10)/10):fmtN(Math.floor(v));
const CH={joined:null,loading:false,boards:{}};
async function chLoad(){if(!SOC.user||CH.loading)return;CH.loading=true;
  try{const mr=monthRange();const [j,md]=await Promise.all([sbq(SOC.sb.from('challenge_members').select('key').eq('user_id',SOC.user.id).like('key',mr.key+':%')),sbq(SOC.sb.from('medals').select('*').eq('user_id',SOC.user.id).order('created_at',{ascending:false}))]);
    CH.joined=new Set(j.map(x=>x.key));XP.medals=md;
    await Promise.all(CHS.filter(c=>CH.joined.has(mr.key+':'+c.id)).map(c=>chBoard(c,mr,true)));
  }catch(e){CH.joined=CH.joined||new Set();XP.medals=XP.medals||[]}finally{CH.loading=false;render()}}
async function chBoard(c,mr,quiet){const key=mr.key+':'+c.id;
  try{const b=await sbq(SOC.sb.rpc('challenge_board',{p_key:key,p_metric:c.m,p_from:mr.from,p_to:mr.to}));await loadProfiles(b.map(x=>x.user_id));CH.boards[key]=b;if(!quiet)render();return b}catch(e){return null}}
async function medalCheck(){if(!SOC.user)return;const mr=monthRange();
  if(!XP.medals){try{XP.medals=await sbq(SOC.sb.from('medals').select('*').eq('user_id',SOC.user.id))}catch(e){return}}
  const have=new Set(XP.medals.map(m=>m.key));
  for(const c of CHS){const key=mr.key+':'+c.id;if(have.has(key))continue;if(chValue(c,mr)<c.goal)continue;
    const row={user_id:SOC.user.id,key,title:`${c.t} · ${mr.name}`,icon:c.i};
    try{const {error}=await SOC.sb.from('medals').insert(row);if(!error){XP.medals.unshift({...row,created_at:new Date().toISOString()});

function runPRs(s){if(!s.run)return[];const r=s.run,prev=Object.values(S.sessions).filter(x=>x.run&&x.id!==s.id&&x.run.type===r.type&&(x.ts||0)<(s.ts||Date.now()));const out=[];
  const best=(f,lo)=>{const v=prev.map(x=>x.run[f]).filter(Boolean);return v.length?(lo?Math.min(...v):Math.max(...v)):null};
  if(r.type==='run'){const b1=best('best1k',true);if(r.best1k&&(!b1||r.best1k<b1))out.push('Melhor 1 km');const b5=best('best5k',true);if(r.best5k&&(!b5||r.best5k<b5))out.push('Melhor 5 km')}
  const bd=best('dist');if(prev.length&&r.dist>(bd||0)&&r.dist>=1000)out.push(r.type==='bike'?'Maior pedal':r.type==='walk'?'Maior caminhada':'Maior corrida');
  return out}

/* ---------- Fotos de evolução na nuvem ----------
   Pasta privada "progresso" (só o dono vê). Até 20 fotos por conta: ao chegar em 20,
   as 10 mais antigas saem da nuvem (continuam no aparelho onde estão).
   Quem fica 30 dias sem abrir o app perde as fotos da nuvem (limpeza diária no servidor). */
const PPC={busy:false,again:false,n:null,touched:0};
const PPC_MAX=20,PPC_DROP=10;
function ppcOn(){return!!(typeof SOC!=='undefined'&&SOC&&SOC.sb&&SOC.user)}
function ppcPath(id){return SOC.user.id+'/'+id+'.jpg'}
function ppcNote(empty){if(!ppcOn())return'As fotos ficam só neste aparelho.';
  const n=PPC.n==null?'':` (${PPC.n} de ${PPC_MAX})`;
  return empty?`Ficam neste aparelho e numa pasta privada da sua conta, que só você vê. A nuvem guarda até ${PPC_MAX} fotos: ao chegar em ${PPC_MAX}, as ${PPC_DROP} mais antigas saem da nuvem, mas continuam neste aparelho. Se ficar 30 dias sem abrir o ATHOS, as fotos da nuvem são apagadas.`
    :`Só você vê. ☁ na nuvem${n}; ao chegar em ${PPC_MAX}, as ${PPC_DROP} mais antigas saem da nuvem. 30 dias sem abrir o app apaga as da nuvem.`}
function ppcBlob(d){const b=atob(d.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:'image/jpeg'})}
function ppcData(bl){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(bl)})}
function ppcTell(n){PPC.n=n;try{NATIVE&&NATIVE.ppCloud&&NATIVE.ppCloud(n)}catch(e){}}
async function ppcTouch(force){if(!ppcOn())return;const now=Date.now();if(!force&&now-PPC.touched<3600e3)return;PPC.touched=now;try{await SOC.sb.rpc('touch_active')}catch(e){}}
async function ppcRows(){const r=await SOC.sb.from('progress_photos').select('id,taken,created_at').eq('user_id',SOC.user.id).order('created_at',{ascending:true});if(r.error)throw r.error;return r.data||[]}
async function ppcUpload(it){const data=await ppGet(it.id);if(!data)return false;
  const up=await SOC.sb.storage.from('progresso').upload(ppcPath(it.id),ppcBlob(data),{contentType:'image/jpeg',upsert:false});
  if(up.error&&!/exist|duplicate/i.test(up.error.message||''))throw up.error;
  const ins=await SOC.sb.from('progress_photos').insert({user_id:SOC.user.id,id:it.id,taken:it.date});
  if(ins.error&&!/duplicate|23505/i.test((ins.error.message||'')+(ins.error.code||''))){await SOC.sb.storage.from('progresso').remove([ppcPath(it.id)]).catch(()=>{});throw ins.error}
  it.c=1;return true}
/* chegou em 20: as 10 mais antigas saem da nuvem */
async function ppcRotate(rows){if(rows.length<PPC_MAX)return rows;const old=rows.slice(0,PPC_DROP),ids=old.map(x=>x.id);
  const rm=await SOC.sb.storage.from('progresso').remove(ids.map(ppcPath));if(rm.error)throw rm.error;
  const del=await SOC.sb.from('progress_photos').delete().eq('user_id',SOC.user.id).in('id',ids);if(del.error)throw del.error;
  ppIdx().forEach(it=>{if(ids.includes(it.id))it.c=-1});ppSaveIdx();
  toast(`Sua nuvem chegou a ${PPC_MAX} fotos: as ${PPC_DROP} mais antigas saíram da nuvem (continuam neste aparelho).`);
  return rows.slice(PPC_DROP)}
async function ppcSync(loud){if(!ppcOn())return;if(PPC.busy){PPC.again=true;return}PPC.busy=true;
  try{ppcTouch();let rows=await ppcRows();const L=ppIdx();let ch=false;
    /* baixa as da nuvem que não estão neste aparelho (celular novo, por exemplo) */
    for(const r of rows){const it=L.find(z=>z.id===r.id);if(it){if(it.c!==1){it.c=1;ch=true}continue}
      const d=await SOC.sb.storage.from('progresso').download(ppcPath(r.id));if(d.error||!d.data)continue;
      await ppPut(r.id,await ppcData(d.data));L.push({id:r.id,date:r.taken,c:1,u:SOC.user.id});ch=true}
    /* as que estavam na nuvem e sumiram de lá (outro aparelho girou ou a limpeza dos 30 dias) */
    for(const it of L)if(it.c===1&&!rows.find(r=>r.id===it.id)){it.c=-1;ch=true}
    /* envia as novas, da mais antiga para a mais nova */
    const pend=L.filter(it=>!it.c).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    for(const it of pend){rows=await ppcRotate(rows);if(await ppcUpload(it)){rows.push({id:it.id,taken:it.date});ch=true}}
    rows=await ppcRotate(rows);
    if(ch)ppSaveIdx();ppcTell(rows.length);
    if(loud&&pend.length)toast('Foto guardada na sua nuvem privada');
    if(S.tab==='evolucao'&&!sheets.length)render()}
  catch(e){if(loud)toast('A foto ficou no aparelho. Envio para a nuvem quando a internet voltar.')}
  finally{PPC.busy=false;if(PPC.again){PPC.again=false;setTimeout(()=>ppcSync(),500)}}}
/* apagar a foto também apaga da nuvem */
{const _del=ppDel;ppDel=async function(id){await _del(id);if(!ppcOn())return;try{await SOC.sb.storage.from('progresso').remove([ppcPath(id)]);await SOC.sb.from('progress_photos').delete().eq('user_id',SOC.user.id).eq('id',id);ppcSync()}catch(e){}}}

const CL_KINDS=[['academia','Academia','🏋️'],['corrida','Corrida','🏃'],['ciclismo','Ciclismo','🚴'],['crossfit','Crossfit','🤸'],['luta','Luta','🥊'],['funcional','Funcional','⚡'],['outro','Outro','⭐']];

const clColor=c=>c&&/^#[0-9a-fA-F]{6}$/.test(c.color||'')?c.color:CL_COLORS[Math.abs([...String(c&&c.id||'x')].reduce((a,ch)=>a*31+ch.charCodeAt(0)|0,7))%CL_COLORS.length];

const clTile=(c,size)=>`<span class="ctile" style="background:${clColor(c)};${size?`width:${size}px;height:${size}px;font-size:${Math.round(size*.5)}px`:''}">${esc(clIcon(c))}</span>`;
const hm=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function dayLbl(ts){const d=new Date(ts),n=new Date();const y=new Date(n);y.setDate(n.getDate()-1);
  if(dayKey(d)===dayKey(n))return'Hoje';if(dayKey(d)===dayKey(y))return'Ontem';
  return d.toLocaleDateString('pt-BR',{weekday:(n-d)<6*864e5?'long':undefined,day:'numeric',month:'short',year:d.getFullYear()!==n.getFullYear()?'numeric':undefined})}
function cvTime(ts){if(!ts)return'';const d=new Date(ts),n=new Date();if(dayKey(d)===dayKey(n))return hm(ts);const diff=(n-d)/864e5;
  if(diff<2&&dayLbl(ts)==='Ontem')return'Ontem';if(diff<7)return d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}
function msgPreview(m){if(!m)return'Sem mensagens ainda';const who=m.user_id===SOC.user.id?'Você: ':'';
  if(m.kind&&m.kind!=='text')return who+msgLabel(m);return who+String(m.body||'')}

const isJumbo=t=>{const s=String(t||'').trim();if(!s||s.length>24)return false;try{return /^(\p{Extended_Pictographic}|\p{Emoji_Modifier}|\u200d|\ufe0f|\s)+$/u.test(s)&&[...s.replace(/\s/g,'')].filter(ch=>/\p{Extended_Pictographic}/u.test(ch)).length<=3}catch(e){return false}};
const CHURL={},CHBLOB={};
async function chatBlobUrl(path){if(CHBLOB[path])return CHBLOB[path];const u=await chatUrl(path);const r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);const bl=await r.blob();CHBLOB[path]=URL.createObjectURL(bl);return CHBLOB[path]}
async function chatUrl(path){if(CHURL[path]&&CHURL[path].t>Date.now())return CHURL[path].u;
  const r=await SOC.sb.storage.from('chat').createSignedUrl(path,3600);if(r.error||!r.data)throw r.error||new Error('sem url');
  const u=r.data.signedUrl||r.data.signedURL;CHURL[path]={u,t:Date.now()+50*60e3};return u}
function chatHydrate(root){root.querySelectorAll('img.chimg[data-path]:not([src])').forEach(async im=>{try{im.src=await chatUrl(im.dataset.path)}catch(e){im.alt='Foto indisponível'}})}
function photoViewer(path,who,when){const w=document.createElement('div');w.className='pv';w.innerHTML=`<div class="tb"><button class="icon-btn" data-x aria-label="Fechar">✕</button><b>${esc(who)}<small style="display:block;font-weight:400;opacity:.7">${esc(when)}</small></b></div><div class="im">${thinking('Abrindo…')}</div>`;
  document.body.appendChild(w);w.querySelector('[data-x]').onclick=()=>w.remove();
  chatUrl(path).then(u=>{w.querySelector('.im').innerHTML=`<img src="${esc(u)}" alt="Foto">`}).catch(()=>{w.querySelector('.im').innerHTML='<p style="color:#fff">Não consegui abrir a foto.</p>'})}
const AUD={a:null,id:null};
function fmtSec(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function audWave(seed){let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))|0;let out='';for(let i=0;i<28;i++){h=(h*1103515245+12345)|0;out+=`<i style="height:${25+Math.abs(h>>16)%75}%"></i>`}return out}
async function audToggle(btn){const path=btn.dataset.path,box=btn.closest('.aud');
  if(AUD.id===path&&AUD.a){if(AUD.a.paused){AUD.a.play()}else{AUD.a.pause()}return}
  if(AUD.a){try{AUD.a.pause()}catch(e){}document.querySelectorAll('.aud .pl').forEach(b=>b.textContent='▶')}
  btn.textContent='…';
  try{const a=new Audio();a.preload='auto';a.src=await chatBlobUrl(path);AUD.a=a;AUD.id=path;
    const bars=[...box.querySelectorAll('.wv i')],lab=box.querySelector('small'),dur=+box.dataset.dur||0;
    a.onplay=()=>{btn.textContent='❚❚'};a.onpause=()=>{btn.textContent='▶'};
    a.ontimeupdate=()=>{const d=isFinite(a.duration)&&a.duration>0?a.duration:dur;const p=d?a.currentTime/d:0;bars.forEach((b,i)=>b.classList.toggle('on',i/bars.length<p));lab.textContent=fmtSec(a.currentTime)};
    a.onended=()=>{btn.textContent='▶';bars.forEach(b=>b.classList.remove('on'));lab.textContent=fmtSec(dur);AUD.id=null};
    await a.play()}catch(e){btn.textContent='▶';toast('Não consegui tocar o áudio')}}
const msgLabel=m=>m.kind==='share'?'💪 '+((m.meta&&m.meta.t)||'Treino'):m.kind==='image'?'📷 Foto':m.kind==='audio'?'🎤 Áudio'+(m.meta&&m.meta.dur?' ('+fmtSec(m.meta.dur)+')':''):m.body;

    <div class="chcomp"><div id="chRep"></div><div id="chEmo"></div><div id="chRec" hidden></div><div class="chin" id="chIn"><button class="rbtn" data-s="plus" aria-label="Anexar">${SVG_PLUS}</button><div class="chfield"><button class="embtn" data-s="emo" aria-label="Emojis">😊</button><textarea id="chatIn" rows="1" placeholder="Mensagem" maxlength="2000"></textarea><button class="embtn" data-s="cam" aria-label="Mandar foto">${SVG_CAM}</button></div><button class="rbtn send" data-s="send" aria-label="Gravar áudio">${SVG_MIC}</button></div></div>`,async(b,el)=>{

    const drawHd=()=>{hd.innerHTML=`<button class="icon-btn" data-close aria-label="Voltar">←</button><button class="chh" data-s="who">${c.is_group?clTile(cl||{id:c.id},42):avatar(p)}<span class="t"><b>${esc(c.title)}</b>${sub()}</span></button><button class="icon-btn" data-s="menu" aria-label="Opções">${SVG_DOTS}</button>`};drawHd();
    const box=b.querySelector('#chatBox');let list=[],rx={},otherRead=c.otherRead||null,reply=null;
    const byId=id=>list.find(m=>m.id===id);
    const bodyHtml=m=>{
      if(m.kind==='image'){const x=m.meta||{};return`<img class="chimg" data-path="${esc(x.path||'')}" data-s="img" data-id="${m.id}" alt="Foto"${x.w&&x.h?` style="aspect-ratio:${+x.w}/${+x.h}"`:''}>`}
      if(m.kind==='audio'){const x=m.meta||{};return`<span class="aud" data-dur="${+x.dur||0}"><button class="pl" data-s="play" data-path="${esc(x.path||'')}" aria-label="Tocar áudio">▶</button><span class="wv">${audWave(x.path||m.id)}</span><small>${fmtSec(x.dur)}</small></span>`}
      if(m.kind==='share'){const x=m.meta||{};return`<span class="shr"><span class="ic">${esc(x.i||'💪')}</span><span><b>${esc(x.t||'Treino')}</b><small>${esc(x.sub||'')}${x.d?' · '+esc(dlabel(x.d,{day:'numeric',month:'short'})):''}</small></span></span>`}return esc(m.body)};
    const draw=()=>{if(!list.length){box.innerHTML=`<div class="empty" style="margin:auto 0"><b>${c.is_group?'Comece a conversa do clube':'Diga oi! 👋'}</b><span>${c.is_group?'Combine treinos, mande desafios e motive a galera.':'Mande texto, foto, áudio (segure o 🎤) ou seu treino pelo +.'}</span></div>`;return}
      let h='',pd='',pu='',pt=0;const myLast=[...list].reverse().find(m=>m.user_id===SOC.user.id);

        if(r.length)h+=`<div class="rxw${me?' me':''}"><div class="rx">${Object.entries(agg).map(([e,n])=>`<span class="${r.some(x=>x.emoji===e&&x.user_id===SOC.user.id)?'mine':''}">${e}${n>1?' '+n:''}</span>`).join('')}</div></div>`;
        if(!c.is_group&&me&&m===myLast&&otherRead&&new Date(otherRead)>=new Date(m.created_at))h+=`<span class="seen">Visto ✓✓</span>`;
        pd=dk;pu=m.user_id;pt=t}
      box.innerHTML=h;chatHydrate(box);b.scrollTop=b.scrollHeight;box.querySelectorAll('img.chimg').forEach(im=>im.addEventListener('load',()=>{if(b.scrollHeight-b.scrollTop-b.clientHeight<400)b.scrollTop=b.scrollHeight},{once:true}))};

    const loadRx=async()=>{const ids=list.map(m=>m.id);if(!ids.length)return;try{const r=await sbq(SOC.sb.from('message_reactions').select('*').in('message_id',ids));rx={};r.forEach(x=>{(rx[x.message_id]=rx[x.message_id]||[]).push(x)})}catch(e){}};

    catch(e){box.innerHTML=`<p class="hint">${esc(sbErr(e))}</p>`}
    const ta=b.querySelector('#chatIn');
    const grow=()=>{ta.style.height='44px';ta.style.height=Math.min(120,ta.scrollHeight)+'px'};ta.addEventListener('input',grow);
    const sendRow=async row=>{try{const m=(await sbq(SOC.sb.from('messages').insert({conversation_id:convId,user_id:SOC.user.id,...row}).select()))[0];if(!list.some(x=>x.id===m.id)){list.push(m);draw()}return true}catch(err){toast(sbErr(err));return false}};

    const send=async()=>{const body=ta.value.trim();if(!body)return;ta.value='';grow();setBtn();const rp=reply;reply=null;drawRep();

      const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];const mt=types.find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}})||'';
      REC.chunks=[];REC.cancel=false;REC.r=new MediaRecorder(REC.stream,mt?{mimeType:mt,audioBitsPerSecond:64000}:{audioBitsPerSecond:64000});
      REC.r.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};
      REC.r.onstop=async()=>{const dur=(Date.now()-REC.t0)/1000;const type=(REC.r.mimeType||mt||'audio/webm').split(';')[0];REC.stream.getTracks().forEach(t=>t.stop());REC.r=null;clearInterval(REC.timer);recUi(false);
        if(REC.cancel){toast('Áudio cancelado');return}if(dur<1){toast('Segure o microfone para gravar');return}
        const blob=new Blob(REC.chunks,{type});const ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';

    const recStop=()=>{const r=REC.r;if(!r||r.state==='inactive'||REC.stopping)return;REC.stopping=true;setTimeout(()=>{REC.stopping=false;try{if(r.state!=='inactive')r.stop()}catch(e){}},REC.cancel?0:300)};

function coachContext(){const p=S.profile,g=goals(),td=today(),t=dayTotals(td),w=curWeight(),st=streak();
  const d=new Date();const L=[];
  L.push(`Hoje: ${d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}, ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}.`);
  L.push(`Perfil: ${p.sex==='f'?'mulher':p.sex==='m'?'homem':'sexo não informado'}${p.age?', '+p.age+' anos':''}${p.height?', '+p.height+' cm':''}${w?', '+fmtD(w)+' kg':''}${p.targetWeight?', meta de peso '+p.targetWeight+' kg':''}; objetivo: ${(GOALS[p.goal]||['não definido'])[0]}.`);
  L.push(`Metas do dia: ${fmtN(g.kcal)} kcal, proteína ${fmtN(g.p)} g, carbo ${fmtN(g.c)} g, gordura ${fmtN(g.f)} g, água ${fmtN(g.water||0)} ml.`);
  const day=S.days[td]||{};L.push(`Comido hoje: ${fmtN(t.kcal)} kcal, proteína ${fmtN(t.p)} g, carbo ${fmtN(t.c)} g, gordura ${fmtN(t.f)} g; água ${fmtN(day.water||0)} ml. Faltam ${fmtN(Math.max(0,g.kcal-t.kcal))} kcal e ${fmtN(Math.max(0,g.p-t.p))} g de proteína.`);
  L.push(`Sequência: ${st.n} dia(s)${st.on?' (hoje já registrou)':''}.`);
  const ws=weekOf(td);const wk=sessList().filter(s=>s.date>=ws);L.push(`Nesta semana: ${wk.length} atividade(s).`);
  const ss=sessList().slice(0,6);
  if(ss.length){L.push('Últimas atividades:');for(const s of ss){if(s.run){L.push(`- ${s.date} ${s.run.type==='bike'?'pedal':s.run.type==='walk'?'caminhada':'corrida'} ${km2(s.run.dist||0)} km em ${Math.round((s.run.moving||0)/60)} min`);continue}
    const x=sessStats(s);L.push(`- ${s.date} "${s.name||'Treino'}": ${x.sets} séries, ${fmtN(x.vol)} kg de volume, ${x.dur>0?Math.round(x.dur/60000)+' min, ':''}${(()=>{let k=s.kcal;try{k=k||sessKcal(s).kcal}catch(e){}return k>0?'~'+fmtN(k)+' kcal':''})()}; `+(s.exercises||[]).slice(0,8).map(e=>{const b=bestSet(e);return`${e.name} ${b?setTxt(e.type,b,e.name):''}`}).join('; '))}}
  else L.push('Ainda não registrou treinos.');
  const names=[...new Set(sessList().flatMap(s=>(s.exercises||[]).filter(e=>e.type!=='t').map(e=>e.name)))].slice(0,12);
  if(names.length)L.push('Recordes de carga: '+names.map(n=>`${n} ${fmtD(bestKg(n))} kg`).join('; ')+'.');
  const tp=p.templates||[];if(tp.length){L.push('Fichas salvas:');for(const x of tp.slice(0,8))L.push(`- "${x.name}": `+(x.exercises||[]).map(e=>`${e.name} ${e.sets}x${e.reps}`).join(', '))}
  const nx=typeof nextTemplate==='function'?nextTemplate():null;if(nx)L.push(`Próxima ficha sugerida pelo app: "${nx.name}".`);
  return L.join('\n').slice(0,5000)}

function coachMd(t){const lines=esc(t).split(/\n/);let h='',list=null;
  const fmt=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  const close=()=>{if(list){h+=`</${list}>`;list=null}};
  for(const ln of lines){const ul=ln.match(/^\s*[-•*]\s+(.*)/),ol=ln.match(/^\s*\d+[.)]\s+(.*)/);
    if(ul){if(list!=='ul'){close();h+='<ul>';list='ul'}h+=`<li>${fmt(ul[1])}</li>`;continue}
    if(ol){if(list!=='ol'){close();h+='<ol>';list='ol'}h+=`<li>${fmt(ol[1])}</li>`;continue}
    close();if(ln.trim())h+=`<p>${fmt(ln.replace(/^#+\s*/,''))}</p>`}
  close();return h}
function coachFicha(t){const m=String(t).match(/<ficha>([\s\S]*?)<\/ficha>/i);if(!m)return{text:t,ficha:null};let f=null;try{f=JSON.parse(m[1])}catch(e){try{f=parseLoose(m[1])}catch(_){}}
  return{text:t.replace(m[0],'').trim(),ficha:f&&Array.isArray(f.exercicios)&&f.exercicios.length?f:null}}

/* --- tela do Coach --- */
function coachOpen(q){
  if(typeof SOC==='undefined'||!SOC.user){toast('Entre na sua conta para usar o Coach ATHOS');return}
  if(!coachPers()){coachPersSheet(()=>coachOpen(q));return}
  const el=openSheet('Coach ATHOS',`<div class="cbox" id="cbox"></div><div class="ccomp"><div class="row"><textarea id="cin" rows="1" placeholder="Pergunte ao Coach…" maxlength="800"></textarea><button class="snd" data-c="send" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg></button></div><small id="cuse">O Coach dá orientação geral e não substitui médico ou nutricionista.</small></div>`,(b,el)=>{
    el.querySelector('.sheet').classList.add('coachS');const hd=el.querySelector('.sheet-h');
    const drawHd=()=>{const ps=coachPers();hd.innerHTML=`<button class="icon-btn" data-close aria-label="Fechar">←</button><span class="cch">${coachLogo()}<span class="t"><b>Coach ATHOS</b><small>${ps?ps[1]+' '+esc(ps[2]):''}${typeof AI!=='undefined'&&AI.srvDay===today()&&AI.srvLeft!=null?` · ${AI.srvLeft} perguntas hoje`:''}</small></span></span><button class="icon-btn" data-c="menu" aria-label="Opções">⋯</button>`};drawHd();
    const box=b.querySelector('#cbox'),ta=b.querySelector('#cin');
    const sug=['O que eu treino hoje?','Quanto falta de proteína hoje?','Por que minha carga travou?','Monta um treino de 30 min para hoje','Como está minha evolução?'];
    const draw=()=>{const H=coachHist();
      if(!H.length){box.innerHTML=`<div class="cwel">${coachLogo()}<h3>Fala, atleta!</h3><p>Sou o Coach ATHOS. Conheço seus treinos, cargas, dieta e metas. Pergunta aí:</p><div class="csug">${sug.map(s=>`<button data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;return}
      box.innerHTML=H.map((m,i)=>m.r==='u'?`<div class="cm u">${esc(m.t)}</div>`:`<div class="cm a">${coachMd(m.t)}${m.err?'':''}</div>${m.f?`<div class="cfch"><button class="btn sm primary" data-c="savef" data-i="${i}">💾 Salvar como ficha “${esc(m.f.nome||'Treino do Coach')}”</button></div>`:''}`).join('')+(COACH.busy?`<div class="cm a typing"><i></i><i></i><i></i></div>`:'');
      b.scrollTop=b.scrollHeight};
    draw();
    const grow=()=>{ta.style.height='44px';ta.style.height=Math.min(120,ta.scrollHeight)+'px'};ta.addEventListener('input',grow);
    const ask=async q=>{q=String(q||'').trim();if(!q||COACH.busy)return;const H=coachHist();H.push({r:'u',t:q});coachSave();COACH.busy=true;draw();
      try{const kb=await coachKB(q+' '+(H.slice(-3,-1).map(m=>m.t).join(' ')));
        const past=H.slice(-9,-1).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));
        const turns=[{role:'user',content:coachSystem(kb)+'\n\nResponda à conversa a seguir.'},{role:'assistant',content:'Entendido! Sou o Coach ATHOS.'},...past,{role:'user',content:q}];
        const raw=stripThink(await aiCall(turns,{},false));const{text,ficha}=coachFicha(raw);
        H.push({r:'a',t:text||'Não consegui responder agora.',f:ficha||undefined})}
      catch(e){H.push({r:'a',t:'⚠️ '+(typeof aiMsg==='function'?aiMsg(e):'Não consegui responder agora. Tente de novo.')})}
      COACH.busy=false;coachSave();draw();drawHd()};
    const send=()=>{const q=ta.value;ta.value='';grow();ask(q)};
    el.addEventListener('click',e=>{const x=e.target.closest('[data-c],[data-q]');if(!x||!el.contains(x))return;
      if(x.dataset.q){ask(x.dataset.q);return}
      const k=x.dataset.c;if(k==='send')send();
      if(k==='menu')openSheet('Coach ATHOS',`<div class="mact" style="display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--cardline);border-radius:18px;overflow:hidden"><button class="btn ghost" data-m="pers" style="justify-content:flex-start">🎭 Mudar a personalidade</button><button class="btn ghost" data-m="clear" style="justify-content:flex-start">🧹 Apagar a conversa</button></div><p class="hint">A conversa fica só neste aparelho. Para responder, o Coach envia suas metas, treinos e dieta (sem nome nem e-mail) para o serviço de IA.</p>`,(mb,mw)=>{
        mb.onclick=ev=>{const m=ev.target.closest('[data-m]');if(!m)return;closeSheet(mw);
          if(m.dataset.m==='pers')coachPersSheet(()=>{drawHd()});
          if(m.dataset.m==='clear')confirmSheet('Apagar toda a conversa com o Coach?','Apagar',()=>{coachHist().length=0;coachSave();draw()})}});
      if(k==='savef'){const m=coachHist()[+x.dataset.i];if(!m||!m.f)return;const f=m.f;
        const G=typeof GROUPS!=='undefined'?GROUPS:['Outros'];
        const tpl={id:newId('t'),name:String(f.nome||'Treino do Coach').slice(0,60),exercises:f.exercicios.slice(0,20).map(x2=>{const tempo=/tempo|min/i.test(String(x2.tipo||''));return{name:String(x2.nome||'Exercício').slice(0,60),group:G.includes(x2.grupo)?x2.grupo:'Outros',type:tempo?'t':'w',sets:Math.max(1,Math.min(10,parseInt(x2.series)||3)),reps:String(x2.reps||(tempo?'10':'8-12')).slice(0,12)}})};
        S.profile.templates.push(tpl);store.mark('profile');saveLocal();x.disabled=true;x.textContent='✓ Ficha salva na aba Treino';toast('Ficha salva! Está na aba Treino.');render()}});
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!('ontouchstart' in window)){e.preventDefault();send()}});
    if(q)ask(q);
  });
  return el}
function coachPersSheet(done){const cur=(coachPers()||[])[0];
  openSheet('Escolha o seu Coach',`<p class="hint" style="margin-top:-6px">Como você quer que o Coach ATHOS fale com você? Dá para trocar quando quiser.</p><div class="cpers">${COACH_PERS.map(p=>`<button data-p="${p[0]}" aria-pressed="${cur===p[0]}"><span class="e">${p[1]}</span><span><b>${esc(p[2])}</b><small>${esc(p[3])}</small></span></button>`).join('')}</div>`,(b,el)=>{
    b.onclick=e=>{const x=e.target.closest('[data-p]');if(!x)return;S.profile.coachStyle=x.dataset.p;store.mark('profile');saveLocal();closeSheet(el);toast('Coach '+(coachPers()||[])[2]+' ativado');render();done&&done()}})}

/* --- card no Hoje --- */
function coachCard(){if(typeof SOC==='undefined'||!SOC.user)return'';const ps=coachPers();
  return`<div class="card coach-card"><div class="hd">${coachLogo()}<span style="flex:1;min-width:0"><b>Coach ATHOS</b><small>${ps?ps[1]+' '+esc(ps[2])+' · ':''}pergunte sobre treino, dieta e evolução</small></span><button class="btn sm primary" data-act="coachOpen">Abrir</button></div>
   <div class="cq">${['O que eu treino hoje?','Quanto falta de proteína?','Monta um treino de 30 min'].map(s=>`<button data-act="coachAsk" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`}
{const _k=kcalCard;kcalCard=function(d){const h=_k.apply(this,arguments);return d===today()?h+coachCard():h}}
Object.assign(ACT,{coachOpen:()=>coachOpen(),coachAsk:el=>coachOpen(el.dataset.q),coachPers:()=>coachPersSheet()});

/* --- Configurações: personalidade --- */
{const _c=cfgHtml;cfgHtml=function(){const h=_c.apply(this,arguments);const ps=coachPers();
  const sec=`<p class="cfg-h">Coach ATHOS</p><div class="card"><div class="cfg-row"><span class="t"><b>Personalidade</b><small>${ps?ps[1]+' '+esc(ps[2])+' — '+esc(ps[3]):'Ainda não escolhida'}</small></span><button class="btn sm" data-act="coachPers">Mudar</button></div></div>`;
  const i=h.indexOf('<p class="cfg-h">Treino</p>');return i>=0?h.slice(0,i)+sec+h.slice(i):h+sec}}
window.androidBack=function(){if(window.updBlocking&&window.updBlocking())return true;if(window.tourBack&&window.tourBack())return true;if($('#authGate')&&!$('#authGate').hidden){if(/signup|forgot|reset|verify/.test(ACC.view)){setView('login');return true}return false}if(sheets.length){closeSheet();return true}if($('#run')&&!$('#run').hidden){ACT.runMin();return true}if($('#authGate')&&!$('#authGate').hidden){if(/signup|forgot|reset|verify/.test(ACC.view)){setView('login');return true}return false}if(sheets.length){closeSheet();return true}if(!$('#session').hidden){closeActive();return true}if(S.tab!=='hoje'){go('hoje');return true}return false};
window.androidSaved=function(ok){toast(ok?'Backup salvo':'Backup não foi salvo')};
/* ---------- início ---------- */
loadLocal();
{const h=location.hash.slice(1);if(VIEWS[h])S.tab=h}
render();
if(S.active)$('#activebar').hidden=false;
(async()=>{
  const C=window.claude;if(!C||!C.use)return;
  initDb().then(()=>schedule());
  try{SAMPLE=await C.use('sample');if(SAMPLE){const lim=await SAMPLE.limits().catch(()=>null);SAMPLE_IMG=!!(lim&&lim.images);MAXIMG=lim&&lim.images?Math.max(1,Math.min(8,lim.images.maxCount||1)):1}}catch(e){SAMPLE=null}
  try{DOWNLOADS=await C.use('downloads')}catch(e){DOWNLOADS=null}
  schedule();
})();
})();
