<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><link rel="stylesheet" href="leaflet/leaflet.css"><script src="leaflet/leaflet.js"></script><script src="supabase/supabase.js"></script><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ATHOS"><meta name="theme-color" content="#EEEFF1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><script>window.WEBAPP=true</script></head><body>
<title>ATHOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
/* Layout: app de uma tela — cabeçalho fixo, conteúdo rolável, barra de abas embaixo. Macros usam as cores das anilhas olímpicas (vermelho 25 kg, amarelo 15 kg, verde 10 kg, azul 20 kg). */
:root{
  --bg:#EEEFF1; --surface:#FFFFFF; --surface2:#E7E8EB; --line:#DDDFE3; --cardline:transparent;
  --fg:#111214; --muted:#636975;
  --accent:#DDA623; --accent-ink:#000000; --accent-soft:#F7EDD2; --accent-tx:#8A6100;
  --water:#2F7FE0; --ink:#000000; --ink2:#1E1F23;
  --red:#C9372C; --yellow:#C08A00; --green:#1B8A50; --warn:#B0560B;
  --done:#E3F3EA; --scrim:rgb(0 0 0 / .5);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#121315; --surface2:#1D1F23; --line:#26282D; --cardline:#1F2125;
  --fg:#F2F2F0; --muted:#9298A3;
  --accent:#E9B640; --accent-ink:#000000; --accent-soft:#2B2310; --accent-tx:#F0C45E;
  --water:#5AA2FF; --ink:#141416; --ink2:#232428;
  --red:#FF6656; --yellow:#F0BC2E; --green:#40C983; --warn:#F09A4A;
  --done:#12261B; --scrim:rgb(0 0 0 / .66);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#121315; --surface2:#1D1F23; --line:#26282D; --cardline:#1F2125;
  --fg:#F2F2F0; --muted:#9298A3;
  --accent:#E9B640; --accent-ink:#000000; --accent-soft:#2B2310; --accent-tx:#F0C45E;
  --water:#5AA2FF; --ink:#141416; --ink2:#232428;
  --red:#FF6656; --yellow:#F0BC2E; --green:#40C983; --warn:#F09A4A;
  --done:#12261B; --scrim:rgb(0 0 0 / .66);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:580px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:.08em;text-transform:uppercase}
.mark{display:flex;align-items:center;gap:2px}
.mark i{display:block;width:6px;border-radius:2px}
.mark i:nth-child(1){height:22px;background:var(--red)}
.mark i:nth-child(2){height:18px;background:var(--accent)}
.mark i:nth-child(3){height:14px;background:var(--yellow)}
.mark i:nth-child(4){height:3px;width:12px;background:var(--muted);border-radius:1px}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on b{background:var(--green)}

main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px;padding-block:4px 20px}

/* Tipografia */
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance;letter-spacing:.01em}
h1{font-size:32px;font-weight:700}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:60px;line-height:.86}
.mid{font-size:30px;line-height:.95}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{font-size:13.5px;color:var(--muted)}

/* Blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .num{font-size:26px;line-height:1}
.stat small{color:var(--muted);font-size:12.5px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0;padding-top:2px}
.li .t{min-width:0;display:flex;flex-direction:column}
.li .t b{font-weight:600;overflow-wrap:anywhere}
.li .t small{color:var(--muted);font-size:13px}
button.li{background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;font:inherit;color:inherit}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Botões */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14.5px var(--body);padding:9px 14px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-style:dashed}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13.5px;border-radius:9px}
.btn.danger{background:transparent;color:var(--red);border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.icon-btn{border:0;background:var(--surface2);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-size:16px;flex:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;border:1px solid transparent}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.ok{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.chip.pr{background:color-mix(in srgb,var(--yellow) 18%,transparent);color:var(--yellow)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font:600 13.5px var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .1)}

/* Formulários */
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;color:var(--muted);font-weight:600}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:20px;height:20px;flex:none}

/* Macros / anilhas */
.plate{width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--surface) 0 3px,var(--c,var(--muted)) 3.5px)}
.macro{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.macro .lbl{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.macro .lbl b{font-weight:600}
.macro .lbl span{color:var(--muted);font-variant-numeric:tabular-nums}
.macro .bar{grid-column:2}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit;transition:width .4s ease}
.bar.over i{background:var(--warn)}
.kbar{height:14px}
.p{--c:var(--red)} .c{--c:var(--yellow)} .f{--c:var(--green)} .w{--c:var(--water)}
.cups{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:5px}
.cups i{height:26px;border-radius:5px 5px 7px 7px;background:var(--surface2)}
.cups i.on{background:var(--water)}

/* Treinos */
.tpl{display:flex;flex-direction:column;gap:10px}
.tpl .meta{color:var(--muted);font-size:13.5px}

/* Sessão ativa */
#session{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.s-h{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.s-h .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.s-h .ttl{flex:1;min-width:0}
.s-h h2{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.s-body{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.ex{padding:14px 12px}
.ex-h{display:flex;gap:8px;align-items:flex-start}
.ex-h .t{flex:1;min-width:0}
.ex-h h3{font-size:19px}
.sets{display:flex;flex-direction:column;gap:5px}
.set,.set-h{display:grid;grid-template-columns:22px minmax(0,1fr) 62px 54px 54px 40px;gap:6px;align-items:center}
.set-h{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.set-h span:nth-child(n+3){text-align:center}
.set{padding:3px;border-radius:10px;transition:background .2s}
.set .sn{font-family:var(--display);font-weight:700;text-align:center;color:var(--muted)}
.set .prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input,.set select{padding:7px 4px;text-align:center;font-variant-numeric:tabular-nums;border-radius:8px}
.set select{appearance:none;font-size:14px}
.rir.r0{color:var(--red);font-weight:700}.rir.r1,.rir.r2{color:var(--yellow);font-weight:700}.rir.r3,.rir.r4,.rir.r5{color:var(--green);font-weight:700}
.ck{height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;color:var(--muted)}
.set.done{background:var(--done)}
.set.done .ck{background:var(--green);border-color:var(--green);color:#fff}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--fg);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.restbar .in{max-width:580px;margin:0 auto;display:flex;align-items:center;gap:10px}
.restbar .tt{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
.restbar .lb{flex:1;min-width:0;font-size:13px;opacity:.8}
.restbar .track{height:4px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:9px;margin-top:6px;overflow:hidden}
.restbar .track i{display:block;height:100%;background:var(--bg)}
.restbar button{background:color-mix(in srgb,var(--bg) 14%,transparent);border:0;color:var(--bg);border-radius:9px;height:38px;padding:0 10px;font-weight:700}
.restbar.end{background:var(--green)}

.activebar{position:fixed;z-index:19;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:556px;margin:0 auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;box-shadow:0 6px 20px rgb(0 0 0 / .18)}
.activebar .num{font-size:20px}

/* Barra de abas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;border:0;background:none;color:var(--muted);font:600 11.5px var(--body)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* Sheets */
#sheets .wrapS{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;display:flex;flex-direction:column;width:100%;max-width:620px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet-b{overflow:auto;padding:2px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.result{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.result small{color:var(--muted)}
.picked{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:500}
.thinking i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-item{display:grid;grid-template-columns:auto 1fr 74px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ai-item small{color:var(--muted);display:block}
.tex{display:grid;grid-template-columns:minmax(0,1fr) 58px 66px auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.tex b{font-weight:600;display:block;overflow-wrap:anywhere}
.tex small{color:var(--muted)}
.tex input{padding:6px;text-align:center}
.tex .act{display:flex;gap:4px}
.tex .act button{width:30px;height:30px;border:0;border-radius:8px;background:var(--surface2)}
.mini-l{font-size:10.5px;color:var(--muted);text-align:center;display:block;margin-top:2px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}

/* Gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:500 10px var(--body);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .end{font-weight:700;fill:var(--fg);font-size:11px}
.heat{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.scroll-x{overflow-x:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 18px rgb(0 0 0 / .2)}

.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .icon-btn{position:absolute;top:6px;right:6px;width:30px;height:30px;font-size:13px;background:var(--surface)}
.thumb .pg{position:absolute;left:6px;bottom:6px;background:var(--surface);border-radius:7px;padding:1px 7px;font-weight:700;font-size:12px}
button.thumb.add{border:1.5px dashed var(--line);background:transparent;color:var(--accent-tx);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
button.thumb.add span{font-size:30px;line-height:1}
.route{height:220px;border-radius:12px;overflow:hidden;background:var(--surface2);position:relative}
.route>svg{width:100%;height:100%;display:block}
.splits{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.splits th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 6px 6px 0}
.splits td{padding:6px 6px 6px 0;border-top:1px solid var(--line);white-space:nowrap}
.splits td.bar{width:45%}
.splits .bar i{display:block;height:8px;border-radius:9px;background:var(--accent)}
.splits tr.best td{font-weight:700}
@media (max-width:370px){.big{font-size:50px}.set,.set-h{grid-template-columns:18px minmax(0,1fr) 54px 48px 48px 36px;gap:4px}}
/* ===== ATHOS 2.0 — identidade do ícone: preto, dourado e branco ===== */
body{font-size:15.5px}
.top{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top .wrap{padding-block:12px 10px}
.brand{font-size:22px;letter-spacing:.24em;gap:11px}
.brand img{border-radius:11px}
.sync{font-size:12px}

/* Barra de abas flutuante */
.tabbar{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;

.tab{position:relative;color:#8B9099;padding:9px 0 8px;font-size:11px;gap:3px;transition:color .2s}
.tab svg{width:22px;height:22px;transition:transform .2s}
.tab::after{content:"";position:absolute;bottom:2px;left:50%;width:0;height:3px;border-radius:3px;background:var(--accent);transform:translateX(-50%);transition:width .2s}
.tab[aria-current="page"]{color:var(--accent)}

.tab[aria-current="page"]::after{width:18px}

.tbmenu{flex:none;width:44px;border:0;background:none;color:#8B9099;display:grid;place-items:center;border-radius:16px;margin-right:2px}
.tbmenu svg,.tbfab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.tbmenu:active{background:var(--ink2)}
.tbfab{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;
  border:1px solid var(--ink2);background:var(--ink);color:var(--accent);display:grid;place-items:center;box-shadow:0 12px 28px -8px rgb(0 0 0 / .5);
  transform:scale(.4);opacity:0;pointer-events:none}
.tabbar,.tbfab,.activebar{transition:transform .3s cubic-bezier(.3,.7,.2,1),opacity .25s}
body.tb-min .tabbar{transform:translateY(calc(100% + 24px));opacity:0;pointer-events:none}
body.tb-min .tbfab{transform:none;opacity:1;pointer-events:auto}
body.tb-min .activebar{transform:translateY(68px);right:calc(84px + env(safe-area-inset-right,0px))}
.activebar{bottom:calc(88px + env(safe-area-inset-bottom,0px));border-radius:16px;background:var(--fg);color:var(--bg)}
main{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}

.xt-adj{display:flex;gap:10px;width:100%}.xt-adj .btn{flex:1}
#xtimer .btn.ghost{color:#cfd2d8}

const LKEY='ficha.v1',AKEY='ficha.active';
const NATIVE=window.Android||null;

const store={
  mode:'local',col:null,dirty:new Set(),timers:{},queued:new Set(),chain:Promise.resolve(),
  dataFor(key){
    if(key==='profile')return{kind:'profile',ts:0,...S.profile};
    if(key.startsWith('d-')){const d=S.days[key.slice(2)];return d?{...d,kind:'day',ts:tOf(d.date)}:null}
    const s=S.sessions[key];return s?{...s,kind:'session'}:null;
  },
  mark(key,delay=700){
    this.dirty.add(key);saveLocal();
    if(this.mode!=='db'){this.dirty.delete(key);return}
    clearTimeout(this.timers[key]);
    this.timers[key]=setTimeout(()=>{delete this.timers[key];this.enqueue(key)},delay);
  },
  enqueue(key){
    if(this.queued.has(key))return;this.queued.add(key);
    this.chain=this.chain.then(()=>this.write(key)).catch(()=>{});
  },
  async write(key,retry){
    this.queued.delete(key);
    const data=this.dataFor(key);
    try{
      if(data===null)await this.col.doc(key).delete();else await this.col.doc(key).set(JSON.parse(JSON.stringify(data)));
    }catch(e){
      const c=e&&e.code;
      if(c==='quota_exceeded')toast('Espaço de armazenamento cheio. Exporte um backup e apague registros antigos.');
      else if(c==='unavailable'&&!retry){await new Promise(r=>setTimeout(r,1500+Math.random()*1000));return this.write(key,true)}
      else if(c==='revoked'){this.mode='local';drawSync()}
      else toast('Não consegui salvar na conta. Os dados continuam neste aparelho.');
    }
    if(!this.queued.has(key)&&!this.timers[key])this.dirty.delete(key);
  }
};

async function initDb(){
  const C=window.claude;if(!C||!C.use)return;
  let db=null,user=null,uid=null;
  try{[db,user]=await Promise.all([C.use('db'),C.use('user')]);uid=user?await user.id():null}catch(e){}
  if(!db||!uid)return;
  const col=db.collection('data/users/'+uid);
  store.col=col;
  let prof;
  try{prof=await col.doc('profile').get()}catch(e){return}
  store.mode='db';drawSync();
  if(!prof.exists){
    const hasLocal=Object.keys(S.days).length||Object.keys(S.sessions).length||S.profile.templates.length||S.profile.age;
    if(hasLocal){store.mark('profile',0);for(const d in S.days)store.mark('d-'+d,0);for(const s in S.sessions)store.mark(s,0)}
  }
  col.doc('profile').onSnapshot(snap=>{
    if(!snap.exists||store.dirty.has('profile'))return;
    if(stable(snap.data())===stable(store.dataFor('profile')))return;
    const d=clone(snap.data());delete d.kind;delete d.ts;
    S.profile={...clone(DEF_PROFILE),...d};saveLocal();schedule();
  },()=>{});
  let first=true;
  col.where('kind','in',['day','session']).orderBy('ts','desc').limit(1000).onSnapshot(snap=>{
    if(first){
      first=false;
      const days={},sess={};
      for(const doc of snap.docs){const d=clone(doc.data());if(d.kind==='day')days[d.date]=d;else if(d.kind==='session')sess[doc.id]=d}
      for(const k of store.dirty){if(k.startsWith('d-')&&S.days[k.slice(2)])days[k.slice(2)]=S.days[k.slice(2)];else if(S.sessions[k])sess[k]=S.sessions[k]}
      S.days=days;S.sessions=sess;
    }else{
      let changed=false;
      for(const ch of snap.docChanges()){
        const id=ch.doc.id;if(store.dirty.has(id))continue;
        if(ch.type==='removed'){const had=id.startsWith('d-')?S.days[id.slice(2)]:S.sessions[id];if(had){changed=true;if(id.startsWith('d-'))delete S.days[id.slice(2)];else delete S.sessions[id]}continue}
        if(stable(ch.doc.data())===stable(store.dataFor(id)))continue;
        const d=clone(ch.doc.data()||{});changed=true;
        if(d.kind==='day')S.days[d.date]=d;else if(d.kind==='session')S.sessions[id]=d;
      }
      if(!changed)return;
    }
    saveLocal();schedule();
  },()=>{});
}

/* ---------- cálculos ---------- */
function weightsList(){return Object.values(S.days).filter(d=>d.weight).sort((a,b)=>a.date<b.date?-1:1).map(d=>({date:d.date,kg:d.weight}))}
function curWeight(){const w=weightsList();return w.length?w[w.length-1].kg:S.profile.weight}
function calcGoals(p,w){
  if(!(p.age&&p.height&&w))return null;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='f'?-161:5);
  const tdee=bmr*p.activity;const kcal=Math.round((tdee+GOALS[p.goal][1])/10)*10;
  const prot=Math.round(w*(p.goal==='perder'?2.2:2.0)),fat=Math.round(w*0.9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return{kcal,p:prot,c:carb,f:fat,water:Math.round(w*35/50)*50,bmr:Math.round(bmr),tdee:Math.round(tdee)};
}
function goals(){const p=S.profile;if(p.auto){const g=calcGoals(p,curWeight());if(g)return g}return{kcal:p.kcal,p:p.p,c:p.c,f:p.f,water:p.water}}
function dayTotals(date){const d=S.days[date];const t={kcal:0,p:0,c:0,f:0,n:0};if(!d)return t;for(const[k]of MEALS)for(const it of(d.meals&&d.meals[k])||[]){t.kcal+=num(it.kcal);t.p+=num(it.p);t.c+=num(it.c);t.f+=num(it.f);t.n++}return t}
function mealTotals(items){return items.reduce((a,it)=>({kcal:a.kcal+num(it.kcal),p:a.p+num(it.p),c:a.c+num(it.c),f:a.f+num(it.f)}),{kcal:0,p:0,c:0,f:0})}
const sessList=()=>Object.values(S.sessions).sort((a,b)=>b.ts-a.ts);
const sessionsOn=d=>sessList().filter(s=>s.date===d);
function sessStats(s){let vol=0,sets=0;const g=new Set();for(const x of s.exercises||[]){if(x.group)g.add(x.group);for(const st of x.sets){sets++;if(x.type==='w')vol+=num(st.kg)*num(st.reps)}}return{vol,sets,groups:[...g],dur:(s.end||s.ts)-s.ts}}
/* calorias gastas no treino (estimativa pelo MET, descontando o que o corpo gastaria parado) */
function sessKcal(s){if(!s)return{kcal:0,met:0,lvl:''};if(s.run)return{kcal:Math.round(num(s.run.kcal)),met:0,lvl:''};
  const kg=num(curWeight())||75,x=sessStats(s);const totMin=Math.max(1,x.dur/60000);
  if(s.checkin){const m=s.dur?num(s.dur):Math.min(90,totMin);return{kcal:Math.round(4*kg*m/60),met:5,lvl:'Moderada'}}
  let cMin=0,cKm=0,sets=0;const rirs=[];
  let oKcal=0,oMin=0;
  for(const e of s.exercises||[]){if(e.type==='t'){const d=isDistEx(e.name);for(const st of e.sets){if(d){cMin+=num(st.kg);cKm+=num(st.reps)}else{oMin+=num(st.kg);oKcal+=(timeMet(e.name)-1)*kg*num(st.kg)/60}}}else for(const st of e.sets){sets++;if(st.rir!=null&&st.rir!=='')rirs.push(+st.rir)}}
  cMin=Math.min(cMin,totMin);oMin=Math.min(oMin,totMin-cMin);const sMin=Math.max(0,totMin-cMin-oMin),dens=sMin?sets/sMin:0,rir=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
  let met=3.5;if(dens>=0.2)met+=1;if(dens>=0.33)met+=0.5;if(rir!=null&&rir<=2)met+=1;met=Math.min(6,met);
  const cMet=cKm&&cMin?Math.max(3,Math.min(12,cKm/(cMin/60)*0.95)):7;
  const kcal=Math.round((met-1)*kg*sMin/60+(cMet-1)*kg*cMin/60+oKcal);
  return{kcal,met,lvl:met>=5.5?'Alta':met>=4.5?'Moderada':'Leve'}}
const e1rm=(kg,r)=>kg>0&&r>0?kg*(1+Math.min(r,12)/30):0;
function bestSet(e){let b=null;for(const st of e.sets){if(e.type==='t'){if(!b||num(st.kg)>num(b.kg))b=st}else{const v=e1rm(num(st.kg),num(st.reps));if(!b||v>b.v)b={...st,v}}}return b}
function exVol(e){return e.type==='t'?0:e.sets.reduce((a,st)=>a+num(st.kg)*num(st.reps),0)}
function weekOf(d){const x=new Date(d+'T12:00:00');const wd=(x.getDay()+6)%7;return addDays(d,-wd)}
function lastFor(name,excl){for(const s of sessList()){if(s.id===excl)continue;const x=(s.exercises||[]).find(e=>e.name===name);if(x&&x.sets.length)return{date:s.date,sets:x.sets}}return null}
function bestKg(name,excl){let b=0;for(const s of Object.values(S.sessions)){if(s.id===excl)continue;for(const x of s.exercises||[])if(x.name===name&&x.type!=='t')for(const st of x.sets)if(num(st.reps)>0)b=Math.max(b,num(st.kg))}return b}
function isActive(d){const day=S.days[d];if(day&&day.meals&&MEALS.some(([k])=>(day.meals[k]||[]).length))return true;return Object.values(S.sessions).some(s=>s.date===d)}
function streak(){const t=today();const on=isActive(t);let d=on?t:addDays(t,-1),n=0;while(isActive(d)){n++;d=addDays(d,-1)}return{n,on}}
function allExercises(){return[...EX,...(S.profile.customEx||[])]}
function matchEx(name){const n=norm(name);const all=allExercises();let m=all.find(e=>norm(e.name)===n);if(m)return m;m=all.find(e=>norm(e.name).startsWith(n)||n.startsWith(norm(e.name)));if(m)return m;m=all.find(e=>n.includes(norm(e.name).split(' (')[0]));return m||{name:String(name).trim(),group:'Outros',type:'w'}}
/* exercício por tempo que também tem distância (só cardio de deslocamento) */
const isDistEx=n=>/corrid|correr|caminhad|caminhar|esteira|trote|bike|bicicleta|pedal|ciclis|spinning|el[ií]ptic|transport|remo\b|remada erg|ergômetro|ergometro|nata[cç]|nadar|patin/i.test(String(n||''));
function timeMet(n){n=String(n||'');if(/corda/i.test(n))return 11;if(/prancha|isom|plank|alongament|mobilidade|yoga|ioga/i.test(n))return 3;if(/burpee|polichinelo|hiit|tabata|mountain|escalador|sprint|tiro/i.test(n))return 8;if(/escada|stair/i.test(n))return 8;return 6}
function setTxt(type,s,name){return type==='t'?`${fmtD(num(s.kg))} min${num(s.reps)&&(!name||isDistEx(name))?' · '+fmtD(num(s.reps))+' km':''}`:`${fmtD(num(s.kg))} kg × ${num(s.reps)}`}

/* ---------- gráficos ---------- */
function niceTicks(min,max,n=4){if(max===min){max+=1;min-=1}const raw=(max-min)/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||mag*10;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(Math.round(v*1000)/1000);return{lo,hi,t}}
function lineChart(pts,{color='var(--accent)',unit='',goal=null,h=180}={}){
  if(pts.length<2)return`<p class="hint">Registre pelo menos 2 vezes para ver o gráfico.</p>`;
  const W=340,H=h,L=40,R=46,T=12,B=24;
  const t0=pts[0].t,t1=Math.max(pts[pts.length-1].t,t0+864e5);
  const vals=pts.map(p=>p.v).concat(goal!=null?[goal]:[]);
  let mn=Math.min(...vals),mx=Math.max(...vals);const pad=(mx-mn)*.12||1;
  const{lo,hi,t}=niceTicks(mn-pad,mx+pad);
  const x=v=>L+(v-t0)/(t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const id='g'+Math.random().toString(36).slice(2,7);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  for(const v of t){s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmtD(v)}</text>`}
  const xl=[pts[0].t,pts[pts.length-1].t];if(pts.length>4)xl.splice(1,0,pts[Math.floor(pts.length/2)].t);
  xl.forEach((v,i)=>{const a=i===0?'start':i===xl.length-1?'end':'middle';s+=`<text x="${x(v)}" y="${H-6}" text-anchor="${a}">${new Date(v).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>`});
  if(goal!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-R+4}" y="${y(goal)+3.5}" fill="var(--green)" style="fill:var(--green)">meta</text>`;
  const line=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  s+=`<path d="${line} L${x(pts[pts.length-1].t).toFixed(1)} ${y(lo)} L${x(pts[0].t).toFixed(1)} ${y(lo)} Z" fill="url(#${id})"/>`;
  s+=`<path d="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  const e=pts[pts.length-1];s+=`<circle cx="${x(e.t)}" cy="${y(e.v)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/><text class="end" x="${x(e.t)+8}" y="${y(e.v)+4}">${fmtD(e.v)}${unit}</text>`;
  return s+'</svg>';
}
function barChart(items,{goal=null,color='var(--accent)',h=150}={}){
  const W=340,H=h,L=34,R=8,T=10,B=22;const mx=Math.max(goal||0,...items.map(i=>i.v),1);
  const{hi,t}=niceTicks(0,mx*1.05,3);const y=v=>T+(hi-v)/hi*(H-T-B);
  const bw=(W-L-R)/items.length;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;

function exMetrics(type,name){return type==='t'?(name&&!isDistEx(name)?[['min','Tempo','min']]:[['min','Tempo','min'],['km','Distância','km']]):[['max','Carga máx.','kg'],['1rm','1RM estimado','kg'],['vol','Volume','kg'],['reps','Reps máx.','']]}
function exSeries(name,metric){const pts=[];for(const s of sessList().slice().reverse()){const x=(s.exercises||[]).find(e=>e.name===name);if(!x||!x.sets.length)continue;const ss=x.sets;let v=0;
  if(metric==='max')v=Math.max(...ss.map(t=>num(t.kg)));else if(metric==='1rm')v=Math.max(...ss.map(t=>num(t.reps)>0?num(t.kg)*(1+num(t.reps)/30):0));else if(metric==='vol')v=ss.reduce((a,t)=>a+num(t.kg)*num(t.reps),0);else if(metric==='reps')v=Math.max(...ss.map(t=>num(t.reps)));else if(metric==='min')v=ss.reduce((a,t)=>a+num(t.kg),0);else if(metric==='km')v=ss.reduce((a,t)=>a+num(t.reps),0);
  pts.push({t:tOf(s.date),v:r1(v)})}return pts}

async function ppGet(id){if(PP.cache[id])return PP.cache[id];let v=null;if(ppNative())v=Android.getItem('athos_pp_'+id);else{const db=await ppDb();v=await new Promise(ok=>{const r=db.transaction('f').objectStore('f').get(id);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}if(v)PP.cache[id]=v;return v}
async function ppDel(id){delete PP.cache[id];if(ppNative()){Android.setItem('athos_pp_'+id,null);return}const db=await ppDb();db.transaction('f','readwrite').objectStore('f').delete(id)}
async function ppShrink(file){let img;try{img=await createImageBitmap(file)}catch(e){img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}

function closeSheet(el){const i=el?sheets.indexOf(el):sheets.length-1;if(i<0)return;const[s]=sheets.splice(i,1);s.remove();if(!sheets.length&&$('#session').hidden)document.body.classList.remove('locked')}

function thinking(t){return`<div class="thinking"><i></i><span>${esc(t)}</span></div>`}

/* ---------- IA ---------- */
function aiMsg(e){const c=e&&e.code;switch(c){
  case'not_granted':case'sampling_disabled':case'not_declared':case'capability_disabled':case'capability_removed':SAMPLE=null;schedule();return'O uso do Claude não foi liberado nesta página.';
  case'images_unavailable':SAMPLE_IMG=false;schedule();return'Envio de fotos não está disponível aqui.';
  case'rate_limited':return AIHOST?'Limite grátis da IA atingido por agora. Tente mais tarde ou conecte a segunda IA no Perfil.':'Seu limite de uso do Claude foi atingido. Tente mais tarde.';
  case'bad_key':return'A chave da IA não funcionou. Confira em Perfil.';
  case'user_limit':return'Você já usou seus 20 usos de IA de hoje. Amanhã tem mais! Para usar além disso, conecte sua própria chave no Perfil.';
  case'server_not_configured':return'A IA do ATHOS ainda não está configurada no servidor.';
  case'offline':return'Sem conexão com a internet.';
  case'image_rejected':return'Essa imagem não foi aceita. Tente outra foto (JPG ou PNG).';
  case'invalid_json':case'empty_completion':return'Não consegui entender a resposta. Tente de novo.';
  case'refused':return'O Claude não respondeu a esse pedido. Tente descrever de outro jeito.';
  case'session_expired':return'Sua sessão expirou. Entre de novo no Claude.';
  case'cancelled':return'';default:return'Algo falhou. Tente de novo.'}}
const FOOD_JSON='Responda SOMENTE com JSON no formato {"itens":[{"nome":"Arroz branco cozido","gramas":120,"kcal":154,"proteina":3,"carbo":33.7,"gordura":0.2}],"obs":"observação curta opcional"}. Os valores de kcal e macros são do TOTAL da porção (não por 100 g). Use como referência a Tabela TACO e porções típicas brasileiras. Se algo não estiver claro, faça a melhor estimativa.';
const WK_JSON='Responda SOMENTE com JSON no formato {"treinos":[{"nome":"Treino A — Peito e tríceps","exercicios":[{"nome":"Supino reto (barra)","series":4,"reps":"8-10"}]}]}. Para cardio ou prancha, "reps" é o tempo em minutos (ex.: "20"). Sempre que possível use exatamente estes nomes de exercícios: '+EX.map(e=>e.name).join('; ')+'.';
function aiToItems(r){const arr=(r&&(r.itens||r.items))||[];return arr.map(x=>{const g=num(x.gramas??x.grams);const it={id:newId('f'),name:String(x.nome||x.name||'Alimento').slice(0,80),grams:g||null,kcal:r1(num(x.kcal)),p:r1(num(x.proteina??x.p)),c:r1(num(x.carbo??x.c)),f:r1(num(x.gordura??x.f))};if(g>0)it.per={kcal:it.kcal*100/g,p:it.p*100/g,c:it.c*100/g,f:it.f*100/g};return it}).filter(it=>it.name)}
function aiToTemplates(r){return((r&&r.treinos)||[]).map(t=>({id:newId('t'),name:String(t.nome||'Treino').slice(0,80),exercises:(t.exercicios||[]).map(e=>{const m=matchEx(e.nome||'');return{name:m.name,group:m.group,type:m.type,sets:Math.max(1,Math.min(10,parseInt(e.series)||3)),reps:String(e.reps||'8-12').slice(0,12)}})})).filter(t=>t.exercises.length)}
function pickPhotos(multi){return new Promise(res=>{const inp=$('#photoIn');inp.value='';inp.multiple=!!multi;inp.onchange=()=>res(inp.files?[...inp.files]:[]);inp.click()})}
/* links de playlist aceitos: YouTube Music, YouTube e Spotify */
function musicLink(v){v=String(v||'').trim();const m=v.match(/(https?:\/\/)?((music|www|m)\.)?(youtube\.com|youtu\.be|open\.spotify\.com|spotify\.link)\/[^\s]*/i);if(m)return(m[1]?'':'https://')+m[0];if(/^spotify:[a-z]+:[A-Za-z0-9]+$/.test(v))return v;return null}
function musicApp(u){return/spotify/i.test(u)?'Spotify':'YouTube Music'}
let musicCard=a=>a&&a.music?`<a class="btn soft block" href="${esc(a.music)}" target="_blank" rel="noopener">▶ Tocar a playlist do treino no ${musicApp(a.music)}</a>`:'';
function pickPhoto(){return pickPhotos(false).then(a=>a[0]||null)}

/* ---------- alimentos ---------- */
function scaleItem(it,g){if(!it.per)return;it.grams=g;it.kcal=r1(it.per.kcal*g/100);it.p=r1(it.per.p*g/100);it.c=r1(it.per.c*g/100);it.f=r1(it.per.f*g/100)}

/* ---------- código de barras (Open Food Facts) ---------- */
function loadZX(){if(window.ZXing)return Promise.resolve();return new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='zxing/zxing.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
async function offLookup(code){const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_pt,brands,nutriments,serving_quantity,quantity`);if(!r.ok&&r.status!==404)throw new Error('net');const j=await r.json();if(j.status!==1||!j.product)return null;
  const P=j.product,n=P.nutriments||{};const kcal=n['energy-kcal_100g']!=null?+n['energy-kcal_100g']:(n['energy_100g']!=null?+n['energy_100g']/4.184:null);if(kcal==null)return{name:P.product_name_pt||P.product_name||'Produto',noData:true};
  const name=[P.product_name_pt||P.product_name||'Produto',P.brands?P.brands.split(',')[0].trim():''].filter(Boolean).join(' — ');
  return{name,kcal:r1(kcal),p:r1(+n.proteins_100g||0),c:r1(+n.carbohydrates_100g||0),f:r1(+n.fat_100g||0),serving:+P.serving_quantity||null}}
function barcodeSheet(date,meal){let stream=null,reader=null,timer=null,busy=false,stopped=false;
  const stop=()=>{stopped=true;clearInterval(timer);try{reader&&reader.reset()}catch(e){}try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}};
  const el=openSheet('Código de barras',`<div class="bcv"><video id="bcVid" playsinline muted autoplay></video><div class="bcl" aria-hidden="true"></div></div><p class="hint" id="bcMsg" style="text-align:center">Aponte a câmera para o código de barras da embalagem.</p>
   <div class="row" style="flex-wrap:nowrap"><input id="bcIn" inputmode="numeric" placeholder="Ou digite o código" aria-label="Código de barras"><button class="btn" data-s="go">Buscar</button></div><div id="bcRes"></div>`,async(b,w)=>{
    const msg=b.querySelector('#bcMsg'),res=b.querySelector('#bcRes'),vid=b.querySelector('#bcVid');
    new MutationObserver((m,o)=>{if(!w.isConnected){stop();o.disconnect()}}).observe(document.getElementById('sheets'),{childList:true});
    async function found(code){if(busy)return;busy=true;stop();b.querySelector('.bcv').classList.add('ok');try{window.Android&&Android.vibrate&&0}catch(e){}
      msg.textContent=`Código ${code}: buscando…`;
      try{const f=await offLookup(code);
        if(!f){msg.textContent='Não encontrei esse produto na base pública.';res.innerHTML=`<p class="hint">Cadastre pelo modo Manual em "Adicionar alimento". Código: ${esc(code)}</p>`;busy=false;return}
        if(f.noData){msg.textContent=`${f.name}: a base não tem a tabela nutricional.`;busy=false;return}
        msg.textContent='Produto encontrado';const g0=f.serving||100;
        res.innerHTML=`<div class="picked"><b>${esc(f.name)}</b><span class="small muted">Por 100 g: ${fmtN(f.kcal)} kcal · P ${fmtD(f.p)} · C ${fmtD(f.c)} · G ${fmtD(f.f)}</span><label class="fld"><span>Quantidade (g ou ml)</span><input id="bcG" inputmode="decimal" value="${g0}"></label><p class="small" id="bcT"></p><button class="btn primary block" data-s="add">Adicionar em ${esc((MEALS.find(m=>m[0]===meal)||[0,''])[1])}</button><label class="check small"><input type="checkbox" id="bcSave" checked> Salvar em "Meus alimentos" para buscar depois</label></div>`;
        const upd=()=>{const g=num(res.querySelector('#bcG').value);res.querySelector('#bcT').textContent=`${fmtN(f.kcal*g/100)} kcal · P ${fmtD(f.p*g/100)} g · C ${fmtD(f.c*g/100)} g · G ${fmtD(f.f*g/100)} g`};upd();res.querySelector('#bcG').oninput=upd;
        res.querySelector('[data-s=add]').onclick=()=>{const g=num(res.querySelector('#bcG').value)||100;addItems(date,meal,[fromFood(f,g)]);
          if(res.querySelector('#bcSave').checked){const cf=S.profile.customFoods=S.profile.customFoods||[];if(!cf.some(x=>x.name===f.name)){cf.push({name:f.name,kcal:f.kcal,p:f.p,c:f.c,f:f.f});store.mark('profile')}}
          closeSheet(w);toast('Adicionado')}}
      catch(e){msg.textContent='Sem internet para buscar o produto. Tente de novo.';busy=false}}
    b.querySelector('[data-s=go]').onclick=()=>{const c=b.querySelector('#bcIn').value.replace(/\D/g,'');if(c.length<6){toast('Digite o código completo');return}busy=false;found(c)};
    try{
      if('BarcodeDetector' in window){const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});if(stopped){stop();return}vid.srcObject=stream;await vid.play();
        timer=setInterval(async()=>{if(busy||vid.readyState<2)return;try{const c=await det.detect(vid);if(c&&c[0])found(c[0].rawValue)}catch(e){}},300)}
      else{msg.textContent='Abrindo a câmera…';await loadZX();if(stopped)return;const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);
        reader=new ZXing.BrowserMultiFormatReader(hints);await reader.decodeFromConstraints({video:{facingMode:'environment'}},vid,(r)=>{if(r&&!busy)found(r.getText())});msg.textContent='Aponte a câmera para o código de barras da embalagem.'}
    }catch(e){msg.textContent='Não consegui abrir a câmera. Libere a permissão de câmera ou digite o código abaixo.'}
  })}
function fromFood(f,g){const it={id:newId('f'),name:f.name,per:{kcal:f.kcal,p:f.p,c:f.c,f:f.f}};scaleItem(it,g);return it}
function addItems(date,meal,items){const d=ensureDay(date);d.meals[meal].push(...items);store.mark('d-'+date);render()}
function itemsReview(b,items,date,meal,onDone){
  const draw=()=>{const tot=mealTotals(items.filter(i=>!i.off));
    b.querySelector('#fBody').innerHTML=`${items.length?`<p class="hint">Confira as quantidades. Mudar os gramas recalcula as calorias.</p>${items.map((it,i)=>`<div class="ai-item"><input type="checkbox" data-i="${i}" ${it.off?'':'checked'} aria-label="Incluir ${esc(it.name)}" style="width:20px;height:20px"><div style="min-width:0"><b>${esc(it.name)}</b><small>${fmtN(it.kcal)} kcal · P ${fmtD(it.p)} · C ${fmtD(it.c)} · G ${fmtD(it.f)}</small></div>${it.per?`<label><input inputmode="decimal" data-g="${i}" value="${it.grams||''}" aria-label="Gramas"><span class="mini-l">gramas</span></label>`:'<span></span>'}</div>`).join('')}
    <div class="row between"><b>Total</b><span class="num" style="font-size:20px">${fmtN(tot.kcal)} kcal</span></div><button class="btn primary block" data-s="addAll">Adicionar — ${esc(MEAL_L[b.querySelector('#fMeal').value])}</button>`:'<p class="hint">Nenhum alimento identificado. Tente de novo com outra descrição ou foto.</p>'}`;};
  draw();
  const body=b.querySelector('#fBody');
  body.onchange=e=>{const i=e.target.dataset.i;if(i!=null){items[i].off=!e.target.checked;draw()}};
  body.oninput=e=>{const i=e.target.dataset.g;if(i!=null){const g=num(e.target.value);if(g>0){scaleItem(items[i],g);const small=e.target.closest('.ai-item').querySelector('small');const it=items[i];small.textContent=`${fmtN(it.kcal)} kcal · P ${fmtD(it.p)} · C ${fmtD(it.c)} · G ${fmtD(it.f)}`}}};
  body.onclick=e=>{if(e.target.closest('[data-s=addAll]')){const sel=items.filter(i=>!i.off).map(i=>{const c={...i};delete c.off;return c});if(!sel.length)return;addItems(date,b.querySelector('#fMeal').value,sel);onDone();toast(`${sel.length} ${sel.length>1?'itens adicionados':'item adicionado'}`)}};
}
function foodSheet(date,meal){
  let mode='buscar',q='',sel=null;
  openSheet('Adicionar alimento','',(b,el)=>{
    const modes=[['buscar','Buscar'],...(SAMPLE?[['ia','Descrever']]:[]),...(SAMPLE&&SAMPLE_IMG?[['foto','Foto']]:[]),['manual','Manual']];
    b.innerHTML=`<label class="fld"><span>Refeição</span><select id="fMeal">${MEALS.map(([k,l])=>`<option value="${k}" ${k===meal?'selected':''}>${l}</option>`).join('')}</select></label><button class="btn block bcbtn" data-bc="1"><span aria-hidden="true">▮▯▮▮▯▮</span> Ler código de barras</button><div class="seg" role="group" aria-label="Forma de adicionar">${modes.map(([k,l])=>`<button data-m="${k}" aria-pressed="${k===mode}">${l}</button>`).join('')}</div><div id="fBody" style="display:flex;flex-direction:column;gap:10px"></div>`;

    b.querySelector('.seg').onclick=e=>{const m=e.target.closest('[data-m]');if(!m)return;mode=m.dataset.m;b.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===m));body.onchange=body.oninput=body.onclick=null;drawMode()};
    const allFoods=()=>[...(S.profile.customFoods||[]).map(f=>({...f,mine:true})),...FOODS];
    function drawResults(){const n=norm(q);const list=allFoods().filter(f=>!n||norm(f.name).includes(n)).slice(0,40);const box=body.querySelector('#res');
      box.innerHTML=list.length?list.map((f,i)=>`<button class="result" data-k="${esc(f.name)}"><span><b>${esc(f.name)}</b><br><small>${fmtN(f.kcal)} kcal · P ${fmtD(f.p)} · C ${fmtD(f.c)} · G ${fmtD(f.f)} por 100 g${f.mine?' · meu':''}</small></span><span class="muted">+</span></button>`).join(''):`<p class="hint">Nada encontrado. Use “Manual”${SAMPLE?' ou “Descrever”':''}.</p>`}
    function drawPicked(){const box=body.querySelector('#pick');if(!sel){box.innerHTML='';return}const g=num(box.querySelector?.('#pg')?.value)||sel.g;sel.g=g;const it=fromFood(sel.f,g);
      box.innerHTML=`<div class="picked"><div class="row between"><b>${esc(sel.f.name)}</b><button class="icon-btn" data-s="unpick" aria-label="Trocar">✕</button></div><div class="chips"><button class="chip" data-pg="100">100 g</button>${sel.f.pg?`<button class="chip" data-pg="${sel.f.pg}">${esc(sel.f.pl||'1 porção')} (${sel.f.pg} g)</button>`:''}</div><label class="fld"><span>Quantidade (g)</span><input id="pg" inputmode="decimal" value="${g}"></label><p id="pv"><b class="num" style="font-size:22px">${fmtN(it.kcal)} kcal</b> <span class="muted small">· P ${fmtD(it.p)} · C ${fmtD(it.c)} · G ${fmtD(it.f)}</span></p><button class="btn primary block" data-s="addPicked">Adicionar</button></div>`}
    function drawMode(){
      if(mode==='buscar'){body.innerHTML=`<input id="q" type="search" placeholder="Buscar: frango, arroz, whey…" value="${esc(q)}" aria-label="Buscar alimento"><div id="pick"></div><div id="res" style="display:flex;flex-direction:column;gap:6px"></div><p class="hint">Valores aproximados por 100 g (Tabela TACO e rótulos).</p>`;drawResults();
        body.oninput=e=>{if(e.target.id==='q'){q=e.target.value;drawResults()}else if(e.target.id==='pg'){const g=num(e.target.value);if(g>0){sel.g=g;const it=fromFood(sel.f,g);body.querySelector('#pv').innerHTML=`<b class="num" style="font-size:22px">${fmtN(it.kcal)} kcal</b> <span class="muted small">· P ${fmtD(it.p)} · C ${fmtD(it.c)} · G ${fmtD(it.f)}</span>`}}};

        body.onclick=e=>{if(!e.target.closest('[data-s=manual]'))return;const v=id=>body.querySelector(id).value;const name=v('#mName').trim();if(!name){toast('Dê um nome ao alimento');return}
          const g=num(v('#mG'));const it={id:newId('f'),name:name.slice(0,80),grams:g||null,kcal:r1(num(v('#mK'))),p:r1(num(v('#mP'))),c:r1(num(v('#mC'))),f:r1(num(v('#mF')))};
          if(g>0)it.per={kcal:it.kcal*100/g,p:it.p*100/g,c:it.c*100/g,f:it.f*100/g};
          if(body.querySelector('#mSave').checked){const base=g>0?it.per:{kcal:it.kcal,p:it.p,c:it.c,f:it.f};S.profile.customFoods=(S.profile.customFoods||[]).filter(f=>f.name!==it.name);S.profile.customFoods.unshift({name:it.name,kcal:r1(base.kcal),p:r1(base.p),c:r1(base.c),f:r1(base.f),pg:g||100,pl:'1 porção'});store.mark('profile')}
          addItems(date,b.querySelector('#fMeal').value,[it]);done();toast('Alimento adicionado')};
      }

    drawMode();

}
function editFoodSheet(date,meal,id){
  const d=S.days[date];const it=d&&d.meals[meal].find(x=>x.id===id);if(!it)return;const w=clone(it);
  openSheet('Editar alimento',`<b>${esc(it.name)}</b>${w.per?`<label class="fld"><span>Quantidade (g)</span><input id="eG" inputmode="decimal" value="${w.grams||''}"></label><p id="eV"></p>`:`<div class="grid2"><label class="fld"><span>Calorias</span><input id="eK" inputmode="decimal" value="${w.kcal}"></label><label class="fld"><span>Proteína (g)</span><input id="eP" inputmode="decimal" value="${w.p}"></label><label class="fld"><span>Carboidrato (g)</span><input id="eC" inputmode="decimal" value="${w.c}"></label><label class="fld"><span>Gordura (g)</span><input id="eF" inputmode="decimal" value="${w.f}"></label></div>`}

     <div class="xt-adj"><button class="btn soft" data-xt="stop">Parar e salvar</button><button class="btn ghost" data-xt="cancel">Cancelar</button></div></div>`;
    document.body.appendChild(w);

  const left=xtLeft(),C=2*Math.PI*52,fr=XT.total?left/XT.total:0;

      <label class="fld"><span>Nível de atividade</span><select id="pA">${ACTS.map(([v,l])=>`<option value="${v}" ${p.activity===v?'selected':''}>${l}</option>`).join('')}</select></label>

function nativeHttp(url,body,headers){if(!NATIVE)return fetch(url,{method:body==null?'GET':'POST',headers:{...(headers||{}),...(body==null?{}:{'Content-Type':'application/json'})},body:body==null?undefined:JSON.stringify(body)}).then(async r=>({status:r.status,text:await r.text()})).catch(()=>({status:-1,text:''}));return new Promise(res=>{const id='h'+(++httpN);HTTP[id]=res;try{NATIVE.http(id,url,body==null?null:JSON.stringify(body),JSON.stringify(headers||{}))}catch(e){delete HTTP[id];res({status:-1,text:''})}})}
const stripThink=t=>String(t||'').replace(/<think>[\s\S]*?<\/think>/gi,'').trim();

/* ----- Gemini ----- */
const GEM='https://generativelanguage.googleapis.com/v1beta/models';
const gemOn=()=>!!(AI.key&&AI.models&&AI.models.length);
async function gemModels(key){
  const r=await nativeHttp(GEM+'?pageSize=1000',null,{'x-goog-api-key':key});
  if(r.status<0)throw{code:'offline'};
  if([400,401,403].includes(r.status))throw{code:'bad_key'};
  if(r.status!==200)throw{code:'upstream_error'};
  const j=JSON.parse(r.text);
  const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  return(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>String(m.name).replace(/^models\//,''))
    .filter(n=>/^gemini-.*flash/.test(n)&&!/(tts|image|live|audio|embed|exp|native|transcrib|translat|omni|computer)/.test(n))
    .sort((a,b)=>(ver(b)-(/preview/.test(b)?.05:0))-(ver(a)-(/preview/.test(a)?.05:0))).slice(0,8);
}
function gemOrder(quick){const ms=AI.models||[];const lite=ms.filter(m=>/lite/.test(m)),full=ms.filter(m=>!/lite/.test(m));return quick?[...lite,...full]:[...full,...lite]}
async function callGemini(turns,b64s,json,quick){
  const contents=turns.map(t=>({role:t.role==='assistant'?'model':'user',parts:[{text:String(t.content)}]}));
  if(b64s.length){const last=contents[contents.length-1];last.parts=[...b64s.map(d=>({inline_data:{mime_type:'image/jpeg',data:d}})),...last.parts]}
  const body={contents,generationConfig:{temperature:0.4}};if(json)body.generationConfig.responseMimeType='application/json';
  let last={code:'upstream_error'};
  for(const m of gemOrder(quick).slice(0,4)){
    const r=await nativeHttp(`${GEM}/${m}:generateContent`,body,{'x-goog-api-key':AI.key});
    if(r.status===200){let j;try{j=JSON.parse(r.text)}catch(e){throw{code:'upstream_error'}}
      const c=j.candidates&&j.candidates[0];const t=c&&c.content?(c.content.parts||[]).map(p=>p.text||'').join(''):'';
      if(!t.trim()){if((j.promptFeedback&&j.promptFeedback.blockReason)||(c&&c.finishReason==='SAFETY'))throw{code:'refused'};last={code:'empty_completion'};continue}
      AI.used='Gemini · '+m;return t}
    if(r.status<0)throw{code:'offline'};
    if(r.status===401||r.status===403||(r.status===400&&/api[ _-]?key/i.test(r.text)))throw{code:'bad_key'};
    last=r.status===429?{code:'rate_limited'}:{code:'upstream_error'};
    if(![429,404,500,503,504].includes(r.status))break;
  }
  throw last;
}

/* ----- Groq (API compatível com OpenAI) ----- */
const GROQ='https://api.groq.com/openai/v1';
const groqOn=()=>!!(AI.groq&&AI.groq.key&&(AI.groq.text||AI.groq.vision));
const GROQ_VISION=['qwen/qwen3.8-27b','meta-llama/llama-4-scout-17b-16e-instruct','meta-llama/llama-4-maverick-17b-128e-instruct'];
const GROQ_TEXT=['openai/gpt-oss-120b','qwen/qwen3.8-27b','llama-3.3-70b-versatile','openai/gpt-oss-20b'];
const groqHdr=key=>({'Authorization':'Bearer '+key});
async function groqRaw(key,model,messages,json,maxTok,probe){
  const body={model,messages,temperature:0.4,max_completion_tokens:maxTok||4096};if(json)body.response_format={type:'json_object'};
  let r=await nativeHttp(GROQ+'/chat/completions',body,groqHdr(key));
  if(r.status===400&&json&&/response_format|json/i.test(r.text)){delete body.response_format;r=await nativeHttp(GROQ+'/chat/completions',body,groqHdr(key))}
  if(r.status===200){let j;try{j=JSON.parse(r.text)}catch(e){throw{code:'upstream_error'}}const t=stripThink(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content);if(!t){if(probe)return'ok';throw{code:'empty_completion'}}return t}
  if(r.status<0)throw{code:'offline'};if(r.status===401||r.status===403)throw{code:'bad_key'};if(r.status===429)throw{code:'rate_limited'};
  if(r.status===400&&/image|vision|content type|multimodal/i.test(r.text))throw{code:'images_unavailable'};
  throw{code:'upstream_error',status:r.status};
}
function groqMsgs(turns,b64s){
  return turns.map((t,i)=>{const role=t.role==='assistant'?'assistant':'user';
    if(i===turns.length-1&&b64s.length)return{role,content:[{type:'text',text:String(t.content)},...b64s.map(d=>({type:'image_url',image_url:{url:'data:image/jpeg;base64,'+d}}))]};
    return{role,content:String(t.content)}});
}
async function callGroq(turns,b64s,json){
  const g=AI.groq;const model=b64s.length?g.vision:(g.text||g.vision);if(!model)throw{code:'images_unavailable'};
  if(b64s.length<=3){const t=await groqRaw(g.key,model,groqMsgs(turns,b64s),json);AI.used='Groq · '+model;return t}
  // mais de 3 fotos: lê em partes de 3 e junta as listas
  const parts=[];for(let i=0;i<b64s.length;i+=3)parts.push(b64s.slice(i,i+3));const merged={};
  for(let k=0;k<parts.length;k++){
    const tt=turns.slice();const last=tt[tt.length-1];tt[tt.length-1]={...last,content:`${last.content}\n\n(Você está vendo a parte ${k+1} de ${parts.length} das fotos; responda só com o que aparece nelas.)`};
    const o=parseLoose(await groqRaw(g.key,model,groqMsgs(tt,parts[k]),true));
    for(const[key,v]of Object.entries(o||{})){if(Array.isArray(v))merged[key]=(merged[key]||[]).concat(v);else if(!(key in merged))merged[key]=v}
  }
  AI.used='Groq · '+model;return JSON.stringify(merged);
}
async function groqSetup(key){
  const r=await nativeHttp(GROQ+'/models',null,groqHdr(key));
  if(r.status<0)throw{code:'offline'};if(r.status===401||r.status===403)throw{code:'bad_key'};if(r.status!==200)throw{code:'upstream_error'};
  const ids=new Set(((JSON.parse(r.text).data)||[]).map(m=>m.id));
  const text=GROQ_TEXT.find(m=>ids.has(m))||null;let vision=null;
  if(text)await groqRaw(key,text,[{role:'user',content:'Responda apenas: ok'}],false,800,true);
  const tiny=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#d22';x.fillRect(0,0,64,64);return c.toDataURL('image/jpeg',.8).split(',')[1]})();
  for(const m of GROQ_VISION.filter(m=>ids.has(m))){
    try{await groqRaw(key,m,groqMsgs([{role:'user',content:'Qual é a cor desta imagem? Responda com uma palavra.'}],[tiny]),false,800,true);vision=m;break}
    catch(e){if(e.code==='bad_key'||e.code==='offline')throw e}
  }
  if(!text&&!vision)throw{code:'no_models'};
  return{key,text,vision,checked:Date.now()};
}

async function callServer(turns,b64s,json,quick){
  let res;try{res=await SOC.sb.functions.invoke('ai',{body:{turns,images:b64s,json:!!json,quick:!!quick}})}catch(e){throw{code:'offline'}}
  const{data,error}=res;
  if(error){let code='upstream_error';try{const ctx=error.context;if(ctx&&ctx.json){const j=await ctx.json();code=j.code||code}else if(/fetch|network/i.test(error.message||''))code='offline'}catch(e){}
    if(code==='user_limit'){AI.srvLeft=0;lsSet('ficha.ai',AI)}
    throw{code:code==='not_logged'?'not_granted':code}}
  if(!data||typeof data.text!=='string')throw{code:'upstream_error'};
  AI.srvLeft=data.remaining;AI.srvDay=today();lsSet('ficha.ai',AI);AI.used='IA do ATHOS · '+(data.used||'');return data.text;
}
async function srvRemaining(){try{const r=await sbq(SOC.sb.from('ai_usage').select('n').eq('user_id',SOC.user.id).eq('day',today()));AI.srvLeft=SRV_LIMIT-((r[0]&&r[0].n)||0);AI.srvDay=today();lsSet('ficha.ai',AI);render()}catch(e){}}
/* ----- roteador: chave própria (Gemini, Groq) e depois a IA do ATHOS ----- */
async function imgToB64(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const s=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85).split(',')[1]}
  catch(e){throw{code:'image_rejected'}}finally{URL.revokeObjectURL(url)}
}
async function aiCall(input,opts,json){
  opts=opts||{};
  const turns=typeof input==='string'?[{role:'user',content:input}]:input;
  let imgs=opts.images;imgs=imgs?(imgs instanceof Blob?[imgs]:[...imgs]):[];
  const b64s=[];for(const im of imgs)b64s.push(await imgToB64(im));
  const quick=opts.modelTier==='quick'&&!b64s.length;
  const provs=[];if(gemOn())provs.push('gemini');if(groqOn()&&(!b64s.length||AI.groq.vision))provs.push('groq');if(srvOn())provs.push('server');
  if(!provs.length)throw{code:b64s.length?'images_unavailable':'not_granted'};
  const errs=[];
  for(const p of provs){
    try{return p==='gemini'?await callGemini(turns,b64s,json,quick):p==='groq'?await callGroq(turns,b64s,json):await callServer(turns,b64s,json,quick)}
    catch(e){if(e.code==='offline'||e.code==='refused'||e.code==='image_rejected')throw e;errs.push(e)}
  }
  if(errs.some(e=>e.code==='user_limit')&&errs.every(e=>e.code==='user_limit'||e.code==='rate_limited'))throw{code:'user_limit'};
  if(errs.every(e=>e.code==='rate_limited'))throw{code:'rate_limited'};
  throw errs.find(e=>e.code==='bad_key')||errs[errs.length-1];
}
function parseLoose(t){t=stripThink(t);try{return JSON.parse(t)}catch(e){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}throw{code:'invalid_json',text:t}}
function aiSample(){const f=async(input,opts)=>({text:await aiCall(input,opts,false),truncated:false});f.json=async(input,opts)=>parseLoose(await aiCall(input,opts,true));f.limits=async()=>({maxPromptBytes:262144,images:{maxCount:6,maxInputBytes:20e6,mediaTypes:['image/jpeg','image/png','image/webp']}});return f}

function bestEffort(full,D){let best=Infinity,i=0;for(let j=0;j<full.length;j++){while(i+1<j&&full[j][4]-full[i+1][4]>=D)i++;if(full[j][4]-full[i][4]>=D)best=Math.min(best,full[j][3]-full[i][3])}return isFinite(best)&&best>0?Math.round(best):null}
function saveRun(f){
  if((f.dist||0)<30&&(f.moving||0)<30){try{NATIVE.runClear()}catch(e){}render();toast('Atividade muito curta: não foi salva.');return}
  const type=f.type||'run',full=f.pts||[];const kept=[];let lastD=-1e9;
  for(const p of full){if(p[4]-lastD>=8){kept.push([+(+p[0]).toFixed(5),+(+p[1]).toFixed(5)]);lastD=p[4]}}
  if(full.length>1){const l=full[full.length-1];kept.push([+(+l[0]).toFixed(5),+(+l[1]).toFixed(5)])}
  const w=curWeight()||70;
  const r={type,dist:Math.round(f.dist),moving:Math.round(f.moving),elapsed:Math.round(f.elapsed),steps:Math.round(f.hasSteps?f.steps:estSteps(type,f.dist)),stepsEst:!f.hasSteps,

    const p1=prev.map(x=>x.best1k).filter(Boolean),p5=prev.map(x=>x.best5k).filter(Boolean);
    if(r.best1k&&p1.length&&r.best1k<Math.min(...p1))prs.push({l:'Melhor 1 km',v:fmtPace(r.best1k)});
    if(r.best5k&&p5.length&&r.best5k<Math.min(...p5))prs.push({l:'Melhor 5 km',v:fmtDur(r.best5k*1000).replace(/^00:/,'')});
  }
  r.prs=prs;
  const start=f.start||Date.now()-r.elapsed*1000;
  const s={id:newId('s'),date:ymd(new Date(start)),ts:start,end:f.end||Date.now(),name:RUN_T[type]||'Atividade',exercises:[],run:r};
  S.sessions[s.id]=s;store.mark(s.id,0);flushLocal();try{NATIVE.runClear()}catch(e){}

  const lk=await sbq(SOC.sb.from('likes').select('post_id,user_id').in('post_id',ids));const cm=await sbq(SOC.sb.from('comments').select('post_id').in('post_id',ids));
  for(const id of ids){SOC.likeN[id]=0;SOC.cmtN[id]=0}for(const l of lk){SOC.likeN[l.post_id]++;if(l.user_id===SOC.user.id)SOC.myLikes.add(l.post_id)}for(const c of cm)SOC.cmtN[c.post_id]++}
const VIS={public:'Público',followers:'Seguidores',private:'Só eu'};
function postStats(p){const s=p.stats||{};
  if(p.kind==='run'){const r={type:s.type||'run',dist:s.dist||0,moving:s.moving||0};return`<div class="st"><div><b>${km2(r.dist)}</b><small>km</small></div><div><b>${speedOrPace(r).replace('/km','')}</b><small>${r.type==='bike'?'km/h':'ritmo /km'}</small></div><div><b>${fmtDur(r.moving*1000).replace(/^00:/,'')}</b><small>tempo</small></div></div>`}
  if(p.kind==='workout'){if(s.checkin)return`<div class="st"><div><b>✓</b><small>check-in</small></div><div><b>${fmtN(s.dur||0)}</b><small>min</small></div></div>`;
    return`<div class="st"><div><b>${fmtN(s.sets||0)}</b><small>séries</small></div><div><b>${fmtN(s.vol||0)}</b><small>kg de volume</small></div><div><b>${fmtN(s.dur||0)}</b><small>min</small></div></div>${(s.ex||[]).length?`<p class="exl">${s.ex.map(e=>esc(e.n)+(e.best?` <b>${fmtD(e.best)} kg</b>`:'')).join(' · ')}</p>`:''}`}
  return'';
}

/* quem você segue, estilo stories */
function socStories(){const ids=[...SOC.following];if(!ids.length)return'';const now=Date.now();
  const recent={};for(const p of SOC.feed||[]){if(now-new Date(p.created_at).getTime()<864e5&&!recent[p.user_id])recent[p.user_id]=p.id}
  const on=id=>{const ls=SOC.prof[id]&&SOC.prof[id].last_seen;return ls&&now-new Date(ls).getTime()<3*60e3};
  const list=ids.map(id=>SOC.prof[id]).filter(Boolean).sort((a,b)=>(recent[b.id]?2:0)+(on(b.id)?1:0)-((recent[a.id]?2:0)+(on(a.id)?1:0))).slice(0,15);
  if(!list.length)return'';
  return`<div class="stories" role="list" aria-label="Quem você segue">${list.map(pr=>`<button role="listitem" class="sto" ${recent[pr.id]?`data-act="socOpenPost" data-id="${recent[pr.id]}"`:`data-act="socProfile" data-id="${pr.id}"`}><span class="r${recent[pr.id]?'':' off'}">${avatar(pr)}${on(pr.id)?'<i class="ond" aria-label="online"></i>':''}</span><span class="n">${esc((pr.name||'').split(' ')[0])}</span></button>`).join('')}</div>`}

async function socSearch(qs){SOC.pq=qs;const t=String(qs||'').trim();

    else if(t.replace(/^(id|#)\s*/i,'').replace(/\s/g,'').length<2&&!/^\d/.test(t)){SOC.people={mode:'curto',list:[]}}
    else{const r=await sbq(SOC.sb.rpc('search_people',{q:t}));for(const p of r)SOC.prof[p.id]=p;SOC.people={mode:'busca',list:r}}}
  catch(e){SOC.people={mode:'busca',list:[]};SOC.err=sbErr(e)}schedule()}

/* ----- postar ----- */
function hav(a,b){const R=6371000,toR=Math.PI/180,dLa=(b[0]-a[0])*toR,dLo=(b[1]-a[1])*toR;const x=Math.sin(dLa/2)**2+Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function trimRoute(pts,m){if(!pts||pts.length<2)return null;if(!m)return pts;const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hav(pts[i-1],pts[i]));const tot=cum[cum.length-1];const out=pts.filter((_,i)=>cum[i]>=m&&cum[i]<=tot-m);return out.length>1?out:null}
/* abre a foto já reduzida (evita estourar a memória com fotos grandes de câmera) */
async function decodePhoto(file,max){
  if(window.createImageBitmap){
    try{const probe=await createImageBitmap(file);const w=probe.width,h=probe.height;
      const k=Math.min(1,max/Math.max(w,h));if(k>=1)return probe;probe.close&&probe.close();
      return await createImageBitmap(file,{resizeWidth:Math.round(w*k),resizeHeight:Math.round(h*k),resizeQuality:'high'})}catch(e){}
  }
  const url=URL.createObjectURL(file);
  try{return await new Promise((ok,no)=>{const i=new Image();i.decoding='async';i.onload=()=>ok(i);i.onerror=()=>no(new Error('decode'));i.src=url})}
  finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
async function shrinkPhoto(file,opt){opt=opt||{};const max=opt.square?512:1280;
  let img;try{img=await decodePhoto(file,opt.square?1024:max)}catch(e){throw new Error('foto_ilegivel')}
  const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;if(!W||!H)throw new Error('foto_ilegivel');
  const c=document.createElement('canvas'),g=c.getContext('2d');
  if(opt.square){const side=Math.min(W,H),out=Math.min(max,side);c.width=c.height=out;g.drawImage(img,(W-side)/2,(H-side)/2,side,side,0,0,out,out)}
  else{const k=Math.min(1,max/Math.max(W,H));c.width=Math.round(W*k);c.height=Math.round(H*k);g.drawImage(img,0,0,c.width,c.height)}
  try{img.close&&img.close()}catch(e){}
  let q=0.85,blob=null;
  for(let t=0;t<4;t++){blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(!blob)break;if(blob.size<1500000)break;q-=0.15}
  c.width=c.height=0;
  if(!blob)throw new Error('foto_ilegivel');return blob}
function photoErr(e){const m=String((e&&e.message)||e||'');
  if(m==='foto_ilegivel')return'Não consegui abrir essa foto. Tente outra, de preferência JPG ou PNG.';
  if(/exceeded|too large|payload/i.test(m))return'A foto ficou grande demais. Tente outra.';
  if(/row-level security|JWT|not authorized|Unauthorized|403/i.test(m))return'Sua sessão expirou. Saia da conta e entre de novo.';
  return sbErr(e)}
async function uploadPhoto(file,folder,opt){const blob=await shrinkPhoto(file,opt);const path=`${SOC.user.id}/${folder||'p'}-${Date.now()}.jpg`;
  let last=null;
  for(let t=0;t<2;t++){try{await sbq(SOC.sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg',upsert:false,cacheControl:'31536000'}));last=null;break}catch(e){if(t&&/exists|Duplicate/i.test(String(e&&e.message))){last=null;break}last=e;if(/row-level|JWT|exceeded|too large/i.test(String(e&&e.message)))break;await new Promise(r=>setTimeout(r,1200))}}
  if(last)throw last;
  return SOC.sb.storage.from('fotos').getPublicUrl(path).data.publicUrl}
function photoPath(url){const k='/object/public/fotos/';const i=String(url||'').indexOf(k);return i<0?null:decodeURIComponent(url.slice(i+k.length).split('?')[0])}
function sessToPost(s){
  if(s.run){const r=s.run;return{kind:'run',title:s.name,stats:{type:r.type,dist:r.dist,moving:r.moving,steps:r.stepsEst?null:r.steps,elev:r.elev,kcal:r.kcal,best1k:r.best1k},route:r.pts}}
  const x=sessStats(s);if(s.checkin)return{kind:'workout',title:s.name,stats:{checkin:true,dur:Math.round(x.dur/60000)}};
  return{kind:'workout',title:s.name,stats:{sets:x.sets,vol:Math.round(x.vol),dur:Math.round(x.dur/60000),ex:(s.exercises||[]).slice(0,8).map(e=>({n:e.name,best:e.type==='w'?Math.max(0,...e.sets.map(t=>num(t.kg))):null})),prs:(s.prs||[]).map(p=>p.name)}};
}

async function loadConvs(){
  if(!SOC.user)return;
  try{const mem=await sbq(SOC.sb.from('conversation_members').select('*'));
    const ids=[...new Set(mem.map(m=>m.conversation_id))];if(!ids.length){SOC.convs=[];SOC.unread=0;drawDot();schedule();return}
    const convs=await sbq(SOC.sb.from('conversations').select('*').in('id',ids).order('last_at',{ascending:false}));
    const msgs=await sbq(SOC.sb.from('messages').select('*').in('conversation_id',ids).order('created_at',{ascending:false}).limit(300));
    const others=mem.filter(m=>m.user_id!==SOC.user.id);await loadProfiles(others.map(m=>m.user_id));
    let tot=0;SOC.convs=convs.map(c=>{const mine=mem.find(m=>m.conversation_id===c.id&&m.user_id===SOC.user.id);const other=(others.find(m=>m.conversation_id===c.id)||{}).user_id;const cm=msgs.filter(m=>m.conversation_id===c.id);
      const unread=cm.filter(m=>m.user_id!==SOC.user.id&&mine&&new Date(m.created_at)>new Date(mine.last_read)).length;tot+=unread;
      const om=others.find(m=>m.conversation_id===c.id);return{...c,other,title:c.is_group?(c.name||'Grupo'):pName(other),last:cm[0]||null,unread,lastRead:mine&&mine.last_read,muted:!!(mine&&mine.muted),otherRead:om&&om.last_read}});
    SOC.unread=tot;drawDot();schedule()}
  catch(e){SOC.convs=SOC.convs||[];SOC.err=sbErr(e);schedule()}
}

function socEditMe(){const m=SOC.me||{};let up=null;
  openSheet('Editar perfil',`<div class="row" style="flex-wrap:nowrap"><span id="emAv">${avatar(m,'lg')}</span><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><button class="btn" data-s="photo">Trocar foto</button><small class="muted" id="emSt" aria-live="polite"></small></div></div><label class="fld"><span>Nome</span><input id="emN" maxlength="60" value="${esc(m.name||'')}"></label><label class="fld"><span>Cidade</span><input id="emC" maxlength="60" value="${esc(m.city||'')}"></label><label class="fld"><span>Bio</span><textarea id="emB" maxlength="280">${esc(m.bio||'')}</textarea></label><button class="btn primary block" data-s="save">Salvar</button>`,(b,el)=>{
    const st=b.querySelector('#emSt'),pb=b.querySelector('[data-s=photo]');
    const setAv=src=>{const a=b.querySelector('#emAv .av');if(a)a.innerHTML=`<img src="${esc(src)}" alt="">`};
    async function sendPhoto(file){
      const old=SOC.me&&SOC.me.avatar_url,prev=URL.createObjectURL(file);setAv(prev);
      pb.disabled=true;pb.textContent='Enviando…';st.textContent='Enviando a foto…';st.style.color='';
      try{const url=await uploadPhoto(file,'avatar',{square:true});
        const row=(await sbq(SOC.sb.from('profiles').update({avatar_url:url}).eq('id',SOC.user.id).select()))[0];
        if(!row)throw new Error('Não consegui salvar a foto no perfil.');
        SOC.me=row;SOC.prof[SOC.user.id]=row;st.textContent='Foto atualizada';toast('Foto de perfil atualizada');render();
        const op=photoPath(old);if(op&&op.startsWith(SOC.user.id+'/'))SOC.sb.storage.from('fotos').remove([op]).catch(()=>{});
      }catch(err){if(old)setAv(old);else{const a=b.querySelector('#emAv');if(a)a.innerHTML=avatar(SOC.me||m,'lg')}st.textContent=photoErr(err);st.style.color='var(--red)';throw err}
      finally{pb.disabled=false;pb.textContent='Trocar foto';setTimeout(()=>URL.revokeObjectURL(prev),4000)}}
    b.onclick=async e=>{const x=e.target.closest('[data-s]');if(!x)return;
      if(x.dataset.s==='photo'){const f=await pickPhoto();if(!f)return;up=sendPhoto(f);up.catch(()=>{});return}
      if(x.dataset.s==='save'){x.disabled=true;x.textContent='Salvando…';
        try{if(up){try{await up}catch(_){} }
          const upd={name:b.querySelector('#emN').value.trim()||'Atleta',city:b.querySelector('#emC').value.trim()||null,bio:b.querySelector('#emB').value.trim()||null};
          SOC.me=(await sbq(SOC.sb.from('profiles').update(upd).eq('id',SOC.user.id).select()))[0];SOC.prof[SOC.user.id]=SOC.me;closeSheet(el);render();toast('Perfil salvo')}
        catch(err){x.disabled=false;x.textContent='Salvar';toast(sbErr(err))}}};
  })}

const saveMeta=()=>lsSet('athos.sync',SYNC.meta);
const logoSrc=()=>{const i=document.querySelector('.brand img');return i?i.src:''};
function accErr(e){const m=String((e&&(e.message||e.error_description||e.code))||e||'');
  if(/Invalid login/i.test(m))return'E-mail ou senha incorretos.';
  if(/not confirmed/i.test(m))return'Seu e-mail ainda não foi confirmado.';
  if(/already registered|already exists/i.test(m))return'Já existe uma conta com esse e-mail. Toque em “Entrar”.';
  if(/expired|invalid.*(otp|token)|otp.*invalid|token.*(invalid|expired)/i.test(m))return'Código inválido ou vencido. Confira os números ou peça um novo.';
  if(/Password should|weak/i.test(m))return'Senha fraca: use pelo menos 8 caracteres, misturando letras e números.';
  if(/valid email|invalid format|email address .* invalid/i.test(m))return'Esse e-mail não parece válido.';
  if(/not authorized/i.test(m))return'O servidor de e-mail do app ainda não está liberado para esse endereço. Avise o administrador do ATHOS.';
  if(/rate limit|too many|security purposes/i.test(m))return'Muitas tentativas seguidas. Espere um minuto e tente de novo.';
  if(/Failed to fetch|NetworkError|network|offline/i.test(m))return'Sem conexão com a internet.';
  if(/same.*password|different from the old/i.test(m))return'A nova senha precisa ser diferente da antiga.';
  return'Não deu certo: '+m.slice(0,140)}

/* ----- sincronização ----- */
function syncKeys(){const k=['profile'];for(const d in S.days)k.push('d-'+d);for(const s in S.sessions)k.push(s);return k}
function syncChip(){const el=$('#sync');if(!el||!SOC.user)return;const n=Object.keys(SYNC.meta.pend).length;el.classList.toggle('on',!n);el.classList.toggle('wait',!!n);
  el.querySelector('span').textContent=n?(navigator.onLine===false?'Sem internet · '+n+' para enviar':'Sincronizando…'):'Salvo na conta'}
function schedulePush(ms){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushPending,ms==null?1500:ms);syncChip()}
async function pushPending(){
  if(!SOC.user||SYNC.pushing)return;const keys=Object.keys(SYNC.meta.pend);if(!keys.length){syncChip();return}
  SYNC.pushing=true;const stamp={...SYNC.meta.pend};
  try{
    for(let i=0;i<keys.length;i+=40){const part=keys.slice(i,i+40);
      const rows=part.map(k=>{const d=store.dataFor(k);return{user_id:SOC.user.id,key:k,data:d?JSON.parse(JSON.stringify(d)):null,deleted:!d}});
      const r=await SOC.sb.from('user_data').upsert(rows,{onConflict:'user_id,key'});if(r.error)throw r.error;
      for(const k of part)if(SYNC.meta.pend[k]===stamp[k])delete SYNC.meta.pend[k];saveMeta()}
  }catch(e){SYNC.pushing=false;syncChip();setTimeout(()=>schedulePush(0),20000);return}
  SYNC.pushing=false;syncChip();if(Object.keys(SYNC.meta.pend).length)schedulePush(500);
}
function applyRow(r){
  if(SYNC.meta.pend[r.key])return false;const k=r.key,d=r.data;
  if(k==='profile'){if(r.deleted||!d)return false;const p=clone(d);delete p.kind;delete p.ts;S.profile={...clone(DEF_PROFILE),...p};return true}
  if(k.startsWith('d-')){const date=k.slice(2);if(r.deleted||!d)delete S.days[date];else S.days[date]=d;return true}
  if(r.deleted||!d)delete S.sessions[k];else S.sessions[k]=d;return true;
}
async function pullAll(full){
  if(!SOC.user||SYNC.pulling)return;SYNC.pulling=true;
  try{let from=0,changed=false,maxT=SYNC.meta.last;
    for(;;){let q=SOC.sb.from('user_data').select('key,data,deleted,updated_at').eq('user_id',SOC.user.id).order('updated_at',{ascending:true}).range(from,from+499);
      if(!full&&SYNC.meta.last)q=q.gt('updated_at',SYNC.meta.last);
      const r=await q;if(r.error)throw r.error;for(const row of r.data){if(applyRow(row))changed=true;if(!maxT||row.updated_at>maxT)maxT=row.updated_at}
      if(r.data.length<500)break;from+=500}
    SYNC.meta.last=maxT;saveMeta();if(changed){flushLocal();schedule()}
  }catch(e){}
  SYNC.pulling=false;
}
function wipeLocal(){S.profile=clone(DEF_PROFILE);S.days={};S.sessions={};S.active=null;saveActive();flushLocal();SYNC.meta={uid:null,pend:{},last:null};saveMeta()}
async function onAccount(u){
  if(!u){$('#sync').classList.remove('on','wait');$('#sync span').textContent='Neste aparelho';return}
  if(SYNC.meta.uid&&SYNC.meta.uid!==u.id){S.profile=clone(DEF_PROFILE);S.days={};S.sessions={};S.active=null;saveActive();flushLocal();SYNC.meta={uid:u.id,pend:{},last:null}}
  else if(!SYNC.meta.uid){const now=Date.now();const hasLocal=Object.keys(S.days).length||Object.keys(S.sessions).length||(S.profile.templates||[]).length||S.profile.age;
    SYNC.meta={uid:u.id,pend:{},last:null};if(hasLocal)for(const k of syncKeys())SYNC.meta.pend[k]=now}
  saveMeta();await pullAll(!SYNC.meta.last);
  if(!S.profile.name){S.profile.name=(u.user_metadata&&u.user_metadata.name)||(SOC.me&&SOC.me.name)||'';if(S.profile.name)store.mark('profile')}
  pushPending();render();
}
{const _mark=store.mark.bind(store);store.mark=function(key,delay){_mark(key,delay);if(SOC.user){SYNC.meta.pend[key]=Date.now();saveMeta();schedulePush()}}}
window.addEventListener('online',()=>schedulePush(0));

async function nGoto(kind,post,conv,actor,club){
