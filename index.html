function once(k,fn){if(SOC['_'+k])return;SOC['_'+k]=1;Promise.resolve().then(fn).finally(()=>{SOC['_'+k]=0})}
async function sbq(p){const r=await p;if(r.error)throw r.error;return r.data}
function sbErr(e){const m=String((e&&(e.message||e.error_description))||e||'');
  if(/Invalid login/i.test(m))return'E-mail ou senha incorretos.';if(/already registered|already exists/i.test(m))return'Já existe uma conta com esse e-mail. Use “Entrar”.';
  if(/Password should be/i.test(m))return'A senha precisa ter pelo menos 6 caracteres.';if(/valid email|invalid format/i.test(m))return'Esse e-mail não parece válido.';
  if(/rate limit/i.test(m))return'Muitas tentativas. Espere alguns minutos.';if(/Failed to fetch|NetworkError|network/i.test(m))return'Sem conexão com a internet.';
  if(/bloqueado/i.test(m))return'Não é possível falar com essa pessoa.';if(/username/i.test(m))return'Nome de usuário inválido ou já em uso (3 a 24 letras minúsculas, números, _ ou .).';
  return'Algo deu errado: '+m.slice(0,120)}
const avColor=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 45% 45%)`};
function avatar(p,cls=''){p=p||{};const n=(p.name||'?').trim();const ini=n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return`<span class="av ${cls}" style="background:${avColor(p.id||n)}">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="" loading="lazy">`:esc(ini)}</span>`}
function ago(ts){const s=(Date.now()-new Date(ts).getTime())/1000;if(s<60)return'agora';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';if(s<7*86400)return Math.floor(s/86400)+' d';return new Date(ts).toLocaleDateString('pt-BR',{day:'numeric',month:'short'})}
async function loadProfiles(ids){const need=[...new Set(ids)].filter(i=>i&&!SOC.prof[i]);if(!need.length)return;for(const p of await sbq(SOC.sb.from('profiles').select('*').in('id',need)))SOC.prof[p.id]=p}
const pName=id=>(SOC.prof[id]&&SOC.prof[id].name)||'Atleta';

/* ----- sessão ----- */
function sbInit(){
  if(!window.supabase||!window.supabase.createClient)return;
  SOC.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  SOC.sb.auth.onAuthStateChange((ev,sess)=>{const u=sess?sess.user:null;const changed=(u&&u.id)!==(SOC.user&&SOC.user.id);SOC.user=u;try{aiActivate()}catch(e){}if(changed){if(u)socBoot();else socReset()}schedule()});
}
function socReset(){Object.assign(SOC,{me:null,feed:null,prof:{},likeN:{},myLikes:new Set(),cmtN:{},following:new Set(),convs:null,unread:0,clubs:null,myClubs:new Set(),people:null,rank:null});if(SOC.inbox){try{SOC.sb.removeChannel(SOC.inbox)}catch(e){}SOC.inbox=null}drawDot()}
async function socBoot(){
  try{const uid=SOC.user.id;
    let me=(await sbq(SOC.sb.from('profiles').select('*').eq('id',uid)))[0];
    if(!me){me=(await sbq(SOC.sb.from('profiles').insert({id:uid,name:(SOC.user.user_metadata&&SOC.user.user_metadata.name)||S.profile.name||'Atleta'}).select()))[0]}
    SOC.me=me;SOC.prof[uid]=me;
    SOC.following=new Set((await sbq(SOC.sb.from('follows').select('following').eq('follower',uid))).map(r=>r.following));
    const {count}=await SOC.sb.from('follows').select('*',{count:'exact',head:true}).eq('following',uid);SOC.followers=count||0;
    schedule();loadFeed();loadConvs();
    if(!SOC.inbox)SOC.inbox=SOC.sb.channel('inbox').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},onNewMessage).subscribe();
  }catch(e){SOC.err=sbErr(e);schedule()}
}

/* ----- feed ----- */
async function loadFeed(){
  if(!SOC.user)return;SOC.loading=true;schedule();
  try{let qy=SOC.sb.from('posts').select('*').order('created_at',{ascending:false}).limit(40);
    qy=SOC.feedMode==='seguindo'?qy.in('user_id',[SOC.user.id,...SOC.following]):qy.eq('visibility','public');
    const posts=await sbq(qy);await countsFor(posts);await loadProfiles(posts.map(p=>p.user_id));SOC.feed=posts;SOC.err=''}
  catch(e){SOC.err=sbErr(e)}SOC.loading=false;schedule();
}
async function countsFor(posts){const ids=posts.map(p=>p.id);if(!ids.length)return;
  const lk=await sbq(SOC.sb.from('likes').select('post_id,user_id').in('post_id',ids));const cm=await sbq(SOC.sb.from('comments').select('post_id').in('post_id',ids));
  for(const id of ids){SOC.likeN[id]=0;SOC.cmtN[id]=0}for(const l of lk){SOC.likeN[l.post_id]++;if(l.user_id===SOC.user.id)SOC.myLikes.add(l.post_id)}for(const c of cm)SOC.cmtN[c.post_id]++}
const VIS={public:'Público',followers:'Seguidores',private:'Só eu'};
function postStats(p){const s=p.stats||{};
  if(p.kind==='run'){const r={type:s.type||'run',dist:s.dist||0,moving:s.moving||0};return`<div class="grid3"><div class="stat"><span class="num">${km2(r.dist)}</span><small>km</small></div><div class="stat"><span class="num">${speedOrPace(r).replace('/km','')}</span><small>${r.type==='bike'?'velocidade':'ritmo /km'}</small></div><div class="stat"><span class="num">${fmtDur(r.moving*1000).replace(/^00:/,'')}</span><small>tempo</small></div>${s.steps?`<div class="stat"><span class="num">${fmtN(s.steps)}</span><small>passos</small></div>`:''}${s.elev?`<div class="stat"><span class="num">+${fmtN(s.elev)}</span><small>m subida</small></div>`:''}</div>`}
  if(p.kind==='workout'){if(s.checkin)return`<p class="small muted">Check-in · ${fmtN(s.dur||0)} min</p>`;
    return`<div class="grid3"><div class="stat"><span class="num">${fmtN(s.sets||0)}</span><small>séries</small></div><div class="stat"><span class="num">${fmtN(s.vol||0)}</span><small>kg de volume</small></div><div class="stat"><span class="num">${fmtN(s.dur||0)}</span><small>min</small></div></div>${(s.ex||[]).length?`<p class="small muted">${s.ex.map(e=>esc(e.n)+(e.best?` (${fmtD(e.best)} kg)`:'')).join(' · ')}</p>`:''}${(s.prs||[]).length?`<div class="chips">${s.prs.map(x=>`<span class="chip pr">Recorde: ${esc(x)}</span>`).join('')}</div>`:''}`}
  return'';
}
function postCard(p,full){const a=SOC.prof[p.user_id]||{id:p.user_id};const mine=p.user_id===(SOC.user&&SOC.user.id);
  return`<article class="card post" data-post="${p.id}"><div class="who"><button class="av-btn" data-act="socProfile" data-id="${p.user_id}" style="border:0;background:none;padding:0">${avatar(a)}</button><div class="t"><b>${esc(a.name||'Atleta')}</b><small>${ago(p.created_at)}${a.city?' · '+esc(a.city):''} · ${VIS[p.visibility]||''}</small></div><button class="icon-btn" data-act="socPostMenu" data-id="${p.id}" aria-label="Opções do post">⋯</button></div>
  ${p.title?`<h3>${esc(p.title)}</h3>`:''}${p.body?`<p class="body">${esc(p.body)}</p>`:''}${postStats(p)}
  ${p.route&&p.route.length>1?`<div class="route" ${full?'id="socMap"':''}>${routeSvg(p.route)}</div>`:''}${p.photo_url?`<div class="photo"><img src="${esc(p.photo_url)}" alt="Foto do post" loading="lazy"></div>`:''}
  <div class="acts"><button data-act="socLike" data-id="${p.id}" aria-pressed="${SOC.myLikes.has(p.id)}">♥ ${SOC.likeN[p.id]||0}</button>${full?'':`<button data-act="socOpenPost" data-id="${p.id}">Comentar · ${SOC.cmtN[p.id]||0}</button>`}</div></article>`}

/* ----- telas ----- */
function vSocial(){
  let h=`<div class="row between" style="padding-top:4px"><div><p class="eyebrow">Comunidade</p><h1>Social</h1></div>${SOC.user?'<button class="btn primary sm" data-act="socNewPost">+ Postar</button>':''}</div>`;
  if(!SOC.sb)return h+`<div class="empty"><b>Rede indisponível</b><span>Não consegui carregar a conexão com a rede. Verifique a internet e abra o app de novo.</span></div>`;
  if(!SOC.user)return h+socLoginHtml();
  const tabs=[['feed','Feed'],['msgs','Mensagens'],['clubes','Clubes'],['pessoas','Pessoas'],['eu','Eu']];
  h+=`<div class="seg soc-seg" role="group">${tabs.map(([k,l])=>`<button data-act="socSub" data-k="${k}" aria-pressed="${SOC.sub===k}">${l}${k==='msgs'&&SOC.unread?`<span class="badge">${SOC.unread}</span>`:''}</button>`).join('')}</div>`;
  if(SOC.err)h+=`<p class="chip warn" style="align-self:flex-start">${esc(SOC.err)}</p>`;
  return h+({feed:socFeedHtml,msgs:socMsgsHtml,clubes:socClubsHtml,pessoas:socPeopleHtml,eu:socMeHtml}[SOC.sub]||socFeedHtml)();
}
function socLoginHtml(){const c=SOC.authMode==='criar';
  return`<div class="card"><h3>${c?'Criar conta':'Entrar na rede'}</h3><p class="hint">Poste seus treinos e corridas, curta e comente os dos amigos, converse e participe de clubes.</p>
  <div class="seg"><button data-act="socAuthMode" data-k="entrar" aria-pressed="${!c}">Entrar</button><button data-act="socAuthMode" data-k="criar" aria-pressed="${c}">Criar conta</button></div>
  ${c?`<label class="fld"><span>Seu nome</span><input id="sName" value="${esc(S.profile.name||'')}" autocomplete="name"></label>`:''}
  <label class="fld"><span>E-mail</span><input id="sEmail" type="email" autocomplete="email" autocapitalize="off"></label>
  <label class="fld"><span>Senha${c?' (mínimo 6 caracteres)':''}</span><input id="sPass" type="password" autocomplete="${c?'new-password':'current-password'}"></label>
  ${c?`<label class="check" style="align-items:flex-start"><input type="checkbox" id="sTerms"><span class="small">Entendo que meus posts, fotos e percursos ficam guardados no servidor da rede (Supabase), que eu escolho quem vê cada post (público, seguidores ou só eu) e que posso apagar meus posts quando quiser. Os percursos escondem os primeiros e os últimos 200 m.</span></label>`:''}
  <button class="btn primary block" data-act="socAuth">${c?'Criar conta':'Entrar'}</button></div>`}
function socFeedHtml(){
  let h=`<div class="chips"><button class="chip" data-act="socFeedMode" data-k="seguindo" aria-pressed="${SOC.feedMode==='seguindo'}">Seguindo</button><button class="chip" data-act="socFeedMode" data-k="descobrir" aria-pressed="${SOC.feedMode==='descobrir'}">Descobrir</button><button class="chip" data-act="socReload">Atualizar</button></div>`;
  if(SOC.loading&&!SOC.feed)return h+thinking('Carregando o feed…');
  if(!SOC.feed||!SOC.feed.length)return h+`<div class="empty"><b>${SOC.feedMode==='seguindo'?'Seu feed está vazio':'Nenhum post público ainda'}</b><span>${SOC.feedMode==='seguindo'?'Siga pessoas na aba Pessoas ou poste sua primeira atividade.':'Seja o primeiro a postar em público.'}</span><button class="btn primary" data-act="socNewPost">Postar uma atividade</button></div>`;
  return h+SOC.feed.map(p=>postCard(p)).join('');
}
function socMsgsHtml(){
  if(!SOC.convs)return thinking('Carregando conversas…');
  if(!SOC.convs.length)return`<div class="empty"><b>Nenhuma conversa ainda</b><span>Abra o perfil de alguém e toque em “Mensagem”, ou entre num clube para falar no chat do grupo.</span></div>`;
  return`<div class="card"><div class="list">${SOC.convs.map(c=>`<button class="li" data-act="socChat" data-id="${c.id}"><span class="row" style="flex-wrap:nowrap;min-width:0">${c.is_group?`<span class="av" style="background:var(--accent)">${esc((c.name||'G')[0].toUpperCase())}</span>`:avatar(SOC.prof[c.other])}<span class="t"><b>${esc(c.title)}${c.unread?'<span class="badge">'+c.unread+'</span>':''}</b><small>${c.last?esc((c.last.user_id===SOC.user.id?'Você: ':'')+c.last.body.slice(0,60)):'Sem mensagens'}</small></span></span><span class="small muted">${c.last?ago(c.last.created_at):''}</span></button>`).join('')}</div></div>`;
}
function socClubsHtml(){
  if(!SOC.clubs){once('clubs',loadClubs);return thinking('Carregando clubes…')}
  return`<button class="btn primary" data-act="socNewClub">+ Criar clube</button>${SOC.clubs.length?`<div class="card"><div class="list">${SOC.clubs.map(c=>`<button class="li" data-act="socClub" data-id="${c.id}"><span class="t"><b>${esc(c.name)}</b><small>${c.n} membro${c.n===1?'':'s'}${SOC.myClubs.has(c.id)?' · você participa':''}</small></span><span class="muted">›</span></button>`).join('')}</div></div>`:`<div class="empty"><b>Nenhum clube ainda</b><span>Crie um clube para a sua academia ou grupo de corrida. Cada clube tem chat e ranking semanal.</span></div>`}`;
}
function socPeopleHtml(){
  if(!SOC.people)once('people',()=>socSearch(SOC.pq));
  const P=SOC.people,row=p=>`<div class="li"><button class="row" data-act="socProfile" data-id="${p.id}" style="border:0;background:none;padding:0;flex-wrap:nowrap;min-width:0;text-align:left;color:inherit">${avatar(p)}<span class="t"><b>${esc(p.name)}</b><small>${p.public_id?'ID '+fmtId(p.public_id):''}${p.city?' · '+esc(p.city):''}</small></span></button>${p.id===SOC.user.id?'<span class="chip">Você</span>':`<button class="btn sm ${SOC.following.has(p.id)?'':'primary'}" data-act="socFollow" data-id="${p.id}">${SOC.following.has(p.id)?'Seguindo':'Seguir'}</button>`}</div>`;
  let h=`<input id="socQ" type="search" placeholder="Buscar pelo nome ou pelo ID" value="${esc(SOC.pq)}" aria-label="Buscar pessoas pelo nome ou ID" autocomplete="off">`;
  if(!P)return h+thinking('Buscando…');
  if(P.mode==='curto')return h+`<p class="hint">Digite pelo menos 2 letras do nome ou o ID de 7 números.</p>`;
  if(P.mode==='busca')return h+(P.list.length?`<div class="card"><div class="list">${P.list.map(row).join('')}</div></div>`:`<div class="empty"><b>Ninguém encontrado</b><span>Confira o nome ou peça o ID da pessoa. Ele fica na aba Eu.</span></div>`);
  const me=SOC.me||{};
  h+=`<div class="card"><h3>Encontre seus amigos</h3><p class="hint">Ninguém aparece numa lista aberta: para achar alguém, busque pelo nome ou pelo ID. Mande o seu ID para os amigos te acharem.</p>${me.public_id?`<div class="row between"><span>Seu ID: <b class="num" style="font-size:22px">${fmtId(me.public_id)}</b></span><button class="btn sm soft" data-act="socShareId">Compartilhar</button></div>`:''}</div>`;
  h+=`<h3 style="margin-top:6px">Quem você segue</h3>`+(P.list.length?`<div class="card"><div class="list">${P.list.map(row).join('')}</div></div>`:`<p class="hint">Você ainda não segue ninguém.</p>`);
  return h}
function socMeHtml(){const m=SOC.me||{};
  if(!SOC.rank)once('rank',()=>loadRank());
  return`<div class="card"><div class="row">${avatar(m,'lg')}<div class="t" style="flex:1;min-width:0"><h2>${esc(m.name||'')}</h2><p class="small muted">${m.public_id?'ID '+fmtId(m.public_id):''}${m.city?' · '+esc(m.city):''}</p></div>${m.public_id?'<button class="btn sm soft" data-act="socShareId">Compartilhar ID</button>':''}</div>${m.bio?`<p>${esc(m.bio)}</p>`:''}
   <div class="grid3"><div class="stat"><span class="num">${SOC.following.size}</span><small>seguindo</small></div><div class="stat"><span class="num">${SOC.followers}</span><small>seguidores</small></div></div>
   <div class="btns"><button class="btn" data-act="socEditMe">Editar perfil</button><button class="btn" data-act="socProfile" data-id="${m.id}">Meus posts</button></div></div>
   <div class="card"><h3>Ranking da semana</h3><p class="hint">Você e quem você segue, desde segunda.</p>${rankHtml(SOC.rank)}</div>
   <div class="card"><p class="hint">Conectado como ${esc(SOC.user.email||'')}.</p><button class="btn danger" data-act="socLogout">Sair da conta</button></div>`;
}
function rankHtml(r){if(!r)return thinking('Calculando…');if(!r.length)return'<p class="hint">Ninguém postou atividades nesta semana ainda.</p>';
  return`<div class="list">${r.map((x,i)=>`<div class="li"><span class="row" style="flex-wrap:nowrap;min-width:0"><b class="num" style="width:22px">${i+1}</b>${avatar(SOC.prof[x.user_id],'sm')}<span class="t"><b>${esc(pName(x.user_id))}</b><small>${x.atividades} corrida(s) · ${x.treinos} treino(s)</small></span></span><b class="num" style="font-size:19px">${fmtD(+x.km)} km</b></div>`).join('')}</div>`}
async function loadRank(club){try{const r=await sbq(SOC.sb.rpc('weekly_ranking',club?{p_club:club}:{}));await loadProfiles(r.map(x=>x.user_id));if(club)return r;SOC.rank=r;schedule()}catch(e){if(club)throw e;SOC.rank=[];schedule()}}

/* ----- pessoas e perfis ----- */
let pqT=null;
async function socSearch(qs){SOC.pq=qs;const t=String(qs||'').trim();
  try{if(!t){const ids=[...SOC.following];await loadProfiles(ids);SOC.people={mode:'seguindo',list:ids.map(id=>SOC.prof[id]).filter(Boolean).sort((a,b)=>(a.name||'').localeCompare(b.name||''))}}
    else if(t.replace(/^(id|#)\s*/i,'').replace(/\s/g,'').length<2&&!/^\d/.test(t)){SOC.people={mode:'curto',list:[]}}
    else{const r=await sbq(SOC.sb.rpc('search_people',{q:t}));for(const p of r)SOC.prof[p.id]=p;SOC.people={mode:'busca',list:r}}}
  catch(e){SOC.people={mode:'busca',list:[]};SOC.err=sbErr(e)}schedule()}
const fmtId=v=>v?String(v).replace(/^(\d{3})(\d{4})$/,'$1 $2'):'';
document.addEventListener('input',e=>{if(e.target.id==='socQ'){const v=e.target.value;clearTimeout(pqT);pqT=setTimeout(()=>socSearch(v),350)}});
async function socToggleFollow(id){const on=SOC.following.has(id);
  try{if(on){await sbq(SOC.sb.from('follows').delete().eq('follower',SOC.user.id).eq('following',id));SOC.following.delete(id)}else{await sbq(SOC.sb.from('follows').insert({follower:SOC.user.id,following:id}));SOC.following.add(id)}SOC.rank=null;render()}
  catch(e){toast(sbErr(e))}}
async function socProfileSheet(id){
  await loadProfiles([id]).catch(()=>{});const p=SOC.prof[id]||{id,name:'Atleta'};const mine=id===SOC.user.id;
  openSheet(p.name||'Perfil',`<div class="row">${avatar(p,'lg')}<div class="t" style="flex:1;min-width:0"><h2>${esc(p.name||'')}</h2><p class="small muted">${p.public_id?'ID '+fmtId(p.public_id):''}${p.city?' · '+esc(p.city):''}</p></div></div>${p.bio?`<p>${esc(p.bio)}</p>`:''}
   ${mine?'':`<div class="btns"><button class="btn ${SOC.following.has(id)?'':'primary'}" data-s="follow">${SOC.following.has(id)?'Deixar de seguir':'Seguir'}</button><button class="btn" data-s="dm">Mensagem</button></div>`}
   <div id="pPosts">${thinking('Carregando posts…')}</div>${mine?'':'<div class="btns"><button class="btn sm danger" data-s="block">Bloquear</button><button class="btn sm" data-s="report">Denunciar perfil</button></div>'}`,async(b,el)=>{
    b.onclick=async e=>{const x=e.target.closest('[data-s]');if(!x)return;
      if(x.dataset.s==='follow'){await socToggleFollow(id);x.textContent=SOC.following.has(id)?'Deixar de seguir':'Seguir';x.classList.toggle('primary',!SOC.following.has(id))}
      if(x.dataset.s==='dm'){try{const conv=await sbq(SOC.sb.rpc('start_dm',{other:id}));closeSheet(el);await loadConvs();socChatSheet(conv)}catch(err){toast(sbErr(err))}}
      if(x.dataset.s==='block')confirmSheet(`Bloquear ${p.name}? Vocês deixam de se ver e de conversar.`,'Bloquear',async()=>{try{await sbq(SOC.sb.from('blocks').insert({blocker:SOC.user.id,blocked:id}));await SOC.sb.from('follows').delete().eq('follower',SOC.user.id).eq('following',id);SOC.following.delete(id);closeSheet(el);loadFeed();toast('Pessoa bloqueada')}catch(err){toast(sbErr(err))}});
      if(x.dataset.s==='report')socReport({user_id:id});
    };
    try{const posts=await sbq(SOC.sb.from('posts').select('*').eq('user_id',id).order('created_at',{ascending:false}).limit(20));await countsFor(posts);for(const q of posts)socPostCache[q.id]=q;
      const box=b.querySelector('#pPosts');if(box)box.innerHTML=posts.length?posts.map(q=>postCard(q)).join(''):'<p class="hint">Nenhum post que você possa ver.</p>'}
    catch(err){const box=b.querySelector('#pPosts');if(box)box.innerHTML=`<p class="hint">${esc(sbErr(err))}</p>`}
  });
}
const socPostCache={};
function findPost(id){return(SOC.feed||[]).find(p=>p.id===id)||socPostCache[id]}
function socReport(target){openSheet('Denunciar',`<label class="fld"><span>O que aconteceu?</span><textarea id="rpR" placeholder="Ex.: conteúdo ofensivo, spam, perfil falso"></textarea></label><button class="btn primary block" data-s="send">Enviar denúncia</button>`,(b,el)=>{b.querySelector('[data-s=send]').onclick=async()=>{try{await sbq(SOC.sb.from('reports').insert({...target,reporter:SOC.user.id,reason:b.querySelector('#rpR').value.trim().slice(0,500)}));closeSheet(el);toast('Denúncia enviada')}catch(e){toast(sbErr(e))}}})}

/* ----- post: detalhe, curtir, comentar ----- */
async function socLike(id,btn){const on=SOC.myLikes.has(id);
  if(on){SOC.myLikes.delete(id);SOC.likeN[id]=Math.max(0,(SOC.likeN[id]||1)-1)}else{SOC.myLikes.add(id);SOC.likeN[id]=(SOC.likeN[id]||0)+1}
  document.querySelectorAll(`[data-act=socLike][data-id="${id}"]`).forEach(b=>{b.setAttribute('aria-pressed',!on);b.textContent='♥ '+SOC.likeN[id]});
  try{if(on)await sbq(SOC.sb.from('likes').delete().eq('post_id',id).eq('user_id',SOC.user.id));else await sbq(SOC.sb.from('likes').insert({post_id:id,user_id:SOC.user.id}))}catch(e){toast(sbErr(e))}}
function socOpenPost(id){const p=findPost(id);if(!p)return;
  openSheet('Post',`${postCard(p,true)}<h3>Comentários</h3><div id="cmts" style="display:flex;flex-direction:column;gap:8px">${thinking('Carregando…')}</div>

/* ----- postar ----- */
function hav(a,b){const R=6371000,toR=Math.PI/180,dLa=(b[0]-a[0])*toR,dLo=(b[1]-a[1])*toR;const x=Math.sin(dLa/2)**2+Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function trimRoute(pts,m){if(!pts||pts.length<2)return null;if(!m)return pts;const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hav(pts[i-1],pts[i]));const tot=cum[cum.length-1];const out=pts.filter((_,i)=>cum[i]>=m&&cum[i]<=tot-m);return out.length>1?out:null}
/* abre a foto já reduzida (evita estourar a memória com fotos grandes de câmera) */
async function decodePhoto(file,max){
  if(window.createImageBitmap){
    try{const probe=await createImageBitmap(file);const w=probe.width,h=probe.height;
      const k=Math.min(1,max/Math.max(w,h));if(k>=1)return probe;probe.close&&probe.close();
      return await createImageBitmap(file,{resizeWidth:Math.round(w*k),resizeHeight:Math.round(h*k),resizeQuality:'high'})}catch(e){}
  }
  const url=URL.createObjectURL(file);
  try{return await new Promise((ok,no)=>{const i=new Image();i.decoding='async';i.onload=()=>ok(i);i.onerror=()=>no(new Error('decode'));i.src=url})}
  finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
async function shrinkPhoto(file,opt){opt=opt||{};const max=opt.square?512:1280;
  let img;try{img=await decodePhoto(file,opt.square?1024:max)}catch(e){throw new Error('foto_ilegivel')}
  const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;if(!W||!H)throw new Error('foto_ilegivel');
  const c=document.createElement('canvas'),g=c.getContext('2d');
  if(opt.square){const side=Math.min(W,H),out=Math.min(max,side);c.width=c.height=out;g.drawImage(img,(W-side)/2,(H-side)/2,side,side,0,0,out,out)}
  else{const k=Math.min(1,max/Math.max(W,H));c.width=Math.round(W*k);c.height=Math.round(H*k);g.drawImage(img,0,0,c.width,c.height)}
  try{img.close&&img.close()}catch(e){}
  let q=0.85,blob=null;
  for(let t=0;t<4;t++){blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(!blob)break;if(blob.size<1500000)break;q-=0.15}
  c.width=c.height=0;
  if(!blob)throw new Error('foto_ilegivel');return blob}
function photoErr(e){const m=String((e&&e.message)||e||'');
  if(m==='foto_ilegivel')return'Não consegui abrir essa foto. Tente outra, de preferência JPG ou PNG.';
  if(/exceeded|too large|payload/i.test(m))return'A foto ficou grande demais. Tente outra.';
  if(/row-level security|JWT|not authorized|Unauthorized|403/i.test(m))return'Sua sessão expirou. Saia da conta e entre de novo.';
  return sbErr(e)}
async function uploadPhoto(file,folder,opt){const blob=await shrinkPhoto(file,opt);const path=`${SOC.user.id}/${folder||'p'}-${Date.now()}.jpg`;
  let last=null;
  for(let t=0;t<2;t++){try{await sbq(SOC.sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg',upsert:false,cacheControl:'31536000'}));last=null;break}catch(e){if(t&&/exists|Duplicate/i.test(String(e&&e.message))){last=null;break}last=e;if(/row-level|JWT|exceeded|too large/i.test(String(e&&e.message)))break;await new Promise(r=>setTimeout(r,1200))}}
  if(last)throw last;
  return SOC.sb.storage.from('fotos').getPublicUrl(path).data.publicUrl}
function photoPath(url){const k='/object/public/fotos/';const i=String(url||'').indexOf(k);return i<0?null:decodeURIComponent(url.slice(i+k.length).split('?')[0])}
function sessToPost(s){
  if(s.run){const r=s.run;return{kind:'run',title:s.name,stats:{type:r.type,dist:r.dist,moving:r.moving,steps:r.stepsEst?null:r.steps,elev:r.elev,kcal:r.kcal,best1k:r.best1k},route:r.pts}}
  const x=sessStats(s);if(s.checkin)return{kind:'workout',title:s.name,stats:{checkin:true,dur:Math.round(x.dur/60000)}};
  return{kind:'workout',title:s.name,stats:{sets:x.sets,vol:Math.round(x.vol),dur:Math.round(x.dur/60000),ex:(s.exercises||[]).slice(0,8).map(e=>({n:e.name,best:e.type==='w'?Math.max(0,...e.sets.map(t=>num(t.kg))):null})),prs:(s.prs||[]).map(p=>p.name)}};
}

async function loadConvs(){
  if(!SOC.user)return;
  try{const mem=await sbq(SOC.sb.from('conversation_members').select('conversation_id,user_id,last_read'));
    const ids=[...new Set(mem.map(m=>m.conversation_id))];if(!ids.length){SOC.convs=[];SOC.unread=0;drawDot();schedule();return}
    const convs=await sbq(SOC.sb.from('conversations').select('*').in('id',ids).order('last_at',{ascending:false}));
    const msgs=await sbq(SOC.sb.from('messages').select('*').in('conversation_id',ids).order('created_at',{ascending:false}).limit(300));
    const others=mem.filter(m=>m.user_id!==SOC.user.id);await loadProfiles(others.map(m=>m.user_id));
    let tot=0;SOC.convs=convs.map(c=>{const mine=mem.find(m=>m.conversation_id===c.id&&m.user_id===SOC.user.id);const other=(others.find(m=>m.conversation_id===c.id)||{}).user_id;const cm=msgs.filter(m=>m.conversation_id===c.id);
      const unread=cm.filter(m=>m.user_id!==SOC.user.id&&mine&&new Date(m.created_at)>new Date(mine.last_read)).length;tot+=unread;
      return{...c,other,title:c.is_group?(c.name||'Grupo'):pName(other),last:cm[0]||null,unread,lastRead:mine&&mine.last_read}});
    SOC.unread=tot;drawDot();schedule()}
  catch(e){SOC.convs=SOC.convs||[];SOC.err=sbErr(e);schedule()}
}
function drawDot(){const d=$('#socDot');if(!d)return;d.hidden=!SOC.unread;d.textContent=SOC.unread>9?'9+':String(SOC.unread||'')}
async function onNewMessage(pl){const m=pl.new;if(SOC.openConv&&SOC.openConv.id===m.conversation_id){SOC.openConv.push(m);return}
  if(m.user_id===SOC.user.id)return;await loadProfiles([m.user_id]).catch(()=>{});toast(`${pName(m.user_id)}: ${m.body.slice(0,60)}`);try{NATIVE&&NATIVE.vibrate()}catch(e){}loadConvs()}
function socChatSheet(convId){
  const c=(SOC.convs||[]).find(x=>x.id===convId)||{id:convId,title:'Conversa',is_group:false};
  openSheet(c.title,`<div class="chat" id="chatBox">${thinking('Carregando…')}</div><div class="sendbar"><textarea id="chatIn" placeholder="Mensagem" maxlength="2000"></textarea><button class="btn primary" data-s="send">Enviar</button></div>`,async(b,el)=>{
    const box=b.querySelector('#chatBox');let list=[];
    const draw=()=>{box.innerHTML=list.length?list.map(m=>{const me=m.user_id===SOC.user.id;return`<div class="msg ${me?'me':''}">${c.is_group&&!me?`<span class="who">${esc(pName(m.user_id))}</span>`:''}${esc(m.body)}<small>${new Date(m.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small></div>`}).join(''):'<p class="hint">Diga oi!</p>';
      const sb=b;sb.scrollTop=sb.scrollHeight};
    SOC.openConv={id:convId,push:async m=>{if(!document.body.contains(el)){SOC.openConv=null;return}if(list.some(x=>x.id===m.id))return;await loadProfiles([m.user_id]).catch(()=>{});list.push(m);draw();markRead()}};
    const markRead=()=>SOC.sb.from('conversation_members').update({last_read:new Date().toISOString()}).eq('conversation_id',convId).eq('user_id',SOC.user.id).then(()=>{});
    try{list=(await sbq(SOC.sb.from('messages').select('*').eq('conversation_id',convId).order('created_at',{ascending:false}).limit(100))).reverse();await loadProfiles(list.map(m=>m.user_id));draw();markRead();if(c.unread){SOC.unread=Math.max(0,SOC.unread-c.unread);c.unread=0;drawDot()}}
    catch(e){box.innerHTML=`<p class="hint">${esc(sbErr(e))}</p>`}
    const send=async()=>{const t=b.querySelector('#chatIn');const body=t.value.trim();if(!body)return;t.value='';
      try{const m=(await sbq(SOC.sb.from('messages').insert({conversation_id:convId,user_id:SOC.user.id,body}).select()))[0];if(!list.some(x=>x.id===m.id)){list.push(m);draw()}}catch(err){t.value=body;toast(sbErr(err))}};
    b.querySelector('[data-s=send]').onclick=send;
    b.querySelector('#chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
    const obs=new MutationObserver(()=>{if(!document.body.contains(el)){SOC.openConv=null;obs.disconnect();loadConvs()}});obs.observe($('#sheets'),{childList:true});
  });
}

async function loadClubs(){try{const clubs=await sbq(SOC.sb.from('clubs').select('*').order('created_at',{ascending:false}).limit(100));const mem=await sbq(SOC.sb.from('club_members').select('club_id,user_id'));
  SOC.myClubs=new Set(mem.filter(m=>m.user_id===SOC.user.id).map(m=>m.club_id));SOC.clubs=clubs.map(c=>({...c,n:mem.filter(m=>m.club_id===c.id).length})).sort((a,b)=>(SOC.myClubs.has(b.id)-SOC.myClubs.has(a.id))||b.n-a.n)}
  catch(e){SOC.clubs=[];SOC.err=sbErr(e)}schedule()}
function socNewClub(){openSheet('Criar clube',`<label class="fld"><span>Nome</span><input id="ncN" maxlength="60" placeholder="Ex.: Academia Força Total"></label><label class="fld"><span>Descrição</span><textarea id="ncD" maxlength="500" placeholder="Quem pode entrar, horários de treino, objetivo do grupo…"></textarea></label><button class="btn primary block" data-s="ok">Criar</button>`,(b,el)=>{

    try{const c=(await sbq(SOC.sb.from('clubs').insert({name,description:b.querySelector('#ncD').value.trim()||null,owner:SOC.user.id}).select()))[0];closeSheet(el);SOC.clubs=null;await loadClubs();loadConvs();socClubSheet(c.id)}catch(e){toast(sbErr(e))}}})}
function socClubSheet(id){const c=(SOC.clubs||[]).find(x=>x.id===id);if(!c)return;const inC=SOC.myClubs.has(id),own=c.owner===SOC.user.id;

   <div class="card"><h3>Ranking da semana</h3><div id="crk">${thinking('Calculando…')}</div></div>`,async(b,el)=>{
    loadRank(id).then(r=>{const x=b.querySelector('#crk');if(x)x.innerHTML=rankHtml(r)}).catch(e=>{const x=b.querySelector('#crk');if(x)x.innerHTML=`<p class="hint">${esc(sbErr(e))}</p>`});
    b.onclick=async e=>{const x=e.target.closest('[data-s]');if(!x)return;
      try{if(x.dataset.s==='join'){await sbq(SOC.sb.from('club_members').insert({club_id:id,user_id:SOC.user.id}));closeSheet(el);await loadClubs();await loadConvs();toast('Você entrou no clube');socClubSheet(id)}
        if(x.dataset.s==='leave'){await sbq(SOC.sb.from('club_members').delete().eq('club_id',id).eq('user_id',SOC.user.id));closeSheet(el);loadClubs();loadConvs()}

        if(x.dataset.s==='del')confirmSheet(`Apagar o clube “${c.name}” e o chat dele?`,'Apagar',async()=>{try{await sbq(SOC.sb.from('clubs').delete().eq('id',id));closeSheet(el);SOC.clubs=null;loadClubs();loadConvs()}catch(err){toast(sbErr(err))}})}
      catch(err){toast(sbErr(err))}};
  })}

function socEditMe(){const m=SOC.me||{};let up=null;
  openSheet('Editar perfil',`<div class="row" style="flex-wrap:nowrap"><span id="emAv">${avatar(m,'lg')}</span><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><button class="btn" data-s="photo">Trocar foto</button><small class="muted" id="emSt" aria-live="polite"></small></div></div><label class="fld"><span>Nome</span><input id="emN" maxlength="60" value="${esc(m.name||'')}"></label><label class="fld"><span>Cidade</span><input id="emC" maxlength="60" value="${esc(m.city||'')}"></label><label class="fld"><span>Bio</span><textarea id="emB" maxlength="280">${esc(m.bio||'')}</textarea></label><button class="btn primary block" data-s="save">Salvar</button>`,(b,el)=>{
    const st=b.querySelector('#emSt'),pb=b.querySelector('[data-s=photo]');
    const setAv=src=>{const a=b.querySelector('#emAv .av');if(a)a.innerHTML=`<img src="${esc(src)}" alt="">`};
    async function sendPhoto(file){
      const old=SOC.me&&SOC.me.avatar_url,prev=URL.createObjectURL(file);setAv(prev);
      pb.disabled=true;pb.textContent='Enviando…';st.textContent='Enviando a foto…';st.style.color='';
      try{const url=await uploadPhoto(file,'avatar',{square:true});
        const row=(await sbq(SOC.sb.from('profiles').update({avatar_url:url}).eq('id',SOC.user.id).select()))[0];
        if(!row)throw new Error('Não consegui salvar a foto no perfil.');
        SOC.me=row;SOC.prof[SOC.user.id]=row;st.textContent='Foto atualizada';toast('Foto de perfil atualizada');render();
        const op=photoPath(old);if(op&&op.startsWith(SOC.user.id+'/'))SOC.sb.storage.from('fotos').remove([op]).catch(()=>{});
      }catch(err){if(old)setAv(old);else{const a=b.querySelector('#emAv');if(a)a.innerHTML=avatar(SOC.me||m,'lg')}st.textContent=photoErr(err);st.style.color='var(--red)';throw err}
      finally{pb.disabled=false;pb.textContent='Trocar foto';setTimeout(()=>URL.revokeObjectURL(prev),4000)}}
    b.onclick=async e=>{const x=e.target.closest('[data-s]');if(!x)return;
      if(x.dataset.s==='photo'){const f=await pickPhoto();if(!f)return;up=sendPhoto(f);up.catch(()=>{});return}
      if(x.dataset.s==='save'){x.disabled=true;x.textContent='Salvando…';
        try{if(up){try{await up}catch(_){} }
          const upd={name:b.querySelector('#emN').value.trim()||'Atleta',city:b.querySelector('#emC').value.trim()||null,bio:b.querySelector('#emB').value.trim()||null};
          SOC.me=(await sbq(SOC.sb.from('profiles').update(upd).eq('id',SOC.user.id).select()))[0];SOC.prof[SOC.user.id]=SOC.me;closeSheet(el);render();toast('Perfil salvo')}
        catch(err){x.disabled=false;x.textContent='Salvar';toast(sbErr(err))}}};
  })}

const ACC={view:'login',email:'',name:'',err:'',ok:'',busy:false,cool:0,ready:false};
const SYNC={meta:Object.assign({uid:null,pend:{},last:null},lsGet('athos.sync')||{}),timer:null,pushing:false,pulling:false};
const saveMeta=()=>lsSet('athos.sync',SYNC.meta);
const logoSrc=()=>{const i=document.querySelector('.brand img');return i?i.src:''};
function accErr(e){const m=String((e&&(e.message||e.error_description||e.code))||e||'');
  if(/Invalid login/i.test(m))return'E-mail ou senha incorretos.';
  if(/not confirmed/i.test(m))return'Seu e-mail ainda não foi confirmado.';
  if(/already registered|already exists/i.test(m))return'Já existe uma conta com esse e-mail. Toque em “Entrar”.';
  if(/expired|invalid.*(otp|token)|otp.*invalid|token.*(invalid|expired)/i.test(m))return'Código inválido ou vencido. Confira os números ou peça um novo.';
  if(/Password should|weak/i.test(m))return'Senha fraca: use pelo menos 8 caracteres, misturando letras e números.';
  if(/valid email|invalid format|email address .* invalid/i.test(m))return'Esse e-mail não parece válido.';
  if(/not authorized/i.test(m))return'O servidor de e-mail do app ainda não está liberado para esse endereço. Avise o administrador do ATHOS.';
  if(/rate limit|too many|security purposes/i.test(m))return'Muitas tentativas seguidas. Espere um minuto e tente de novo.';
  if(/Failed to fetch|NetworkError|network|offline/i.test(m))return'Sem conexão com a internet.';
  if(/same.*password|different from the old/i.test(m))return'A nova senha precisa ser diferente da antiga.';
  return'Não deu certo: '+m.slice(0,140)}

/* ----- sincronização ----- */
function syncKeys(){const k=['profile'];for(const d in S.days)k.push('d-'+d);for(const s in S.sessions)k.push(s);return k}
function syncChip(){const el=$('#sync');if(!el||!SOC.user)return;const n=Object.keys(SYNC.meta.pend).length;el.classList.toggle('on',!n);el.classList.toggle('wait',!!n);
  el.querySelector('span').textContent=n?(navigator.onLine===false?'Sem internet · '+n+' para enviar':'Sincronizando…'):'Salvo na conta'}
function schedulePush(ms){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushPending,ms==null?1500:ms);syncChip()}
async function pushPending(){
  if(!SOC.user||SYNC.pushing)return;const keys=Object.keys(SYNC.meta.pend);if(!keys.length){syncChip();return}
  SYNC.pushing=true;const stamp={...SYNC.meta.pend};
  try{
    for(let i=0;i<keys.length;i+=40){const part=keys.slice(i,i+40);
      const rows=part.map(k=>{const d=store.dataFor(k);return{user_id:SOC.user.id,key:k,data:d?JSON.parse(JSON.stringify(d)):null,deleted:!d}});
      const r=await SOC.sb.from('user_data').upsert(rows,{onConflict:'user_id,key'});if(r.error)throw r.error;
      for(const k of part)if(SYNC.meta.pend[k]===stamp[k])delete SYNC.meta.pend[k];saveMeta()}
  }catch(e){SYNC.pushing=false;syncChip();setTimeout(()=>schedulePush(0),20000);return}
  SYNC.pushing=false;syncChip();if(Object.keys(SYNC.meta.pend).length)schedulePush(500);
}
function applyRow(r){
  if(SYNC.meta.pend[r.key])return false;const k=r.key,d=r.data;
  if(k==='profile'){if(r.deleted||!d)return false;const p=clone(d);delete p.kind;delete p.ts;S.profile={...clone(DEF_PROFILE),...p};return true}
  if(k.startsWith('d-')){const date=k.slice(2);if(r.deleted||!d)delete S.days[date];else S.days[date]=d;return true}
  if(r.deleted||!d)delete S.sessions[k];else S.sessions[k]=d;return true;
}
async function pullAll(full){
  if(!SOC.user||SYNC.pulling)return;SYNC.pulling=true;
  try{let from=0,changed=false,maxT=SYNC.meta.last;
    for(;;){let q=SOC.sb.from('user_data').select('key,data,deleted,updated_at').eq('user_id',SOC.user.id).order('updated_at',{ascending:true}).range(from,from+499);
      if(!full&&SYNC.meta.last)q=q.gt('updated_at',SYNC.meta.last);
      const r=await q;if(r.error)throw r.error;for(const row of r.data){if(applyRow(row))changed=true;if(!maxT||row.updated_at>maxT)maxT=row.updated_at}
      if(r.data.length<500)break;from+=500}
    SYNC.meta.last=maxT;saveMeta();if(changed){flushLocal();schedule()}
  }catch(e){}
  SYNC.pulling=false;
}
function wipeLocal(){S.profile=clone(DEF_PROFILE);S.days={};S.sessions={};S.active=null;saveActive();flushLocal();SYNC.meta={uid:null,pend:{},last:null};saveMeta()}
async function onAccount(u){
  if(!u){$('#sync').classList.remove('on','wait');$('#sync span').textContent='Neste aparelho';return}
  if(SYNC.meta.uid&&SYNC.meta.uid!==u.id){S.profile=clone(DEF_PROFILE);S.days={};S.sessions={};S.active=null;saveActive();flushLocal();SYNC.meta={uid:u.id,pend:{},last:null}}
  else if(!SYNC.meta.uid){const now=Date.now();const hasLocal=Object.keys(S.days).length||Object.keys(S.sessions).length||(S.profile.templates||[]).length||S.profile.age;
    SYNC.meta={uid:u.id,pend:{},last:null};if(hasLocal)for(const k of syncKeys())SYNC.meta.pend[k]=now}
  saveMeta();await pullAll(!SYNC.meta.last);
  if(!S.profile.name){S.profile.name=(u.user_metadata&&u.user_metadata.name)||(SOC.me&&SOC.me.name)||'';if(S.profile.name)store.mark('profile')}
  pushPending();render();
}
{const _mark=store.mark.bind(store);store.mark=function(key,delay){_mark(key,delay);if(SOC.user){SYNC.meta.pend[key]=Date.now();saveMeta();schedulePush()}}}

    <input id="gCode" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••" aria-label="Código">

function keepDraw(){const g=$('#authGate');const vals={};if(g)g.querySelectorAll('input').forEach(i=>{if(i.id)vals[i.id]=i.type==='checkbox'?i.checked:i.value});drawGate();for(const id in vals){const i=$('#'+id);if(i){if(i.type==='checkbox')i.checked=vals[id];else i.value=vals[id]}}}
function hideGate(){const g=$('#authGate');if(g)g.hidden=true;if(!sheets.length&&$('#session').hidden&&(!$('#run')||$('#run').hidden))document.body.classList.remove('locked')}
function setView(v){ACC.view=v;ACC.err='';ACC.ok='';drawGate();const f=$('#authGate input');if(f&&!/verify|reset/.test(v))setTimeout(()=>{try{f.focus()}catch(e){}},50);if(/verify|reset/.test(v))setTimeout(()=>{const c=$('#gCode');if(c)c.focus()},50)}
let coolT=null;function startCool(){ACC.cool=60;clearInterval(coolT);coolT=setInterval(()=>{ACC.cool--;const b=$('#authGate [data-g=resend]');if(b){b.disabled=ACC.cool>0;b.textContent=ACC.cool>0?`Reenviar código em ${ACC.cool}s`:'Reenviar código'}if(ACC.cool<=0)clearInterval(coolT)},1000)}
function pwScore(p){let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/i.test(p)&&/\d/.test(p))s++;if(/[^a-z0-9]/i.test(p))s++;return s}
function gateInput(e){if(e.target.id==='gPass'&&$('#gMeter')){const s=pwScore(e.target.value);const c=['var(--red)','var(--red)','var(--warn)','var(--green)','var(--green)'][s];$('#gMeter').style.cssText=`width:${s*25}%;background:${c}`;$('#gMeterL').textContent=['Muito curta','Fraca','Razoável','Boa','Forte'][s]}
  if(e.target.id==='gCode')e.target.value=e.target.value.replace(/\D/g,'').slice(0,8)}
function gateClick(e){const b=e.target.closest('[data-g]');if(!b)return;const k=b.dataset.g;
  if(k==='v'){const em=$('#gEmail');if(em)ACC.email=em.value.trim();setView(b.dataset.v)}
  else if(k==='eye'){const i=$('#'+b.dataset.for);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Mostrar':'Ocultar'}
  else if(k==='retry')boot()
  else if(k==='resend')resend()}
async function resend(){if(ACC.cool>0)return;ACC.err='';ACC.ok='';
  try{const r=ACC.view==='reset'?await SOC.sb.auth.resetPasswordForEmail(ACC.email):await SOC.sb.auth.resend({type:'signup',email:ACC.email});if(r.error)throw r.error;ACC.ok='Código reenviado.';startCool()}
  catch(e){ACC.err=accErr(e)}drawGate()}
async function gateSubmit(){
  if(ACC.busy)return;const v=ACC.view;const val=id=>{const x=$('#'+id);return x?x.value:''};ACC.err='';ACC.ok='';
  const email=(val('gEmail')||ACC.email).trim().toLowerCase();if(val('gEmail'))ACC.email=email;
  const fail=t=>{ACC.err=t;ACC.busy=false;keepDraw()};
  const pass=val('gPass'),pass2=val('gPass2'),code=val('gCode'),nm=val('gName').trim(),terms=!!($('#gTerms')&&$('#gTerms').checked);
  if(v==='login'){if(!email||!pass)return fail('Preencha e-mail e senha.');ACC.busy=true;keepDraw();
    const r=await SOC.sb.auth.signInWithPassword({email,password:pass});ACC.busy=false;
    if(r.error){if(/not confirmed/i.test(r.error.message||'')){await SOC.sb.auth.resend({type:'signup',email});ACC.view='verify';ACC.ok='Mandamos um novo código para confirmar seu e-mail.';startCool();return drawGate()}return fail(accErr(r.error))}return}
  if(v==='signup'){const name=nm;ACC.name=name;const p=pass;
    if(!name)return fail('Digite seu nome.');if(!/^\S+@\S+\.\S+$/.test(email))return fail('Digite um e-mail válido.');if(p.length<8)return fail('A senha precisa ter pelo menos 8 caracteres.');
    if(p!==pass2)return fail('As senhas não são iguais.');if(!terms)return fail('Marque que você leu e aceita como seus dados são guardados.');
    ACC.busy=true;keepDraw();const r=await SOC.sb.auth.signUp({email,password:p,options:{data:{name}}});ACC.busy=false;
    if(r.error)return fail(accErr(r.error));
    if(r.data&&r.data.user&&Array.isArray(r.data.user.identities)&&!r.data.user.identities.length)return fail('Já existe uma conta com esse e-mail. Toque em “Entrar”.');
    if(r.data&&r.data.session){S.profile.name=name;store.mark('profile');return}
    ACC.view='verify';startCool();return drawGate()}
  if(v==='verify'){const t=code;if(t.length<6)return fail('Digite o código que chegou no seu e-mail.');ACC.busy=true;keepDraw();
    const r=await SOC.sb.auth.verifyOtp({email:ACC.email,token:t,type:'signup'});ACC.busy=false;if(r.error)return fail(accErr(r.error));if(ACC.name){S.profile.name=ACC.name;store.mark('profile')}return}
  if(v==='forgot'){if(!/^\S+@\S+\.\S+$/.test(email))return fail('Digite um e-mail válido.');ACC.busy=true;keepDraw();const r=await SOC.sb.auth.resetPasswordForEmail(email);ACC.busy=false;

const TOUR={i:0,steps:null};
function tourDraw(){const s=TOUR.steps[TOUR.i],n=TOUR.steps.length;let el=$('#tour');
  if(!el){el=document.createElement('div');el.id='tour';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el);
    el.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const k=b.dataset.t;
      if(k==='skip')tourEnd(false);else if(k==='back'){TOUR.i=Math.max(0,TOUR.i-1);tourDraw()}else if(TOUR.steps[TOUR.i].last)tourEnd(true);else{TOUR.i++;tourDraw()}})}
  document.body.classList.add('touring');if(s.tab&&S.tab!==s.tab&&VIEWS[s.tab])go(s.tab);
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('spot',t.dataset.tab===s.tab&&TOUR.i>0));
  const ic=typeof TI[s.ic]==='function'?TI[s.ic]():TI[s.ic];
  el.setAttribute('aria-label',s.t);
  el.innerHTML=`<div class="tscrim"></div><div class="tc"><div class="ti">${ic}</div><span class="ts">Passo ${TOUR.i+1} de ${n}</span><h2>${esc(s.t)}</h2>${s.h}
   <div class="tb">${TOUR.i?`<button class="skip" data-t="back">Voltar</button>`:`<button class="skip" data-t="skip">Pular</button>`}<span class="dots">${TOUR.steps.map((_,j)=>`<i class="${j===TOUR.i?'on':''}"></i>`).join('')}</span>
   <button class="btn primary next" data-t="next">${s.last?'Configurar metas':TOUR.i?'Próximo':'Começar'}</button></div></div>`;
  el.querySelector('.next').focus()}
function tourStart(){TOUR.steps=tourSteps();TOUR.i=0;tourDraw()}
function tourEnd(goSetup){const el=$('#tour');if(el)el.remove();document.body.classList.remove('touring');document.querySelectorAll('.tab.spot').forEach(t=>t.classList.remove('spot'));
  S.profile.tourDone=true;store.mark('profile');try{localStorage.setItem('athos.tour','1')}catch(e){}
  if(goSetup){go('perfil');try{ACT.profileSheet()}catch(e){}}else go('hoje')}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#tour'))tourEnd(false)});
window.tourBack=function(){if(!$('#tour'))return false;if(TOUR.i>0){TOUR.i--;tourDraw()}else tourEnd(false);return true};

const TIERS=[[1,'Bronze','#D08B4F'],[5,'Prata','#C9CED6'],[10,'Ouro','#E9B640'],[15,'Platina','#7FD6C8'],[20,'Diamante','#7FB2FF'],[30,'Lenda','#FF7A59']];
const xpFor=L=>50*L*(L-1);
function lvOf(xp){xp=Math.max(0,xp|0);let L=1;while(xpFor(L+1)<=xp)L++;const t=[...TIERS].reverse().find(x=>L>=x[0]);return{L,xp,from:xpFor(L),to:xpFor(L+1),tier:t[1],color:t[2]}}
function lvTag(xp){if(xp==null)return'';const v=lvOf(xp);return`<span class="lvl" style="--lc:${v.color}" title="Nível ${v.L} · ${v.tier}">Nv ${v.L}</span>`}
function lvBadge(v){return`<span class="lvbadge" style="--lc:${v.color}" aria-hidden="true"><b>${v.L}</b></span>`}

/* --- pontos de cada atividade --- */
function sessKind(s){if(s.run)return s.run.type==='walk'?'walk':s.run.type==='bike'?'bike':'run';return s.checkin?'checkin':'workout'}
function sessPoints(s){const k=sessKind(s);
  if(k==='workout')return 50+Math.min(50,10*(s.prs||[]).length);
  if(k==='checkin')return 25;
  const km=(s.run.dist||0)/1000;return Math.min(300,Math.round(20+km*(k==='run'?10:k==='walk'?6:4)))}
function xpRows(){const rows=[];const days=new Set();
  for(const s of Object.values(S.sessions)){if(!s||!s.date)continue;const k=sessKind(s);
    rows.push({ref:'s:'+s.id,day:s.date,kind:k,km:s.run?Math.round((s.run.dist||0)/10)/100:0,points:sessPoints(s)});days.add(s.date)}
  for(const d of Object.keys(S.days)){if(isActive(d))days.add(d)}
  for(const d of days)rows.push({ref:'d:'+d,day:d,kind:'day',km:0,points:10});
  return rows}
function myLocalXp(){return xpRows().reduce((a,r)=>a+r.points,0)}

const XP={sent:null,uid:null,busy:false,medals:null,lastL:null};
function xpKey(){return'athos.xp.'+(SOC.user?SOC.user.id:'')}
function xpLoadSent(){if(XP.uid===SOC.user.id&&XP.sent)return;XP.uid=SOC.user.id;try{XP.sent=new Set(JSON.parse(localStorage.getItem(xpKey())||'[]'))}catch(e){XP.sent=new Set()}}
function xpSaveSent(){try{localStorage.setItem(xpKey(),JSON.stringify([...XP.sent]))}catch(e){}}
async function xpSync(){if(!SOC.user||XP.busy)return;XP.busy=true;
  try{xpLoadSent();const todo=xpRows().filter(r=>!XP.sent.has(r.ref));
    for(let i=0;i<todo.length;i+=100){const part=todo.slice(i,i+100).map(r=>({...r,user_id:SOC.user.id}));
      const {error}=await SOC.sb.from('activity_log').upsert(part,{onConflict:'user_id,ref',ignoreDuplicates:true});if(error)throw error;
      part.forEach(r=>XP.sent.add(r.ref));xpSaveSent()}
    await medalCheck();
    if(todo.length||XP.lastL==null)await xpRefresh();
  }catch(e){}finally{XP.busy=false}}
async function xpRefresh(){try{const r=await SOC.sb.from('profiles').select('xp').eq('id',SOC.user.id).single();if(r.data){SOC.me=Object.assign(SOC.me||{},{xp:r.data.xp});SOC.prof[SOC.user.id]=Object.assign(SOC.prof[SOC.user.id]||{},{xp:r.data.xp});
  const v=lvOf(r.data.xp);let seen=null;try{seen=+localStorage.getItem('athos.lvl.'+SOC.user.id)||null}catch(e){}
  if(seen&&v.L>seen)lvUpSheet(v);try{localStorage.setItem('athos.lvl.'+SOC.user.id,v.L)}catch(e){}XP.lastL=v.L;render()}}catch(e){}}
function lvUpSheet(v){openSheet('Subiu de nível!',`<div class="lvup" style="--lc:${v.color}">${lvBadge(v)}<h2 style="font:800 30px var(--display);text-transform:uppercase;margin:0">Nível ${v.L}</h2><p>Você agora é <b>${v.tier}</b>. Continue treinando para chegar ao nível ${v.L+1}.</p></div><button class="btn primary block" data-close>Bora!</button>`);try{NATIVE&&NATIVE.vibrate&&NATIVE.vibrate()}catch(e){}}

  {id:'km50',t:'50 km no mês',d:'Some 50 km correndo ou caminhando.',m:'km',goal:50,u:'km',i:'🏃'},
  {id:'treinos16',t:'16 treinos no mês',d:'Finalize 16 treinos (check-in também conta).',m:'workouts',goal:16,u:'treinos',i:'🏋️'},
  {id:'dias20',t:'20 dias ativos',d:'Registre treino, corrida ou refeição em 20 dias diferentes.',m:'days',goal:20,u:'dias',i:'🔥'},
  {id:'run10',t:'Uma corrida de 10 km',d:'Complete uma única corrida de 10 km ou mais.',m:'long_run',goal:10,u:'km',i:'🎯'},
  {id:'pedal100',t:'100 km de pedal',d:'Some 100 km pedalando.',m:'bike_km',goal:100,u:'km',i:'🚴'}];
function monthRange(d){d=d||new Date();const y=d.getFullYear(),m=d.getMonth();const z=n=>String(n).padStart(2,'0');
  return{key:`${y}-${z(m+1)}`,from:`${y}-${z(m+1)}-01`,to:`${y}-${z(m+1)}-${z(new Date(y,m+1,0).getDate())}`,name:MESES[m],left:new Date(y,m+1,0).getDate()-d.getDate()}}
function chValue(c,mr){const rows=xpRows().filter(r=>r.day>=mr.from&&r.day<=mr.to);
  switch(c.m){case'km':return rows.filter(r=>r.kind==='run'||r.kind==='walk').reduce((a,r)=>a+r.km,0);
    case'bike_km':return rows.filter(r=>r.kind==='bike').reduce((a,r)=>a+r.km,0);
    case'long_run':return Math.max(0,...rows.filter(r=>r.kind==='run').map(r=>r.km));
    case'workouts':return rows.filter(r=>r.kind==='workout'||r.kind==='checkin').length;
    case'days':return new Set(rows.map(r=>r.day)).size;default:return 0}}
const fmtV=(c,v)=>c.u==='km'?fmtD(Math.floor(v*10)/10):fmtN(Math.floor(v));
const CH={joined:null,loading:false,boards:{}};
async function chLoad(){if(!SOC.user||CH.loading)return;CH.loading=true;
  try{const mr=monthRange();const [j,md]=await Promise.all([sbq(SOC.sb.from('challenge_members').select('key').eq('user_id',SOC.user.id).like('key',mr.key+':%')),sbq(SOC.sb.from('medals').select('*').eq('user_id',SOC.user.id).order('created_at',{ascending:false}))]);
    CH.joined=new Set(j.map(x=>x.key));XP.medals=md;
    await Promise.all(CHS.filter(c=>CH.joined.has(mr.key+':'+c.id)).map(c=>chBoard(c,mr,true)));
  }catch(e){CH.joined=CH.joined||new Set();XP.medals=XP.medals||[]}finally{CH.loading=false;render()}}
async function chBoard(c,mr,quiet){const key=mr.key+':'+c.id;
  try{const b=await sbq(SOC.sb.rpc('challenge_board',{p_key:key,p_metric:c.m,p_from:mr.from,p_to:mr.to}));await loadProfiles(b.map(x=>x.user_id));CH.boards[key]=b;if(!quiet)render();return b}catch(e){return null}}
async function medalCheck(){if(!SOC.user)return;const mr=monthRange();
  if(!XP.medals){try{XP.medals=await sbq(SOC.sb.from('medals').select('*').eq('user_id',SOC.user.id))}catch(e){return}}
  const have=new Set(XP.medals.map(m=>m.key));
  for(const c of CHS){const key=mr.key+':'+c.id;if(have.has(key))continue;if(chValue(c,mr)<c.goal)continue;
    const row={user_id:SOC.user.id,key,title:`${c.t} · ${mr.name}`,icon:c.i};
    try{const {error}=await SOC.sb.from('medals').insert(row);if(!error){XP.medals.unshift({...row,created_at:new Date().toISOString()});
      openSheet('Medalha conquistada!',`<div class="lvup"><span style="font-size:72px;line-height:1">${c.i}</span><h2 style="font:800 26px var(--display);text-transform:uppercase;margin:0">${esc(c.t)}</h2><p>Você completou o desafio de ${mr.name} e ganhou <b>+200 XP</b>.</p></div><button class="btn primary block" data-close>Valeu!</button>`)}}catch(e){}}}

function lvCardHtml(){const xp=SOC.me&&SOC.me.xp!=null?SOC.me.xp:myLocalXp();const v=lvOf(xp);const p=Math.round((xp-v.from)/(v.to-v.from)*100);
  return`<div class="card lvcard" style="--lc:${v.color}"><div class="lvtop">${lvBadge(v)}<div class="t"><small>Seu nível</small><strong>Nível ${v.L} · ${v.tier}</strong><small>${fmtN(xp)} XP no total</small></div></div>
  <div><div class="xpbar"><i style="width:${p}%"></i></div><div class="xpl" style="margin-top:6px"><span>${fmtN(xp-v.from)} / ${fmtN(v.to-v.from)} XP</span><span>faltam ${fmtN(v.to-xp)} para o nível ${v.L+1}</span></div></div>
  <details><summary>Como ganhar XP</summary><ul><li>Treino finalizado: <b>50 XP</b> (+10 por recorde)</li><li>Check-in: <b>25 XP</b></li><li>Corrida: <b>20 XP + 10 por km</b> · caminhada 6/km · pedal 4/km</li><li>Cada dia ativo (treino ou refeição): <b>10 XP</b></li><li>Medalha de desafio: <b>200 XP</b></li></ul></details></div>`}
function chCardHtml(c,mr){const key=mr.key+':'+c.id,v=chValue(c,mr),done=v>=c.goal,joined=CH.joined&&CH.joined.has(key);const p=Math.min(100,v/c.goal*100);
  const b=CH.boards[key];let pos='';if(joined&&b){const i=b.findIndex(x=>x.user_id===SOC.user.id);pos=i>=0?`${i+1}º de ${b.length}`:''}
  return`<div class="card ch${done?' done':''}"><div class="ch-h"><span class="ch-i" aria-hidden="true">${c.i}</span><span class="t"><b>${esc(c.t)}</b><small>${esc(c.d)}</small></span></div>
  <div class="bar"><i style="width:${p}%"></i></div>
  <div class="ch-f"><span class="v">${fmtV(c,v)} / ${fmtN(c.goal)} ${c.u}</span>${done?'<span class="chip ok">Concluído 🏅</span>':''}</div>
  <div class="btns">${joined?`<button class="btn sm" data-act="chRank" data-id="${c.id}">Ranking${pos?' · '+pos:''}</button><button class="btn sm danger" data-act="chLeave" data-id="${c.id}">Sair</button>`:`<button class="btn sm primary" data-act="chJoin" data-id="${c.id}">Participar e disputar</button>`}</div></div>`}
function chHtml(){const mr=monthRange();if(CH.joined===null&&!CH.loading)chLoad();
  let h=lvCardHtml();
  h+=`<h2 style="margin-top:10px">Desafios de ${mr.name}</h2><p class="hint" style="margin-top:-6px">${mr.left?`Faltam ${mr.left} dia${mr.left>1?'s':''}.`:'Último dia!'} Completou, ganhou medalha. Participando, você entra no ranking com quem também entrou.</p>`;
  h+=CHS.map(c=>chCardHtml(c,mr)).join('');
  const md=XP.medals||[];
  h+=`<h2 style="margin-top:10px">Minhas medalhas</h2>${md.length?`<div class="medals">${md.map(m=>`<div class="medal"><span aria-hidden="true">${esc(m.icon||'🏅')}</span><b>${esc(m.title)}</b><small>${esc(dlabel(String(m.created_at).slice(0,10),{day:'numeric',month:'short'}))}</small></div>`).join('')}</div>`:`<div class="empty"><b>Nenhuma medalha ainda</b><span>Complete um desafio do mês para ganhar a primeira.</span></div>`}`;
  return h}
async function chRank(id){const c=CHS.find(x=>x.id===id),mr=monthRange();
  openSheet(c.t,`<div id="rkL">${thinking('Carregando ranking…')}</div>`,async(b)=>{const list=await chBoard(c,mr,true);const box=b.querySelector('#rkL');
    if(!list){box.innerHTML='<p class="hint">Não consegui carregar o ranking. Confira a internet.</p>';return}
    box.innerHTML=list.length?`<p class="hint">${list.length} participante${list.length>1?'s':''} · meta ${fmtN(c.goal)} ${c.u}</p><div>${list.map((x,i)=>{const pr=SOC.prof[x.user_id]||{id:x.user_id};
      return`<div class="rk${i<3?' top':''}${x.user_id===SOC.user.id?' me':''}"><span class="pos">${i<3?['🥇','🥈','🥉'][i]:i+1}</span>${avatar(pr,'sm')}<span class="t"><b>${esc(pr.name||'Atleta')}${lvTag(pr.xp)}</b></span><span class="v">${fmtV(c,+x.value)}</span></div>`}).join('')}</div>`:'<p class="hint">Ninguém participando ainda.</p>'})}
Object.assign(ACT,{
  chJoin:async el=>{const mr=monthRange(),key=mr.key+':'+el.dataset.id;el.disabled=true;
    try{await sbq(SOC.sb.from('challenge_members').insert({user_id:SOC.user.id,key}));CH.joined.add(key);await xpSync();await chBoard(CHS.find(c=>c.id===el.dataset.id),mr,true);toast('Você entrou no desafio!');render()}catch(e){el.disabled=false;toast(sbErr(e))}},
  chLeave:el=>{const mr=monthRange(),key=mr.key+':'+el.dataset.id;confirmSheet('Sair deste desafio? Você sai do ranking, mas ainda pode ganhar a medalha.','Sair',async()=>{try{await sbq(SOC.sb.from('challenge_members').delete().eq('user_id',SOC.user.id).eq('key',key));CH.joined.delete(key);delete CH.boards[key];render()}catch(e){toast(sbErr(e))}})},
  chRank:el=>chRank(el.dataset.id),
  goChallenges:()=>{SOC.sub='desafios';go('social')}});

/* --- recordes nas corridas (melhor 1 km, 5 km e maior distância) --- */
function runPRs(s){if(!s.run)return[];const r=s.run,prev=Object.values(S.sessions).filter(x=>x.run&&x.id!==s.id&&x.run.type===r.type&&(x.ts||0)<(s.ts||Date.now()));const out=[];
  const best=(f,lo)=>{const v=prev.map(x=>x.run[f]).filter(Boolean);return v.length?(lo?Math.min(...v):Math.max(...v)):null};
  if(r.type==='run'){const b1=best('best1k',true);if(r.best1k&&(!b1||r.best1k<b1))out.push('Melhor 1 km');const b5=best('best5k',true);if(r.best5k&&(!b5||r.best5k<b5))out.push('Melhor 5 km')}
  const bd=best('dist');if(prev.length&&r.dist>(bd||0)&&r.dist>=1000)out.push(r.type==='bike'?'Maior pedal':r.type==='walk'?'Maior caminhada':'Maior corrida');
  return out}
{const _stp=sessToPost;sessToPost=function(s){const p=_stp(s);if(s.run){p.stats.prs=runPRs(s)}return p}}
{const _ps=postStats;postStats=function(p){let h=_ps(p);const prs=(p.stats||{}).prs||[];
  if(prs.length&&p.kind==='run')h+=`<div class="chips">${prs.map(x=>`<span class="chip pr">Recorde: ${esc(x)}</span>`).join('')}</div>`;
  return(prs.length?`<div class="prban">🏆 ${prs.length>1?prs.length+' novos recordes':'Novo recorde'}!</div>`:'')+h}}
{const _pc=postCard;postCard=function(p,full){const h=_pc(p,full);const a=SOC.prof[p.user_id];if(!a||a.xp==null)return h;const nm=`<b>${esc(a.name||'Atleta')}</b>`;const i=h.indexOf(nm);return i<0?h:h.slice(0,i)+`<b>${esc(a.name||'Atleta')}${lvTag(a.xp)}</b>`+h.slice(i+nm.length)}}

/* --- aba Desafios na rede social --- */
{const _vs=vSocial;vSocial=function(){let h=_vs();if(!SOC.user)return h;
  h=h.replace(`<button data-act="socSub" data-k="msgs"`,`<button data-act="socSub" data-k="desafios" aria-pressed="${SOC.sub==='desafios'}">Desafios</button><button data-act="socSub" data-k="msgs"`).replace('>Mensagens<','>Chat<');
  if(SOC.sub==='desafios'){const i=h.indexOf('</div>',h.indexOf('soc-seg'))+6;const errI=h.indexOf('<p class="chip warn"',i);const cut=errI>=0?h.indexOf('</p>',errI)+4:i;h=h.slice(0,cut)+chHtml()}
  return h};VIEWS.social=vSocial}

/* --- nível na tela Hoje --- */
{const _vh=VIEWS.hoje;VIEWS.hoje=function(){const h=_vh.apply(this,arguments);if(!SOC.user||!SOC.me||SOC.me.xp==null)return h;const xp=SOC.me.xp,v=lvOf(xp),p=Math.round((xp-v.from)/(v.to-v.from)*100);
  const card=`<button class="card lvmini" data-act="goChallenges" style="--lc:${v.color};text-align:left;width:100%;font:inherit;color:inherit">${lvBadge(v)}<span class="t"><b>Nível ${v.L} · ${v.tier}</b><small>Faltam ${fmtN(v.to-xp)} XP para o nível ${v.L+1} · ver desafios</small><span class="xpbar" style="display:block"><i style="width:${p}%"></i></span></span></button>`;
  const k='<div class="card khero">';const i=h.indexOf(k);if(i<0)return h+card;const j=h.indexOf('<div class="card"',i+k.length);return j<0?h+card:h.slice(0,j)+card+h.slice(j)}}

/* sincroniza XP ao entrar e de tempos em tempos */
let xpUid=null;setInterval(()=>{const id=SOC.user?SOC.user.id:null;if(id!==xpUid){xpUid=id;CH.joined=null;CH.boards={};XP.medals=null;XP.lastL=null;XP.sent=null;if(id)setTimeout(xpSync,4000)}else if(id)xpSync()},30000);
setInterval(()=>{const id=SOC.user?SOC.user.id:null;if(id&&id!==xpUid){xpUid=id;CH.joined=null;XP.sent=null;XP.lastL=null;setTimeout(xpSync,4000)}},2000);
window.androidBack=function(){if(window.updBlocking&&window.updBlocking())return true;if(window.tourBack&&window.tourBack())return true;if($('#authGate')&&!$('#authGate').hidden){if(/signup|forgot|reset|verify/.test(ACC.view)){setView('login');return true}return false}if(sheets.length){closeSheet();return true}if($('#run')&&!$('#run').hidden){ACT.runMin();return true}if($('#authGate')&&!$('#authGate').hidden){if(/signup|forgot|reset|verify/.test(ACC.view)){setView('login');return true}return false}if(sheets.length){closeSheet();return true}if(!$('#session').hidden){closeActive();return true}if(S.tab!=='hoje'){go('hoje');return true}return false};
window.androidSaved=function(ok){toast(ok?'Backup salvo':'Backup não foi salvo')};
/* ---------- início ---------- */
loadLocal();
{const h=location.hash.slice(1);if(VIEWS[h])S.tab=h}
render();
if(S.active)$('#activebar').hidden=false;
(async()=>{
  const C=window.claude;if(!C||!C.use)return;
  initDb().then(()=>schedule());
  try{SAMPLE=await C.use('sample');if(SAMPLE){const lim=await SAMPLE.limits().catch(()=>null);SAMPLE_IMG=!!(lim&&lim.images);MAXIMG=lim&&lim.images?Math.max(1,Math.min(8,lim.images.maxCount||1)):1}}catch(e){SAMPLE=null}
  try{DOWNLOADS=await C.use('downloads')}catch(e){DOWNLOADS=null}
  schedule();
})();
})();
</script>
