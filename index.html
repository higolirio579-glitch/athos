<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ATHOS"><meta name="theme-color" content="#EEEFF1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><script>window.WEBAPP=true</script></head><body>
<title>ATHOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app de uma tela — cabeçalho fixo, conteúdo rolável, barra de abas embaixo. Macros usam as cores das anilhas olímpicas (vermelho 25 kg, amarelo 15 kg, verde 10 kg, azul 20 kg). */
:root{
  --bg:#EEEFF1; --surface:#FFFFFF; --surface2:#E7E8EB; --line:#DDDFE3; --cardline:transparent;
  --fg:#111214; --muted:#636975;
  --accent:#DDA623; --accent-ink:#000000; --accent-soft:#F7EDD2; --accent-tx:#8A6100;
  --water:#2F7FE0; --ink:#000000; --ink2:#1E1F23;
  --red:#C9372C; --yellow:#C08A00; --green:#1B8A50; --warn:#B0560B;
  --done:#E3F3EA; --scrim:rgb(0 0 0 / .5);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#121315; --surface2:#1D1F23; --line:#26282D; --cardline:#1F2125;
  --fg:#F2F2F0; --muted:#9298A3;
  --accent:#E9B640; --accent-ink:#000000; --accent-soft:#2B2310; --accent-tx:#F0C45E;
  --water:#5AA2FF; --ink:#141416; --ink2:#232428;
  --red:#FF6656; --yellow:#F0BC2E; --green:#40C983; --warn:#F09A4A;
  --done:#12261B; --scrim:rgb(0 0 0 / .66);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#121315; --surface2:#1D1F23; --line:#26282D; --cardline:#1F2125;
  --fg:#F2F2F0; --muted:#9298A3;
  --accent:#E9B640; --accent-ink:#000000; --accent-soft:#2B2310; --accent-tx:#F0C45E;
  --water:#5AA2FF; --ink:#141416; --ink2:#232428;
  --red:#FF6656; --yellow:#F0BC2E; --green:#40C983; --warn:#F09A4A;
  --done:#12261B; --scrim:rgb(0 0 0 / .66);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:580px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:.08em;text-transform:uppercase}
.mark{display:flex;align-items:center;gap:2px}
.mark i{display:block;width:6px;border-radius:2px}
.mark i:nth-child(1){height:22px;background:var(--red)}
.mark i:nth-child(2){height:18px;background:var(--accent)}
.mark i:nth-child(3){height:14px;background:var(--yellow)}
.mark i:nth-child(4){height:3px;width:12px;background:var(--muted);border-radius:1px}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on b{background:var(--green)}

main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px;padding-block:4px 20px}

/* Tipografia */
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance;letter-spacing:.01em}
h1{font-size:32px;font-weight:700}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:60px;line-height:.86}
.mid{font-size:30px;line-height:.95}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{font-size:13.5px;color:var(--muted)}

/* Blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .num{font-size:26px;line-height:1}
.stat small{color:var(--muted);font-size:12.5px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0;padding-top:2px}
.li .t{min-width:0;display:flex;flex-direction:column}
.li .t b{font-weight:600;overflow-wrap:anywhere}
.li .t small{color:var(--muted);font-size:13px}
button.li{background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;font:inherit;color:inherit}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Botões */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14.5px var(--body);padding:9px 14px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-style:dashed}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13.5px;border-radius:9px}
.btn.danger{background:transparent;color:var(--red);border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.icon-btn{border:0;background:var(--surface2);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-size:16px;flex:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;border:1px solid transparent}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.ok{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.chip.pr{background:color-mix(in srgb,var(--yellow) 18%,transparent);color:var(--yellow)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font:600 13.5px var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .1)}

/* Formulários */
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;color:var(--muted);font-weight:600}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:20px;height:20px;flex:none}

/* Macros / anilhas */
.plate{width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--surface) 0 3px,var(--c,var(--muted)) 3.5px)}
.macro{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.macro .lbl{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.macro .lbl b{font-weight:600}
.macro .lbl span{color:var(--muted);font-variant-numeric:tabular-nums}
.macro .bar{grid-column:2}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit;transition:width .4s ease}
.bar.over i{background:var(--warn)}
.kbar{height:14px}
.p{--c:var(--red)} .c{--c:var(--yellow)} .f{--c:var(--green)} .w{--c:var(--water)}
.cups{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:5px}
.cups i{height:26px;border-radius:5px 5px 7px 7px;background:var(--surface2)}
.cups i.on{background:var(--water)}

/* Treinos */
.tpl{display:flex;flex-direction:column;gap:10px}
.tpl .meta{color:var(--muted);font-size:13.5px}

/* Sessão ativa */
#session{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.s-h{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.s-h .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.s-h .ttl{flex:1;min-width:0}
.s-h h2{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.s-body{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.ex{padding:14px 12px}
.ex-h{display:flex;gap:8px;align-items:flex-start}
.ex-h .t{flex:1;min-width:0}
.ex-h h3{font-size:19px}
.sets{display:flex;flex-direction:column;gap:5px}
.set,.set-h{display:grid;grid-template-columns:22px minmax(0,1fr) 62px 54px 54px 40px;gap:6px;align-items:center}
.set-h{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.set-h span:nth-child(n+3){text-align:center}
.set{padding:3px;border-radius:10px;transition:background .2s}
.set .sn{font-family:var(--display);font-weight:700;text-align:center;color:var(--muted)}
.set .prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input,.set select{padding:7px 4px;text-align:center;font-variant-numeric:tabular-nums;border-radius:8px}
.set select{appearance:none;font-size:14px}
.rir.r0{color:var(--red);font-weight:700}.rir.r1,.rir.r2{color:var(--yellow);font-weight:700}.rir.r3,.rir.r4,.rir.r5{color:var(--green);font-weight:700}
.ck{height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;color:var(--muted)}
.set.done{background:var(--done)}
.set.done .ck{background:var(--green);border-color:var(--green);color:#fff}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--fg);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.restbar .in{max-width:580px;margin:0 auto;display:flex;align-items:center;gap:10px}
.restbar .tt{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
.restbar .lb{flex:1;min-width:0;font-size:13px;opacity:.8}
.restbar .track{height:4px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:9px;margin-top:6px;overflow:hidden}
.restbar .track i{display:block;height:100%;background:var(--bg)}
.restbar button{background:color-mix(in srgb,var(--bg) 14%,transparent);border:0;color:var(--bg);border-radius:9px;height:38px;padding:0 10px;font-weight:700}
.restbar.end{background:var(--green)}

.activebar{position:fixed;z-index:19;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:556px;margin:0 auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;box-shadow:0 6px 20px rgb(0 0 0 / .18)}
.activebar .num{font-size:20px}

/* Barra de abas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;border:0;background:none;color:var(--muted);font:600 11.5px var(--body)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* Sheets */
#sheets .wrapS{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;display:flex;flex-direction:column;width:100%;max-width:620px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet-b{overflow:auto;padding:2px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.result{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.result small{color:var(--muted)}
.picked{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:500}
.thinking i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-item{display:grid;grid-template-columns:auto 1fr 74px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ai-item small{color:var(--muted);display:block}
.tex{display:grid;grid-template-columns:minmax(0,1fr) 58px 66px auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.tex b{font-weight:600;display:block;overflow-wrap:anywhere}
.tex small{color:var(--muted)}
.tex input{padding:6px;text-align:center}
.tex .act{display:flex;gap:4px}
.tex .act button{width:30px;height:30px;border:0;border-radius:8px;background:var(--surface2)}
.mini-l{font-size:10.5px;color:var(--muted);text-align:center;display:block;margin-top:2px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}

/* Gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:500 10px var(--body);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .end{font-weight:700;fill:var(--fg);font-size:11px}
.heat{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.scroll-x{overflow-x:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 18px rgb(0 0 0 / .2)}

.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .icon-btn{position:absolute;top:6px;right:6px;width:30px;height:30px;font-size:13px;background:var(--surface)}
.thumb .pg{position:absolute;left:6px;bottom:6px;background:var(--surface);border-radius:7px;padding:1px 7px;font-weight:700;font-size:12px}
button.thumb.add{border:1.5px dashed var(--line);background:transparent;color:var(--accent-tx);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
button.thumb.add span{font-size:30px;line-height:1}
.route{height:220px;border-radius:12px;overflow:hidden;background:var(--surface2);position:relative}
.route>svg{width:100%;height:100%;display:block}
.splits{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.splits th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 6px 6px 0}
.splits td{padding:6px 6px 6px 0;border-top:1px solid var(--line);white-space:nowrap}
.splits td.bar{width:45%}
.splits .bar i{display:block;height:8px;border-radius:9px;background:var(--accent)}
.splits tr.best td{font-weight:700}
@media (max-width:370px){.big{font-size:50px}.set,.set-h{grid-template-columns:18px minmax(0,1fr) 54px 48px 48px 36px;gap:4px}}
/* ===== ATHOS 2.0 — identidade do ícone: preto, dourado e branco ===== */
body{font-size:15.5px}
.top{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top .wrap{padding-block:12px 10px}
.brand{font-size:22px;letter-spacing:.24em;gap:11px}
.brand img{border-radius:11px}
.sync{font-size:12px}
h1{font-size:40px;font-weight:800;text-transform:uppercase;letter-spacing:.015em;line-height:.95}
.view>h2,.view>div>h2{font-size:25px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin-top:10px!important}
h3{font-size:20px;font-weight:700}
.eyebrow{font:600 13.5px var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.view{gap:12px;padding-block:6px 24px}
.card{border:1px solid var(--cardline);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.empty{border-radius:20px;border-color:color-mix(in srgb,var(--muted) 35%,transparent);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.btn{border-radius:13px;background:var(--surface2);border-color:transparent;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent-tx)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent}
.btn.sm{border-radius:10px}
.chip{background:var(--surface2)}
button.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg{border-radius:13px}
.seg button[aria-pressed="true"]{border-radius:10px}
input,select,textarea{border-radius:12px;background:var(--surface)}
.card input,.card select,.card textarea{background:var(--bg)}
:focus-visible{outline-color:var(--accent-tx)}
.li{padding:12px 0}
.icon-btn{background:var(--surface2)}
.sheet{border-radius:26px 26px 0 0}
.sheet-h h2{font-size:24px}
.stat .num{font-size:28px}

/* Cartão principal (calorias) */
.khero{background:var(--ink);color:#fff;border-color:transparent;padding:20px 18px 18px;gap:16px;box-shadow:0 14px 30px -18px rgb(0 0 0 / .6);
  --muted:#A3A8B2;--surface2:#2A2B30;--line:#2A2B30}
:root:not([data-theme="light"]) .khero{border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hero-top b{font:700 15px var(--body)}
.hero-main{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .trk{stroke:#2A2B30}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .6s ease}
.ring.over .val{stroke:var(--warn)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c .num{font-size:34px;line-height:.9}
.ring-c small{color:var(--muted);font-size:12.5px;font-weight:600}
.hero-side{display:flex;flex-direction:column;gap:12px}
.hero-side .stat .num{font-size:26px}
.hero-side .stat small{font-size:12.5px}
.mac3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:14px;border-top:1px solid #2A2B30}
.m3{display:flex;flex-direction:column;gap:6px;min-width:0}
.m3 .lb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.m3 .plate{width:12px;height:12px;background:radial-gradient(circle,var(--ink) 0 2px,var(--c) 2.5px)}
.m3 .v{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.m3 .v b{font:700 20px var(--display);color:#fff}
.m3 .bar{height:6px}

/* Sequência no cabeçalho do dia */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:6px}
.streakb{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--cardline);border-radius:16px;padding:8px 12px 8px 10px;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.streakb svg{width:22px;height:22px;fill:var(--accent)}
.streakb .num{font-size:24px;line-height:1}
.streakb small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;line-height:1.1}
.streakb.off svg{fill:var(--line)}
.cups~.btns .btn.soft{background:color-mix(in srgb,var(--water) 14%,transparent);color:var(--water)}

/* Barra de abas flutuante */
.tabbar{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;
  background:var(--ink);border:1px solid var(--ink2);border-radius:22px;padding:4px 6px;box-shadow:0 12px 32px -10px rgb(0 0 0 / .45)}
.tabbar nav{gap:0}
.tab{position:relative;color:#8B9099;padding:9px 0 8px;font-size:11px;gap:3px;transition:color .2s}
.tab svg{width:22px;height:22px;transition:transform .2s}
.tab::after{content:"";position:absolute;bottom:2px;left:50%;width:0;height:3px;border-radius:3px;background:var(--accent);transform:translateX(-50%);transition:width .2s}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{transform:translateY(-1px)}
.tab[aria-current="page"]::after{width:18px}
.tabbar{display:flex;align-items:stretch;gap:2px}
.tabbar nav{flex:1;min-width:0}
.tbmenu{flex:none;width:44px;border:0;background:none;color:#8B9099;display:grid;place-items:center;border-radius:16px;margin-right:2px}
.tbmenu svg,.tbfab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.tbmenu:active{background:var(--ink2)}
.tbfab{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;
  border:1px solid var(--ink2);background:var(--ink);color:var(--accent);display:grid;place-items:center;box-shadow:0 12px 28px -8px rgb(0 0 0 / .5);
  transform:scale(.4);opacity:0;pointer-events:none}
.tabbar,.tbfab,.activebar{transition:transform .3s cubic-bezier(.3,.7,.2,1),opacity .25s}
body.tb-min .tabbar{transform:translateY(calc(100% + 24px));opacity:0;pointer-events:none}
body.tb-min .tbfab{transform:none;opacity:1;pointer-events:auto}
body.tb-min .activebar{transform:translateY(68px);right:calc(84px + env(safe-area-inset-right,0px))}
.activebar{bottom:calc(88px + env(safe-area-inset-bottom,0px));border-radius:16px;background:var(--fg);color:var(--bg)}
main{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
@media (max-width:370px){h1{font-size:34px}.hero-main{grid-template-columns:116px 1fr;gap:14px}.ring{width:116px;height:116px}.ring-c .num{font-size:29px}}
.demo{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#fff}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .4s ease}
.demo img.b{opacity:0}.demo.alt img.b{opacity:1}
.demo-l{position:absolute;left:10px;bottom:10px;background:rgb(0 0 0 / .72);color:#fff;font:700 12px var(--body);padding:4px 9px;border-radius:8px}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.demo-b{border:0;background:var(--accent-soft);color:var(--accent-tx);font:700 12.5px var(--body);padding:4px 9px;border-radius:8px;margin-top:4px;align-self:flex-start;display:inline-flex;align-items:center;gap:4px}
.demo-b svg{width:11px;height:11px;fill:currentColor}
.ex-h .demo-i{background:var(--accent-soft);color:var(--accent-tx)}
.ex-h .demo-i svg{width:15px;height:15px;fill:currentColor}
@media (prefers-reduced-motion:reduce){.demo img{transition:none}}
.go{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.go button{border:1px solid var(--cardline);background:var(--surface);border-radius:20px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--fg);font:700 14px var(--body);box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.go .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-tx)}
.go .ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.go button.main{grid-column:span 2;flex-direction:row;justify-content:flex-start;padding:14px 16px;gap:14px;background:var(--accent);border-color:var(--accent);color:#000;font-size:16.5px;text-align:left}
.go button.main .ic{background:rgb(0 0 0 / .12);color:#000}
.go button.main small{display:block;font:600 12.5px var(--body);opacity:.7}
.wk{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.wk b{color:var(--fg)}.wk button{border:0;background:none;color:var(--accent-tx);font:700 13.5px var(--body);padding:4px 0;flex:none}
.sec{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.view .sec h2{margin:0!important}
.card.tplc{flex-direction:row;align-items:center;gap:12px;padding:12px 12px 12px 16px}
.tplc .tx{flex:1;min-width:0;border:0;background:none;text-align:left;color:inherit;padding:4px 0;font:inherit}
.tplc .tx b{display:block;font:700 18px/1.15 var(--display);overflow-wrap:anywhere}.tplc .tx small{color:var(--muted);font-size:13px}
.cmenu{display:flex;flex-direction:column;gap:4px}
.cmenu button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--surface);color:var(--fg);padding:12px;border-radius:16px;font:600 15.5px var(--body);text-align:left}
.cmenu button:disabled{opacity:.55}
.cmenu .e{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:19px;flex:none}
.cmenu small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
@media (max-width:360px){.go button{font-size:13px}.go .ic{width:42px;height:42px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- estado ---------- */

function emptyDay(date){return{kind:'day',date,meals:{cafe:[],almoco:[],lanche:[],jantar:[],ceia:[]},water:0,weight:null}}

/* ---------- armazenamento ---------- */
const LKEY='ficha.v1',AKEY='ficha.active';
const NATIVE=window.Android||null;
function lsGet(k){try{return JSON.parse((NATIVE?NATIVE.getItem(k):localStorage.getItem(k))||'null')}catch(e){return null}}
function lsSet(k,v){try{const s=JSON.stringify(v);if(NATIVE)NATIVE.setItem(k,s);else localStorage.setItem(k,s)}catch(e){}}
let lsTimer=null;
function flushLocal(){clearTimeout(lsTimer);lsTimer=null;lsSet(LKEY,{profile:S.profile,days:S.days,sessions:S.sessions})}
function saveLocal(){clearTimeout(lsTimer);lsTimer=setTimeout(flushLocal,300)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(lsTimer)flushLocal();saveActive()}});
function loadLocal(){const d=lsGet(LKEY);if(d){S.profile={...clone(DEF_PROFILE),...(d.profile||{})};S.days=d.days||{};S.sessions=d.sessions||{}}S.active=lsGet(AKEY)}
function saveActive(){lsSet(AKEY,S.active)}

const store={
  mode:'local',col:null,dirty:new Set(),timers:{},queued:new Set(),chain:Promise.resolve(),
  dataFor(key){
    if(key==='profile')return{kind:'profile',ts:0,...S.profile};
    if(key.startsWith('d-')){const d=S.days[key.slice(2)];return d?{...d,kind:'day',ts:tOf(d.date)}:null}
    const s=S.sessions[key];return s?{...s,kind:'session'}:null;
  },
  mark(key,delay=700){
    this.dirty.add(key);saveLocal();
    if(this.mode!=='db'){this.dirty.delete(key);return}
    clearTimeout(this.timers[key]);
    this.timers[key]=setTimeout(()=>{delete this.timers[key];this.enqueue(key)},delay);
  },
  enqueue(key){
    if(this.queued.has(key))return;this.queued.add(key);
    this.chain=this.chain.then(()=>this.write(key)).catch(()=>{});
  },
  async write(key,retry){
    this.queued.delete(key);
    const data=this.dataFor(key);
    try{
      if(data===null)await this.col.doc(key).delete();else await this.col.doc(key).set(JSON.parse(JSON.stringify(data)));
    }catch(e){
      const c=e&&e.code;
      if(c==='quota_exceeded')toast('Espaço de armazenamento cheio. Exporte um backup e apague registros antigos.');
      else if(c==='unavailable'&&!retry){await new Promise(r=>setTimeout(r,1500+Math.random()*1000));return this.write(key,true)}
      else if(c==='revoked'){this.mode='local';drawSync()}
      else toast('Não consegui salvar na conta. Os dados continuam neste aparelho.');
    }
    if(!this.queued.has(key)&&!this.timers[key])this.dirty.delete(key);
  }
};

async function initDb(){
  const C=window.claude;if(!C||!C.use)return;
  let db=null,user=null,uid=null;
  try{[db,user]=await Promise.all([C.use('db'),C.use('user')]);uid=user?await user.id():null}catch(e){}
  if(!db||!uid)return;
  const col=db.collection('data/users/'+uid);
  store.col=col;
  let prof;
  try{prof=await col.doc('profile').get()}catch(e){return}
  store.mode='db';drawSync();
  if(!prof.exists){
    const hasLocal=Object.keys(S.days).length||Object.keys(S.sessions).length||S.profile.templates.length||S.profile.age;
    if(hasLocal){store.mark('profile',0);for(const d in S.days)store.mark('d-'+d,0);for(const s in S.sessions)store.mark(s,0)}
  }
  col.doc('profile').onSnapshot(snap=>{
    if(!snap.exists||store.dirty.has('profile'))return;
    if(stable(snap.data())===stable(store.dataFor('profile')))return;
    const d=clone(snap.data());delete d.kind;delete d.ts;
    S.profile={...clone(DEF_PROFILE),...d};saveLocal();schedule();
  },()=>{});
  let first=true;
  col.where('kind','in',['day','session']).orderBy('ts','desc').limit(1000).onSnapshot(snap=>{
    if(first){
      first=false;
      const days={},sess={};
      for(const doc of snap.docs){const d=clone(doc.data());if(d.kind==='day')days[d.date]=d;else if(d.kind==='session')sess[doc.id]=d}
      for(const k of store.dirty){if(k.startsWith('d-')&&S.days[k.slice(2)])days[k.slice(2)]=S.days[k.slice(2)];else if(S.sessions[k])sess[k]=S.sessions[k]}
      S.days=days;S.sessions=sess;
    }else{
      let changed=false;
      for(const ch of snap.docChanges()){
        const id=ch.doc.id;if(store.dirty.has(id))continue;
        if(ch.type==='removed'){const had=id.startsWith('d-')?S.days[id.slice(2)]:S.sessions[id];if(had){changed=true;if(id.startsWith('d-'))delete S.days[id.slice(2)];else delete S.sessions[id]}continue}
        if(stable(ch.doc.data())===stable(store.dataFor(id)))continue;
        const d=clone(ch.doc.data()||{});changed=true;
        if(d.kind==='day')S.days[d.date]=d;else if(d.kind==='session')S.sessions[id]=d;
      }
      if(!changed)return;
    }
    saveLocal();schedule();
  },()=>{});
}
function drawSync(){const el=$('#sync');el.classList.toggle('on',store.mode==='db');el.querySelector('span').textContent=store.mode==='db'?'Salvo na conta':'Neste aparelho'}

/* ---------- cálculos ---------- */
function weightsList(){return Object.values(S.days).filter(d=>d.weight).sort((a,b)=>a.date<b.date?-1:1).map(d=>({date:d.date,kg:d.weight}))}
function curWeight(){const w=weightsList();return w.length?w[w.length-1].kg:S.profile.weight}
function calcGoals(p,w){
  if(!(p.age&&p.height&&w))return null;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='f'?-161:5);
  const tdee=bmr*p.activity;const kcal=Math.round((tdee+GOALS[p.goal][1])/10)*10;
  const prot=Math.round(w*(p.goal==='perder'?2.2:2.0)),fat=Math.round(w*0.9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return{kcal,p:prot,c:carb,f:fat,water:Math.round(w*35/50)*50,bmr:Math.round(bmr),tdee:Math.round(tdee)};
}
function goals(){const p=S.profile;if(p.auto){const g=calcGoals(p,curWeight());if(g)return g}return{kcal:p.kcal,p:p.p,c:p.c,f:p.f,water:p.water}}
function dayTotals(date){const d=S.days[date];const t={kcal:0,p:0,c:0,f:0,n:0};if(!d)return t;for(const[k]of MEALS)for(const it of(d.meals&&d.meals[k])||[]){t.kcal+=num(it.kcal);t.p+=num(it.p);t.c+=num(it.c);t.f+=num(it.f);t.n++}return t}
function mealTotals(items){return items.reduce((a,it)=>({kcal:a.kcal+num(it.kcal),p:a.p+num(it.p),c:a.c+num(it.c),f:a.f+num(it.f)}),{kcal:0,p:0,c:0,f:0})}
const sessList=()=>Object.values(S.sessions).sort((a,b)=>b.ts-a.ts);
const sessionsOn=d=>sessList().filter(s=>s.date===d);
function sessStats(s){let vol=0,sets=0;const g=new Set();for(const x of s.exercises||[]){if(x.group)g.add(x.group);for(const st of x.sets){sets++;if(x.type==='w')vol+=num(st.kg)*num(st.reps)}}return{vol,sets,groups:[...g],dur:(s.end||s.ts)-s.ts}}
function lastFor(name,excl){for(const s of sessList()){if(s.id===excl)continue;const x=(s.exercises||[]).find(e=>e.name===name);if(x&&x.sets.length)return{date:s.date,sets:x.sets}}return null}
function bestKg(name,excl){let b=0;for(const s of Object.values(S.sessions)){if(s.id===excl)continue;for(const x of s.exercises||[])if(x.name===name&&x.type!=='t')for(const st of x.sets)if(num(st.reps)>0)b=Math.max(b,num(st.kg))}return b}
function isActive(d){const day=S.days[d];if(day&&day.meals&&MEALS.some(([k])=>(day.meals[k]||[]).length))return true;return Object.values(S.sessions).some(s=>s.date===d)}
function streak(){const t=today();const on=isActive(t);let d=on?t:addDays(t,-1),n=0;while(isActive(d)){n++;d=addDays(d,-1)}return{n,on}}
function allExercises(){return[...EX,...(S.profile.customEx||[])]}
function matchEx(name){const n=norm(name);const all=allExercises();let m=all.find(e=>norm(e.name)===n);if(m)return m;m=all.find(e=>norm(e.name).startsWith(n)||n.startsWith(norm(e.name)));if(m)return m;m=all.find(e=>n.includes(norm(e.name).split(' (')[0]));return m||{name:String(name).trim(),group:'Outros',type:'w'}}
function setTxt(type,s){return type==='t'?`${fmtD(num(s.kg))} min${num(s.reps)?' · '+fmtD(num(s.reps))+' km':''}`:`${fmtD(num(s.kg))} kg × ${num(s.reps)}`}

/* ---------- gráficos ---------- */
function niceTicks(min,max,n=4){if(max===min){max+=1;min-=1}const raw=(max-min)/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||mag*10;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(Math.round(v*1000)/1000);return{lo,hi,t}}
function lineChart(pts,{color='var(--accent)',unit='',goal=null,h=180}={}){
  if(pts.length<2)return`<p class="hint">Registre pelo menos 2 vezes para ver o gráfico.</p>`;
  const W=340,H=h,L=40,R=46,T=12,B=24;
  const t0=pts[0].t,t1=Math.max(pts[pts.length-1].t,t0+864e5);
  const vals=pts.map(p=>p.v).concat(goal!=null?[goal]:[]);
  let mn=Math.min(...vals),mx=Math.max(...vals);const pad=(mx-mn)*.12||1;
  const{lo,hi,t}=niceTicks(mn-pad,mx+pad);
  const x=v=>L+(v-t0)/(t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const id='g'+Math.random().toString(36).slice(2,7);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  for(const v of t){s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmtD(v)}</text>`}
  const xl=[pts[0].t,pts[pts.length-1].t];if(pts.length>4)xl.splice(1,0,pts[Math.floor(pts.length/2)].t);
  xl.forEach((v,i)=>{const a=i===0?'start':i===xl.length-1?'end':'middle';s+=`<text x="${x(v)}" y="${H-6}" text-anchor="${a}">${new Date(v).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>`});
  if(goal!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-R+4}" y="${y(goal)+3.5}" fill="var(--green)" style="fill:var(--green)">meta</text>`;
  const line=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  s+=`<path d="${line} L${x(pts[pts.length-1].t).toFixed(1)} ${y(lo)} L${x(pts[0].t).toFixed(1)} ${y(lo)} Z" fill="url(#${id})"/>`;
  s+=`<path d="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  const e=pts[pts.length-1];s+=`<circle cx="${x(e.t)}" cy="${y(e.v)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/><text class="end" x="${x(e.t)+8}" y="${y(e.v)+4}">${fmtD(e.v)}${unit}</text>`;
  return s+'</svg>';
}
function barChart(items,{goal=null,color='var(--accent)',h=150}={}){
  const W=340,H=h,L=34,R=8,T=10,B=22;const mx=Math.max(goal||0,...items.map(i=>i.v),1);
  const{hi,t}=niceTicks(0,mx*1.05,3);const y=v=>T+(hi-v)/hi*(H-T-B);
  const bw=(W-L-R)/items.length;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(const v of t)s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-5}" y="${y(v)+3.5}" text-anchor="end">${v>=1000?r1(v/1000)+'k':v}</text>`;
  items.forEach((it,i)=>{const bx=L+i*bw+bw*.18,w=bw*.64;if(it.v>0){const over=goal&&it.v>goal*1.1;s+=`<rect x="${bx}" y="${y(it.v)}" width="${w}" height="${Math.max(1,y(0)-y(it.v))}" rx="3" fill="${over?'var(--warn)':color}"/>`}if(i%2===items.length%2||items.length<8)s+=`<text x="${bx+w/2}" y="${H-7}" text-anchor="middle">${it.l}</text>`});
  if(goal)s+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  return s+'</svg>';
}
function heatmap(weeks=17){
  const t=today();const d0=new Date(t+'T12:00:00');const dow=(d0.getDay()+6)%7;const start=addDays(t,-dow-(weeks-1)*7);
  const sz=15,g=3,L=18,W=L+weeks*(sz+g),H=7*(sz+g)+16;let s=`<svg class="heat" viewBox="0 0 ${W} ${H}" role="img" aria-label="Atividade das últimas ${weeks} semanas">`;
  ['S','T','Q','Q','S','S','D'].forEach((l,i)=>{if(i%2===0)s+=`<text x="0" y="${16+i*(sz+g)+sz-4}" style="fill:var(--muted);font:600 9px var(--body)">${l}</text>`});
  const tr=new Set(Object.values(S.sessions).map(x=>x.date));let lastM=-1;
  for(let w=0;w<weeks;w++){for(let i=0;i<7;i++){const d=addDays(start,w*7+i);if(d>t)continue;const day=S.days[d];const diet=day&&day.meals&&MEALS.some(([k])=>(day.meals[k]||[]).length);
    const fill=tr.has(d)?'var(--accent)':diet?'color-mix(in srgb,var(--accent) 32%,var(--surface2))':'var(--surface2)';
    s+=`<rect x="${L+w*(sz+g)}" y="${16+i*(sz+g)}" width="${sz}" height="${sz}" rx="3" fill="${fill}"${d===t?' stroke="var(--fg)" stroke-width="1.5"':''}><title>${dlabel(d)}</title></rect>`;
    if(i===0){const m=new Date(d+'T12:00:00').getMonth();if(m!==lastM){lastM=m;s+=`<text x="${L+w*(sz+g)}" y="10" style="fill:var(--muted);font:600 9.5px var(--body)">${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</text>`}}}}
  return s+'</svg>';
}


/* ---------- atividades com GPS (exibição) ---------- */
const RUN_T={run:'Corrida',walk:'Caminhada',bike:'Pedal'};
function fmtPace(sec){if(!isFinite(sec)||sec<=0||sec>5400)return'—';let m=Math.floor(sec/60),s=Math.round(sec%60);if(s===60){m++;s=0}return`${m}'${z(s)}"`}
const km2=m=>(m/1000).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function speedOrPace(r){return r.type==='bike'?`${fmtD(r.moving?r.dist/r.moving*3.6:0)} km/h`:`${fmtPace(r.dist?r.moving/(r.dist/1000):0)}/km`}
function sessSub(s,withDur){
  if(s.run){const r=s.run;return`${km2(r.dist)} km · ${speedOrPace(r)}${withDur?' · '+fmtDur(r.moving*1000).replace(/^00:/,''):''}${r.steps?' · '+fmtN(r.steps)+' passos':''}`}
  const x=sessStats(s);return(s.checkin?'Check-in':`${x.sets} séries · ${fmtN(x.vol)} kg`)+(withDur?' · '+fmtDur(x.dur).replace(/^00:/,''):'');
}
function routeSvg(pts){
  if(!pts||pts.length<2)return'<p class="hint" style="padding:16px">Sem percurso de GPS registrado.</p>';
  const W=340,H=220,P=16,lat0=pts[0][0]*Math.PI/180,k=Math.cos(lat0);
  const xs=pts.map(p=>p[1]*k),ys=pts.map(p=>-p[0]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sc=Math.min((W-2*P)/((x1-x0)||1e-9),(H-2*P)/((y1-y0)||1e-9));const ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
  const X=i=>(ox+(xs[i]-x0)*sc).toFixed(1),Y=i=>(oy+(ys[i]-y0)*sc).toFixed(1);const n=pts.length-1;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Percurso"><polyline points="${pts.map((_,i)=>X(i)+','+Y(i)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(0)}" cy="${Y(0)}" r="6" fill="var(--green)" stroke="var(--surface)" stroke-width="2"/><circle cx="${X(n)}" cy="${Y(n)}" r="6" fill="var(--red)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
function splitRows(r){
  const out=[];let pt=0,ps=0;for(const sp of r.splits||[]){out.push({lbl:String(sp[0]),km:1,t:sp[1]-pt,st:sp[2]-ps});pt=sp[1];ps=sp[2]}
  const rest=r.dist-(r.splits||[]).length*1000;if(rest>=50)out.push({lbl:km2(rest),km:rest/1000,t:r.moving-pt,st:(r.stepsEst?0:r.steps-ps)});return out;
}
function splitsHtml(r){
  const rows=splitRows(r);if(!rows.length)return'';const bike=r.type==='bike';
  const val=x=>bike?x.km/(x.t/3600||1):x.t/x.km;const vals=rows.map(val);const best=bike?Math.max(...vals):Math.min(...vals);const worst=bike?Math.min(...vals):Math.max(...vals);
  return`<div class="card" style="gap:8px"><h3>Parciais por km</h3><div class="scroll-x"><table class="splits"><thead><tr><th>Km</th><th>${bike?'Veloc.':'Ritmo'}</th><th></th>${r.stepsEst||bike?'':'<th>Passos</th>'}</tr></thead><tbody>${rows.map((x,i)=>{const v=vals[i];const w=bike?pct(v,best):(worst===best?100:40+60*(worst-v)/(worst-best));
    return`<tr class="${v===best&&rows.length>1?'best':''}"><td>${x.lbl}</td><td>${bike?fmtD(v)+' km/h':fmtPace(v)}</td><td class="bar"><i style="width:${Math.max(6,Math.min(100,w))}%"></i></td>${r.stepsEst||bike?'':`<td>${fmtN(x.st)}</td>`}</tr>`}).join('')}</tbody></table></div></div>`;
}
function runStatsHtml(r){
  const cad=r.moving&&r.steps&&!r.stepsEst?Math.round(r.steps/(r.moving/60)):null;
  return`<div class="grid3"><div class="stat"><span class="num">${km2(r.dist)}</span><small>km</small></div><div class="stat"><span class="num">${fmtDur(r.moving*1000).replace(/^00:/,'')}</span><small>tempo em movimento</small></div><div class="stat"><span class="num">${r.type==='bike'?fmtD(r.moving?r.dist/r.moving*3.6:0):fmtPace(r.dist?r.moving/(r.dist/1000):0)}</span><small>${r.type==='bike'?'km/h médio':'ritmo médio /km'}</small></div>
  ${r.type==='bike'?'':`<div class="stat"><span class="num">${fmtN(r.steps||0)}</span><small>passos${r.stepsEst?' (estimados)':''}</small></div><div class="stat"><span class="num">${cad||'—'}</span><small>cadência (passos/min)</small></div>`}<div class="stat"><span class="num">+${fmtN(r.elev||0)}</span><small>m de subida</small></div>
  <div class="stat"><span class="num">${fmtN(r.kcal||0)}</span><small>kcal estimadas</small></div><div class="stat"><span class="num">${fmtDur((r.elapsed||r.moving)*1000).replace(/^00:/,'')}</span><small>tempo total</small></div>${r.best1k?`<div class="stat"><span class="num">${fmtPace(r.best1k)}</span><small>melhor 1 km</small></div>`:''}</div>`;
}
function runDetail(s,fresh){
  const r=s.run;
  openSheet(fresh?'Atividade salva':s.name,`${fresh?`<h2>${esc(s.name)}</h2>`:''}<p class="muted">${esc(dlabel(s.date,{weekday:'long',day:'numeric',month:'long'}))} · ${new Date(s.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</p>
   <div class="route">${routeSvg(r.pts)}</div>${(r.prs||[]).length?`<div class="chips">${r.prs.map(p=>`<span class="chip pr">${esc(p.l)}: ${esc(p.v)}</span>`).join('')}</div>`:''}
   <div class="card">${runStatsHtml(r)}</div>${splitsHtml(r)}
   ${fresh?'<button class="btn primary block" data-close>Fechar</button>':'<button class="btn danger block" data-s="del">Apagar esta atividade</button>'}`,(b,el)=>{

  });

const weekStart=d=>addDays(d,-((new Date(d+'T12:00:00').getDay()+6)%7));
function runKmBetween(a,b,type){return sessList().filter(s=>s.run&&(!type||s.run.type===type)&&s.date>=a&&s.date<b).reduce((t,s)=>t+s.run.dist/1000,0)}

  :`<p class="hint">A gravação com GPS, mapa e passos funciona no app ATHOS para Android. As atividades gravadas lá aparecem aqui quando você importa o backup.</p>`}</div>`;

function runEvoCard(){

  const ws=weekStart(today());const items=Array.from({length:8},(_,i)=>{const a=addDays(ws,-7*(7-i));return{l:new Date(a+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),v:r1(runKmBetween(a,addDays(a,7)))}});
  const R=runs.filter(s=>s.run.type==='run').map(s=>s.run);const tot=runs.reduce((t,s)=>t+s.run.dist,0)/1000,steps=runs.reduce((t,s)=>t+(s.run.steps||0),0);
  const minBy=(arr,f)=>{const v=arr.map(f).filter(x=>x&&isFinite(x));return v.length?Math.min(...v):null};
  const longest=R.length?Math.max(...R.map(r=>r.dist)):0,b1=minBy(R,r=>r.best1k),b5=minBy(R,r=>r.best5k),bp=minBy(R.filter(r=>r.dist>=3000),r=>r.moving/(r.dist/1000));
  const rec=[longest&&['Maior corrida',km2(longest)+' km'],b1&&['Melhor 1 km',fmtPace(b1)],b5&&['Melhor 5 km',fmtDur(b5*1000).replace(/^00:/,'')],bp&&['Melhor ritmo médio (3 km+)',fmtPace(bp)+'/km']].filter(Boolean);

}

const sheets=[];
function openSheet(title,html,mount){
  const el=document.createElement('div');el.className='wrapS';
  el.innerHTML=`<div class="scrim" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Fechar">✕</button></header><div class="sheet-b">${html}</div></section>`;
  el.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet(el)});
  $('#sheets').appendChild(el);sheets.push(el);document.body.classList.add('locked');
  if(mount)mount(el.querySelector('.sheet-b'),el);return el;

function closeSheet(el){const i=el?sheets.indexOf(el):sheets.length-1;if(i<0)return;const[s]=sheets.splice(i,1);s.remove();if(!sheets.length&&$('#session').hidden)document.body.classList.remove('locked')}

function pickExercise(cb){
  let q='',grp='';
  openSheet('Escolher exercício',`<input id="xq" type="search" placeholder="Buscar exercício" aria-label="Buscar exercício"><div class="chips" id="xg">${['',...GROUPS].map(g=>`<button class="chip" data-g="${g}" aria-pressed="${g===grp}">${g||'Todos'}</button>`).join('')}</div><div id="xl" style="display:flex;flex-direction:column;gap:6px"></div>`,(b,el)=>{
    const draw=()=>{const n=norm(q);const list=allExercises().filter(e=>(!grp||e.group===grp)&&(!n||norm(e.name).includes(n)));
      b.querySelector('#xl').innerHTML=list.map(e=>`<button class="result" data-x="${esc(e.name)}"><span><b>${esc(e.name)}</b><br><small>${esc(e.group)}${e.type==='t'?' · tempo':e.type==='bw'?' · peso do corpo':''}</small></span><span class="muted">+</span></button>`).join('')+(q.trim()&&!list.some(e=>norm(e.name)===n)?`<div class="picked"><b>Criar “${esc(q.trim())}”</b><div class="grid2"><select id="ng" aria-label="Grupo muscular">${GROUPS.map(g=>`<option ${g===(grp||'Outros')?'selected':''}>${g}</option>`).join('')}</select><select id="nt" aria-label="Tipo"><option value="w">Com carga</option><option value="bw">Peso do corpo</option><option value="t">Por tempo</option></select></div><button class="btn primary" data-s="create">Criar e adicionar</button></div>`:'')};
    draw();
    b.querySelector('#xq').oninput=e=>{q=e.target.value;draw()};
    b.onclick=e=>{const g=e.target.closest('[data-g]');if(g){grp=g.dataset.g;b.querySelectorAll('#xg .chip').forEach(c=>c.setAttribute('aria-pressed',c===g));draw();return}
      const x=e.target.closest('[data-x]');if(x){const ex=allExercises().find(a=>a.name===x.dataset.x);closeSheet(el);cb(ex);return}
      if(e.target.closest('[data-s=create]')){const ex={name:q.trim().slice(0,60),group:b.querySelector('#ng').value,type:b.querySelector('#nt').value};S.profile.customEx=[...(S.profile.customEx||[]),ex];store.mark('profile');closeSheet(el);cb(ex)}};
  });
}
function templateSheet(tid,draft){
  const orig=tid?S.profile.templates.find(x=>x.id===tid):null;
  const t=draft||(orig?clone(orig):{id:newId('t'),name:'',exercises:[]});
  openSheet(orig?'Editar treino':'Novo treino','',(b,el)=>{
    const draw=()=>{b.innerHTML=`<label class="fld"><span>Nome</span><input id="tName" value="${esc(t.name)}" placeholder="Ex.: Treino A — Peito e tríceps"></label>
      <label class="fld"><span>Playlist do treino (opcional)</span><input id="tMusic" value="${esc(t.music||'')}" placeholder="Cole o link do YouTube Music ou do Spotify" inputmode="url" autocomplete="off"></label>
      <div style="display:flex;flex-direction:column;gap:6px">${t.exercises.map((x,i)=>`<div class="tex"><div style="min-width:0;display:flex;flex-direction:column"><b>${esc(x.name)}</b><small>${esc(x.group||'')}</small><button class="demo-b" data-demo="${esc(x.name)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg> Como fazer</button></div><label><input inputmode="numeric" data-i="${i}" data-f="sets" value="${x.sets}" aria-label="Séries"><span class="mini-l">séries</span></label><label><input data-i="${i}" data-f="reps" value="${esc(x.reps)}" aria-label="${x.type==='t'?'Minutos':'Repetições'}"><span class="mini-l">${x.type==='t'?'min':'reps'}</span></label><div class="act"><button data-s="up" data-i="${i}" aria-label="Subir" ${i?'':'disabled'}>↑</button><button data-s="del" data-i="${i}" aria-label="Remover">✕</button></div></div>`).join('')||'<p class="hint">Nenhum exercício ainda.</p>'}</div>
      <button class="btn ghost block" data-s="add">+ Adicionar exercício</button>
      <div class="btns">${orig?'<button class="btn danger" data-s="delT">Excluir treino</button>':''}<button class="btn primary" data-s="save">Salvar treino</button></div>`};
    draw();
    b.oninput=e=>{const i=e.target.dataset.i;if(e.target.id==='tName')t.name=e.target.value;else if(e.target.id==='tMusic')t.music=e.target.value.trim();else if(i!=null){const f=e.target.dataset.f;t.exercises[i][f]=f==='sets'?Math.max(1,Math.min(10,parseInt(e.target.value)||1)):e.target.value}};
    b.onclick=e=>{const s=e.target.closest('[data-s]');if(!s)return;const i=+s.dataset.i;
      switch(s.dataset.s){
        case'up':if(i>0){[t.exercises[i-1],t.exercises[i]]=[t.exercises[i],t.exercises[i-1]];draw()}break;
        case'del':t.exercises.splice(i,1);draw();break;
        case'add':pickExercise(ex=>{t.exercises.push({name:ex.name,group:ex.group,type:ex.type,sets:3,reps:ex.type==='t'?'20':'8-12'});draw()});break;
        case'save':{if(!t.name.trim()){toast('Dê um nome ao treino');return}if(t.music&&!musicLink(t.music)){toast('Esse link não parece ser do YouTube Music ou do Spotify');return}if(t.music)t.music=musicLink(t.music);if(!t.exercises.length){toast('Adicione pelo menos um exercício');return}
          const list=S.profile.templates;const k=list.findIndex(x=>x.id===t.id);if(k>=0)list[k]=t;else list.push(t);store.mark('profile');closeSheet(el);render();toast('Treino salvo');break}
        case'delT':confirmSheet(`Excluir “${t.name}”? O histórico de treinos feitos continua.`,'Excluir',()=>{S.profile.templates=S.profile.templates.filter(x=>x.id!==t.id);store.mark('profile');closeSheet(el);render()});break;
      }};
  });
}

const aiNote=()=>!AIHOST?'Usa um pouco do seu limite de uso do Claude.':(gemOn()||groqOn())?'Usa sua própria chave de IA e precisa de internet.':`Usa 1 dos seus ${SRV_LIMIT} usos de IA de hoje e precisa de internet.`;

const HTTP={};let httpN=0;
window.androidHttpDone=(id,status,text)=>{const r=HTTP[id];if(r){delete HTTP[id];r({status,text})}};
function nativeHttp(url,body,headers){if(!NATIVE)return fetch(url,{method:body==null?'GET':'POST',headers:{...(headers||{}),...(body==null?{}:{'Content-Type':'application/json'})},body:body==null?undefined:JSON.stringify(body)}).then(async r=>({status:r.status,text:await r.text()})).catch(()=>({status:-1,text:''}));return new Promise(res=>{const id='h'+(++httpN);HTTP[id]=res;try{NATIVE.http(id,url,body==null?null:JSON.stringify(body),JSON.stringify(headers||{}))}catch(e){delete HTTP[id];res({status:-1,text:''})}})}
const stripThink=t=>String(t||'').replace(/<think>[\s\S]*?<\/think>/gi,'').trim();

/* ----- Gemini ----- */
const GEM='https://generativelanguage.googleapis.com/v1beta/models';
const gemOn=()=>!!(AI.key&&AI.models&&AI.models.length);
async function gemModels(key){
  const r=await nativeHttp(GEM+'?pageSize=1000',null,{'x-goog-api-key':key});
  if(r.status<0)throw{code:'offline'};
  if([400,401,403].includes(r.status))throw{code:'bad_key'};
  if(r.status!==200)throw{code:'upstream_error'};
  const j=JSON.parse(r.text);
  const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  return(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>String(m.name).replace(/^models\//,''))
    .filter(n=>/^gemini-.*flash/.test(n)&&!/(tts|image|live|audio|embed|exp|native|transcrib|translat|omni|computer)/.test(n))
    .sort((a,b)=>(ver(b)-(/preview/.test(b)?.05:0))-(ver(a)-(/preview/.test(a)?.05:0))).slice(0,8);
}
function gemOrder(quick){const ms=AI.models||[];const lite=ms.filter(m=>/lite/.test(m)),full=ms.filter(m=>!/lite/.test(m));return quick?[...lite,...full]:[...full,...lite]}
async function callGemini(turns,b64s,json,quick){
  const contents=turns.map(t=>({role:t.role==='assistant'?'model':'user',parts:[{text:String(t.content)}]}));
  if(b64s.length){const last=contents[contents.length-1];last.parts=[...b64s.map(d=>({inline_data:{mime_type:'image/jpeg',data:d}})),...last.parts]}
  const body={contents,generationConfig:{temperature:0.4}};if(json)body.generationConfig.responseMimeType='application/json';
  let last={code:'upstream_error'};
  for(const m of gemOrder(quick).slice(0,4)){
    const r=await nativeHttp(`${GEM}/${m}:generateContent`,body,{'x-goog-api-key':AI.key});
    if(r.status===200){let j;try{j=JSON.parse(r.text)}catch(e){throw{code:'upstream_error'}}
      const c=j.candidates&&j.candidates[0];const t=c&&c.content?(c.content.parts||[]).map(p=>p.text||'').join(''):'';
      if(!t.trim()){if((j.promptFeedback&&j.promptFeedback.blockReason)||(c&&c.finishReason==='SAFETY'))throw{code:'refused'};last={code:'empty_completion'};continue}
      AI.used='Gemini · '+m;return t}
    if(r.status<0)throw{code:'offline'};
    if(r.status===401||r.status===403||(r.status===400&&/api[ _-]?key/i.test(r.text)))throw{code:'bad_key'};
    last=r.status===429?{code:'rate_limited'}:{code:'upstream_error'};
    if(![429,404,500,503,504].includes(r.status))break;
  }
  throw last;
}

/* ----- Groq (API compatível com OpenAI) ----- */
const GROQ='https://api.groq.com/openai/v1';
const groqOn=()=>!!(AI.groq&&AI.groq.key&&(AI.groq.text||AI.groq.vision));
const GROQ_VISION=['qwen/qwen3.8-27b','meta-llama/llama-4-scout-17b-16e-instruct','meta-llama/llama-4-maverick-17b-128e-instruct'];
const GROQ_TEXT=['openai/gpt-oss-120b','qwen/qwen3.8-27b','llama-3.3-70b-versatile','openai/gpt-oss-20b'];
const groqHdr=key=>({'Authorization':'Bearer '+key});
async function groqRaw(key,model,messages,json,maxTok,probe){
  const body={model,messages,temperature:0.4,max_completion_tokens:maxTok||4096};if(json)body.response_format={type:'json_object'};
  let r=await nativeHttp(GROQ+'/chat/completions',body,groqHdr(key));
  if(r.status===400&&json&&/response_format|json/i.test(r.text)){delete body.response_format;r=await nativeHttp(GROQ+'/chat/completions',body,groqHdr(key))}
  if(r.status===200){let j;try{j=JSON.parse(r.text)}catch(e){throw{code:'upstream_error'}}const t=stripThink(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content);if(!t){if(probe)return'ok';throw{code:'empty_completion'}}return t}
  if(r.status<0)throw{code:'offline'};if(r.status===401||r.status===403)throw{code:'bad_key'};if(r.status===429)throw{code:'rate_limited'};
  if(r.status===400&&/image|vision|content type|multimodal/i.test(r.text))throw{code:'images_unavailable'};
  throw{code:'upstream_error',status:r.status};
}
function groqMsgs(turns,b64s){
  return turns.map((t,i)=>{const role=t.role==='assistant'?'assistant':'user';
    if(i===turns.length-1&&b64s.length)return{role,content:[{type:'text',text:String(t.content)},...b64s.map(d=>({type:'image_url',image_url:{url:'data:image/jpeg;base64,'+d}}))]};
    return{role,content:String(t.content)}});
}
async function callGroq(turns,b64s,json){
  const g=AI.groq;const model=b64s.length?g.vision:(g.text||g.vision);if(!model)throw{code:'images_unavailable'};
  if(b64s.length<=3){const t=await groqRaw(g.key,model,groqMsgs(turns,b64s),json);AI.used='Groq · '+model;return t}
  // mais de 3 fotos: lê em partes de 3 e junta as listas
  const parts=[];for(let i=0;i<b64s.length;i+=3)parts.push(b64s.slice(i,i+3));const merged={};
  for(let k=0;k<parts.length;k++){
    const tt=turns.slice();const last=tt[tt.length-1];tt[tt.length-1]={...last,content:`${last.content}\n\n(Você está vendo a parte ${k+1} de ${parts.length} das fotos; responda só com o que aparece nelas.)`};
    const o=parseLoose(await groqRaw(g.key,model,groqMsgs(tt,parts[k]),true));
    for(const[key,v]of Object.entries(o||{})){if(Array.isArray(v))merged[key]=(merged[key]||[]).concat(v);else if(!(key in merged))merged[key]=v}
  }
  AI.used='Groq · '+model;return JSON.stringify(merged);
}
async function groqSetup(key){
  const r=await nativeHttp(GROQ+'/models',null,groqHdr(key));
  if(r.status<0)throw{code:'offline'};if(r.status===401||r.status===403)throw{code:'bad_key'};if(r.status!==200)throw{code:'upstream_error'};
  const ids=new Set(((JSON.parse(r.text).data)||[]).map(m=>m.id));
  const text=GROQ_TEXT.find(m=>ids.has(m))||null;let vision=null;
  if(text)await groqRaw(key,text,[{role:'user',content:'Responda apenas: ok'}],false,800,true);
  const tiny=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#d22';x.fillRect(0,0,64,64);return c.toDataURL('image/jpeg',.8).split(',')[1]})();
  for(const m of GROQ_VISION.filter(m=>ids.has(m))){
    try{await groqRaw(key,m,groqMsgs([{role:'user',content:'Qual é a cor desta imagem? Responda com uma palavra.'}],[tiny]),false,800,true);vision=m;break}
    catch(e){if(e.code==='bad_key'||e.code==='offline')throw e}
  }
  if(!text&&!vision)throw{code:'no_models'};
  return{key,text,vision,checked:Date.now()};
}

/* ----- IA do ATHOS (servidor, sem chave) ----- */
async function callServer(turns,b64s,json,quick){
  let res;try{res=await SOC.sb.functions.invoke('ai',{body:{turns,images:b64s,json:!!json,quick:!!quick}})}catch(e){throw{code:'offline'}}
  const{data,error}=res;
  if(error){let code='upstream_error';try{const ctx=error.context;if(ctx&&ctx.json){const j=await ctx.json();code=j.code||code}else if(/fetch|network/i.test(error.message||''))code='offline'}catch(e){}
    if(code==='user_limit'){AI.srvLeft=0;lsSet('ficha.ai',AI)}
    throw{code:code==='not_logged'?'not_granted':code}}
  if(!data||typeof data.text!=='string')throw{code:'upstream_error'};
  AI.srvLeft=data.remaining;AI.srvDay=today();lsSet('ficha.ai',AI);AI.used='IA do ATHOS · '+(data.used||'');return data.text;
}
async function srvRemaining(){try{const r=await sbq(SOC.sb.from('ai_usage').select('n').eq('user_id',SOC.user.id).eq('day',today()));AI.srvLeft=SRV_LIMIT-((r[0]&&r[0].n)||0);AI.srvDay=today();lsSet('ficha.ai',AI);render()}catch(e){}}
/* ----- roteador: chave própria (Gemini, Groq) e depois a IA do ATHOS ----- */
async function imgToB64(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const s=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85).split(',')[1]}
  catch(e){throw{code:'image_rejected'}}finally{URL.revokeObjectURL(url)}
}
async function aiCall(input,opts,json){
  opts=opts||{};
  const turns=typeof input==='string'?[{role:'user',content:input}]:input;
  let imgs=opts.images;imgs=imgs?(imgs instanceof Blob?[imgs]:[...imgs]):[];
  const b64s=[];for(const im of imgs)b64s.push(await imgToB64(im));
  const quick=opts.modelTier==='quick'&&!b64s.length;
  const provs=[];if(gemOn())provs.push('gemini');if(groqOn()&&(!b64s.length||AI.groq.vision))provs.push('groq');if(srvOn())provs.push('server');
  if(!provs.length)throw{code:b64s.length?'images_unavailable':'not_granted'};
  const errs=[];
  for(const p of provs){
    try{return p==='gemini'?await callGemini(turns,b64s,json,quick):p==='groq'?await callGroq(turns,b64s,json):await callServer(turns,b64s,json,quick)}
    catch(e){if(e.code==='offline'||e.code==='refused'||e.code==='image_rejected')throw e;errs.push(e)}
  }
  if(errs.some(e=>e.code==='user_limit')&&errs.every(e=>e.code==='user_limit'||e.code==='rate_limited'))throw{code:'user_limit'};
  if(errs.every(e=>e.code==='rate_limited'))throw{code:'rate_limited'};
  throw errs.find(e=>e.code==='bad_key')||errs[errs.length-1];
}
function parseLoose(t){t=stripThink(t);try{return JSON.parse(t)}catch(e){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}throw{code:'invalid_json',text:t}}
function aiSample(){const f=async(input,opts)=>({text:await aiCall(input,opts,false),truncated:false});f.json=async(input,opts)=>parseLoose(await aiCall(input,opts,true));f.limits=async()=>({maxPromptBytes:262144,images:{maxCount:6,maxInputBytes:20e6,mediaTypes:['image/jpeg','image/png','image/webp']}});return f}
const aiOn=()=>gemOn()||groqOn()||srvOn();
function aiActivate(){SAMPLE=aiOn()?aiSample():null;SAMPLE_IMG=!!(gemOn()||(groqOn()&&AI.groq.vision)||srvOn());MAXIMG=SAMPLE_IMG?6:1}
